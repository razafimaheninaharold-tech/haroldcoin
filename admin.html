<script>
const U="https://kgmatxqbdyusxpiuavbw.supabase.co",K="sb_publishable_vn5kPYncLS3TtBS75hSFew_LjeISc47";const S=supabase.createClient(U,K);
let T=window.Telegram?.WebApp,uid=T?.initDataUnsafe?.user?.id+""||localStorage.getItem('uid')||'12345';localStorage.setItem('uid',uid);
let b=909.84,minerLevel=6;
function switchTab(tab){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));document.getElementById(tab+'Section').classList.add('active');document.getElementById('nav-'+tab).classList.add('active');if(tab=='miners')setTimeout(drawChart,100);window.scrollTo(0,0);}
function getSpeed(l){if(l<=10)return 0.20;if(l<=72)return 0.20+(l-10)*0.008;return 0.70+(l-72)*0.02;}
function getPrice(l){if(l==1)return 0;if(l==2)return 317;if(l==3)return 323;if(l==4)return 333;if(l<=20)return Math.floor(300+l*15);if(l<=72)return Math.floor(400+l*20);if(l<=100)return Math.floor(500+l*25);if(l<=150)return Math.floor(800+l*28);return Math.floor(1000+l*30);}
function showPop(t){let p=document.createElement('div');p.className='levelup';p.textContent=t;document.body.appendChild(p);setTimeout(()=>p.remove(),2000);}
function claimMining(){b+=0.001;r();showPop('✨ +0.001 HRD!');}
function renderMiners(){let g=document.getElementById('minerGrid');g.innerHTML='';for(let l=1;l<=200;l++){let s=getSpeed(l),pr=getPrice(l),act=l==minerLevel,next=l==minerLevel+1,cls=act?'miner-card active':next?'miner-card next':'miner-card locked';let btn=act?'<button class="btn" style="width:100%;height:30px;background:linear-gradient(90deg,#22c55e,#4ade80);border:none;border-radius:10px;font-weight:900;font-size:10px">ACTIVE</button>':next?`<button onclick="buyLevel(${l})" style="width:100%;height:30px;background:linear-gradient(90deg,#facc15,#f9e79f);border:none;border-radius:10px;font-weight:900;font-size:10px">UNLOCK ${l}</button>`:'<button style="width:100%;height:30px;background:rgba(255,255,255,0.08);border:none;border-radius:10px;color:#666;font-weight:800;font-size:10px">LOCKED</button>';g.innerHTML+=`<div class="${cls}" style="padding:10px;border-radius:18px;background:linear-gradient(180deg,rgba(22,22,10,0.95),rgba(10,10,5,0.95));border:1px solid rgba(212,175,55,0.25)"><div style="font-size:9px;color:#d4af37">Lvl ${l}</div><div style="background:rgba(0,0,0,0.5);border-radius:10px;padding:6px;text-align:center;margin:6px 0"><div style="color:#22c55e;font-weight:900">${pr==0?'0':(pr/1000).toFixed(3)}$</div></div><div style="font-size:10px;display:flex;justify-content:space-between"><span>Speed</span><b style="color:#d4af37">${s.toFixed(2)} TH/s</b></div>${btn}</div>`;}document.getElementById('lvlDisplay').textContent=minerLevel;document.getElementById('pnlLevel').textContent=minerLevel;document.getElementById('pnlPeak').textContent=minerLevel;document.getElementById('speedDisplay').textContent=getSpeed(minerLevel).toFixed(2);}
function buyLevel(l){if(l!=minerLevel+1){showPop('Debloque '+(minerLevel+1)+' dabord!');return;}minerLevel=l;r();renderMiners();showPop('🚀 Lvl '+l+'!');}
function drawChart(){let c=document.getElementById('pnlChart');if(!c)return;let ctx=c.getContext('2d');let w=c.width=c.clientWidth*2;let h=c.height=c.clientHeight*2;ctx.clearRect(0,0,w,h);ctx.beginPath();ctx.strokeStyle='#22c55e';ctx.lineWidth=3;for(let i=0;i<40;i++){let x=(i/39)*w,y=h-(Math.pow(i/39,0.8)*h*0.7+Math.random()*5)-10;if(i==0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.stroke();}
function r(){document.getElementById('balDisplay').textContent=b.toFixed(2)+' HRD';document.getElementById('usdDisplay').textContent='~$'+(b*0.0676).toFixed(2)+' USD';document.getElementById('claimAmt').textContent='0.001';}
async function ld(){try{let {data:d}=await S.from('harold_users').select('*').eq('id',parseInt(uid)).single();if(d&&d.mining_level)minerLevel=d.mining_level;}catch{}r();renderMiners();drawChart();}
function copyRef(){let l=document.getElementById('refLink').value;navigator.clipboard.writeText(l).then(()=>showPop('Copié!'));}
function calcWd(){let a=parseInt(document.getElementById('wdAmount').value||'0')||0;let br=a/1000000*0.05,fee=br*0.1,net=br-fee;document.getElementById('wdTon').textContent=net.toFixed(6)+' TON NET';return{a,net,fee};}
async function requestWithdraw(){let {a,net,fee}=calcWd();if(a<50000){alert('Min 50k!');return}let w=localStorage.getItem('tonWallet')||'';if(!w){alert('Connecte Tonkeeper!');return}try{await S.from('withdrawals').insert({user_id:parseInt(uid),amount_coins:a,amount_ton:net,fee_ton:fee,wallet:w,status:'pending'});b-=a/1000000;r();showPop('✅ Retrait!');}catch(e){alert(e.message);}}
setInterval(r,2000);ld();
let tonConnectUI;try{tonConnectUI=new TON_CONNECT_UI.TonConnectUI({manifestUrl:'https://razafimaheninaharold-tech.github.io/haroldcoin/tonconnect-manifest.json',buttonRootId:'ton-connect'});}catch{}
