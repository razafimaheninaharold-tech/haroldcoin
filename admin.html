<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>👑 ADMIN V8.9.5</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/tonweb@0.0.66/dist/tonweb.min.js"></script>
<style>
body{background:#0e0e15;color:#fff;font-family:system-ui;padding:10px}
.b{padding:8px 14px;border-radius:10px;border:0;font-weight:900;margin:3px;cursor:pointer}
.card{background:#1c1c2a;border:2px solid #333;border-radius:12px;padding:12px;margin:10px 0;word-break:break-all}
.addr{background:#111;padding:10px;border-radius:10px;font-size:11px;margin:6px 0;border:1.5px dashed #ffd700;cursor:pointer}
.copyBtn{padding:8px 14px;border-radius:8px;border:0;font-weight:900;margin:3px}
</style>
</head>
<body>
<h2>👑 ADMIN RETRAITS - V8.9.5</h2>
<div style="font-size:11px;opacity:.8">RAW → UQ auto | Supabase | Fix Brut</div>
<button class="b" style="background:#ffcc00;color:#000" onclick="setF('pending')">PENDING</button>
<button class="b" style="background:#22c55e" onclick="setF('approved')">APPROVED</button>
<button class="b" style="background:#3b82f6" onclick="setF('paid')">PAID</button>
<button class="b" style="background:#444;color:#fff" onclick="setF('all')">TOUS</button>
<button class="b" style="background:#fff;color:#000" onclick="loadWd()">🔄 REFRESH</button>
<div id="stats" style="margin:8px 0;font-size:12px"></div>
<div id="list">Chargement...</div>
<script>
const SUPA_URL="https://kgmatxqbdyusxpiuavbw.supabase.co";
const SUPA_KEY="sb_publishable_vn5kPYncLS3TtBS75hSFew_LjeISc47";
const supa=supabase.createClient(SUPA_URL,SUPA_KEY);
let filter='paid', all=[];

function rawToUQ(raw){
 try{
  if(!raw) return 'N/A';
  raw=raw.trim();
  if(raw.startsWith('UQ')||raw.startsWith('EQ')) return raw; // deja friendly
  if(raw.startsWith('0:')){
   const TonWeb = window.TonWeb;
   if(TonWeb){
     const addr = new TonWeb.utils.Address(raw);
     return addr.toString(true,true,true,false); // bounceable, friendly
   }
  }
  return raw;
 }catch(e){ 
  // fallback manuel pour TON wallet principal
  if(raw.includes('0d606bb005736e57686617bb1a26b8751855c')) return 'UQANf2kJ6K4aO1dXyYxY...lxkc (ton wallet)';
  return raw; 
 }
}

function setF(f){filter=f;render();}
async function loadWd(){
 try{
  let {data}=await supa.from('withdrawals').select('*').order('created_at',{ascending:false}).limit(100);
  all=data||[]; render();
 }catch(e){ document.getElementById('stats').innerText='Erreur '+e.message; }
}
function render(){
 let f=all; if(filter!=='all') f=all.filter(x=>x.status===filter);
 let total=f.reduce((s,x)=>s+parseFloat(x.amount_ton_net||x.amount_ton||0),0);
 document.getElementById('stats').innerText=`${f.length} retraits | Total: ${total.toFixed(6)} TON | Filtre: ${filter} | Supabase`;
 let h='';
 f.forEach(w=>{
  let coins=w.amount_coins||0;
  let brut=parseFloat(w.amount_ton_brut||0); if(brut==0) brut=parseFloat(w.amount_ton_net||0)/0.9;
  let fee=brut*0.1; let net=parseFloat(w.amount_ton_net||w.amount_ton||0);
  let raw=w.wallet||'N/A';
  let friendly=rawToUQ(raw);
  let user=w.user_id||'N/A'; let status=w.status; let date=new Date(w.created_at).toLocaleString();
  h+=`<div class="card" style="border-color:#3b82f6">
  <b>${coins.toLocaleString()} → ${net.toFixed(6)} TON NET</b><br>
  Brut: ${brut.toFixed(6)} | Fee: ${fee.toFixed(6)}<br>
  User: ${user} | ${status.toUpperCase()} | ${date}<br>
  <div style="margin-top:6px"><b style="color:#22c55e">💰 Wallet UQ (à payer):</b>
  <div class="addr" onclick="copyT('${friendly}')" style="background:#0f2a1a;border-color:#22c55e;color:#22ff88;font-weight:900;font-size:13px">✅ ${friendly}<br><small style="color:#ffd700">CLIQUE POUR COPIER UQ</small></div>
  <details><summary style="font-size:10px;color:#888">Voir RAW (0:...)</summary><div class="addr" onclick="copyT('${raw}')" style="font-size:10px;color:#888">${raw}</div></details>
  </div>
  <div>
  <button class="copyBtn" style="background:#22c55e" onclick="copyT('${friendly}')">💸 COPY UQ POUR PAYER</button>
  <button class="copyBtn" style="background:#555;color:#fff" onclick="copyT('${raw}')">COPY RAW</button>
  <button class="copyBtn" style="background:#ffcc00;color:#000" onclick="copyT('${net}')">COPY ${net.toFixed(6)}</button>
  <button class="copyBtn" style="background:#3b82f6;color:#fff" onclick="updateStatus(${w.id},'paid')">PAID</button>
  </div></div>`;
 });
 document.getElementById('list').innerHTML=h||'Aucun retrait';
}
function copyT(t){navigator.clipboard.writeText(t).then(()=>alert('Copié ✅: '+t.slice(0,30)+'...'));}
async function updateStatus(id,s){await supa.from('withdrawals').update({status:s}).eq('id',id);loadWd();}
loadWd(); setInterval(loadWd,15000);
</script>
</body>
</html>
