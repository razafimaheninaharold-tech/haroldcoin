<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>👑 ADMIN V8.9.9 BOT NOTIF</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/tonweb@0.0.66/dist/tonweb.min.js"></script>
<style>
*{box-sizing:border-box}body{background:#0e0e15;color:#fff;font-family:-apple-system,system-ui;padding:10px;margin:0}
.b{padding:10px 14px;border-radius:12px;border:0;font-weight:900;margin:3px;cursor:pointer;font-size:12px}
.card{background:#1c1c2a;border:2px solid #333;border-radius:16px;padding:14px;margin:12px 0;word-break:break-all;box-shadow:0 4px 15px rgba(0,0,0,.5)}
.addr{background:#0f2a1a;padding:12px;border-radius:12px;font-size:12px;margin:8px 0;border:2px dashed #22c55e;cursor:pointer;color:#4ade80;font-weight:800}
.addr-raw{background:#111;padding:8px;border-radius:8px;font-size:10px;margin:4px 0;border:1px dashed #444;color:#888;cursor:pointer}
.copyBtn{padding:10px 16px;border-radius:10px;border:0;font-weight:900;margin:4px 3px;cursor:pointer;font-size:11px}
.txInput{width:100%;padding:10px;background:#111;border:1.5px solid #ffd700;border-radius:10px;color:#fff;margin:8px 0;font-size:11px}
.txLink{background:#0a2a4a;padding:8px;border-radius:8px;margin:6px 0;border:1px solid #3b82f6}
#notifBar{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#22c55e;color:#000;padding:12px 20px;border-radius:25px;font-weight:900;z-index:99999;box-shadow:0 5px 20px rgba(0,0,0,.7);display:none;text-align:center;max-width:92%;font-size:13px;animation:pop .4s}
@keyframes pop{0%{transform:translateX(-50%) scale(0)}100%{transform:translateX(-50%) scale(1)}}
</style>
</head>
<body>
<div id="notifBar"></div>
<h2>👑 ADMIN V8.9.9 BOT NOTIF</h2>
<div style="font-size:11px;opacity:.7;margin-bottom:10px">✅ Supabase | ✅ RAW→UQ | ✅ Brut FIX | ✅ Preuve TonScan | ✅ Bot Telegram</div>
<div style="display:flex;flex-wrap:wrap">
<button class="b" style="background:#ffcc00;color:#000" onclick="setF('pending')">PENDING</button>
<button class="b" style="background:#22c55e;color:#fff" onclick="setF('approved')">APPROVED</button>
<button class="b" style="background:#3b82f6;color:#fff" onclick="setF('paid')">PAID</button>
<button class="b" style="background:#444;color:#fff" onclick="setF('all')">TOUS</button>
<button class="b" style="background:#fff;color:#000" onclick="loadWd()">🔄 REFRESH</button>
<button class="b" style="background:#222;color:#ffd700;border:1px solid #ffd700" onclick="askNotif()">🔔 Notif Chrome</button>
</div>
<div id="stats" style="margin:12px 0;font-size:12px;background:#1a1a2a;padding:8px;border-radius:8px"></div>
<div id="list">Chargement Supabase...</div>

<script>
const SUPA_URL="https://kgmatxqbdyusxpiuavbw.supabase.co";
const SUPA_KEY="sb_publishable_vn5kPYncLS3TtBS75hSFew_LjeISc47";
const BOT_TOKEN="METS_TON_TOKEN_ICI"; // <-- METS TON TOKEN ICI ENTRE GUILLEMETS
const BOT_USERNAME="Haroldcoinsbot";
const supa=supabase.createClient(SUPA_URL,SUPA_KEY);
let filter='pending';
let all=[];
let lastPendingCount=0;
let firstLoad=true;

function rawToUQ(raw){
 try{
  if(!raw) return 'N/A';
  raw=String(raw).trim();
  if(raw.startsWith('UQ') || raw.startsWith('EQ')) return raw;
  if(raw.startsWith('0:')){
   try{ const addr=new TonWeb.utils.Address(raw); return addr.toString(true,true,true,false); }catch(e){return raw;}
  }
  return raw;
 }catch(e){return raw;}
}
function setF(f){filter=f;render();}
function askNotif(){ if('Notification' in window){ Notification.requestPermission().then(p=>{ if(p==='granted') showBar('🔔 Notifications Chrome activées!'); }); } }
function showBar(msg, bg='#ffcc00'){
 let bar=document.getElementById('notifBar');
 bar.style.background=bg;
 bar.innerHTML=msg;
 bar.style.display='block';
 if(navigator.vibrate) navigator.vibrate([200,100,200]);
 setTimeout(()=>{bar.style.display='none';},5000);
}
async function loadWd(){
 document.getElementById('stats').innerText='🔄 Chargement Supabase...';
 try{
  let {data,error}=await supa.from('withdrawals').select('*').order('created_at',{ascending:false}).limit(150);
  if(error) throw error;
  let pendingNow=(data||[]).filter(x=>x.status==='pending').length;
  if(!firstLoad && pendingNow>lastPendingCount){
    let diff=pendingNow-lastPendingCount;
    showBar(`💰 NOUVEAU RETRAIT! +${diff} PENDING! (${pendingNow} total)`, '#ffcc00');
    if('Notification' in window && Notification.permission==='granted'){
      new Notification('💰 Harold Coins - Nouveau retrait!',{body:`${diff} nouveau retrait. Total: ${pendingNow} PENDING`});
    }
    try{ let a=new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg'); a.play(); }catch{}
  }
  lastPendingCount=pendingNow;
  firstLoad=false;
  all=data||[];
  render();
 }catch(e){ document.getElementById('stats').innerText='❌ Erreur: '+e.message; }
}
function render(){
 let f=all;
 if(filter!=='all') f=all.filter(x=>x.status===filter);
 let total=f.reduce((s,x)=>{ let c=x.amount_coins||0; let net=c/1000000*0.1*0.9; if(x.amount_ton_net>0) net=x.amount_ton_net; return s+parseFloat(net||0); },0);
 document.getElementById('stats').innerHTML=`<b>${f.length}</b> retraits | Total NET: <b style="color:#22c55e">${total.toFixed(6)} TON</b> | Filtre: <b>${filter.toUpperCase()}</b> | PENDING: <b style="color:#ffcc00">${all.filter(x=>x.status==='pending').length}</b>`;
 if(f.length==0){ document.getElementById('list').innerHTML=`<div style="padding:20px;text-align:center;color:#888">Aucun retrait <b>${filter}</b></div>`; return; }
 let h='';
 f.forEach(w=>{
  let coins=parseInt(w.amount_coins||0);
  let brut=coins/1000000*0.1;
  let fee=brut*0.1;
  let net=brut*0.9;
  let dbBrut=parseFloat(w.amount_ton_brut||0);
  let dbNet=parseFloat(w.amount_ton_net||w.amount_ton||0);
  if(dbBrut>0) brut=dbBrut;
  if(dbNet>0) net=dbNet;
  if(dbBrut>0 && dbNet==0) net=dbBrut*0.9;
  if(brut==0) brut=coins/1000000*0.1;
  if(net==0) net=brut*0.9;
  fee=brut-net;
  let raw=w.wallet||'N/A';
  let friendly=rawToUQ(raw);
  let status=w.status||'pending';
  let date=w.created_at?new Date(w.created_at).toLocaleString('fr-FR') : '';
  let color=status=='paid'?'#3b82f6':status=='approved'?'#22c55e':'#ffcc00';
  let tx=w.tx_hash||'';
  h+=`<div class="card" style="border-color:${color}">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <b style="font-size:15px">${coins.toLocaleString('fr-FR')} 🪙 → <span style="color:#22c55e">${net.toFixed(6)} TON NET</span></b>
    <span style="background:${color};color:#000;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:900">${status.toUpperCase()}</span>
  </div>
  <div style="font-size:12px;margin:6px 0;line-height:1.4">
    Brut: <b style="color:#ffd700">${brut.toFixed(6)} TON</b> | Fee 10%: <span style="color:#ff6b6b">${fee.toFixed(6)}</span><br>
    User: <b>${w.user_id}</b> | ${date}
  </div>
  <div style="margin-top:8px">
    <b style="color:#22c55e;font-size:12px">💰 Wallet à PAYER:</b>
    <div class="addr" onclick="copyT('${friendly}')">✅ ${friendly}<br><small style="color:#ffd700">CLIQUE POUR COPIER → TONKEEPER</small></div>
    <details style="margin-top:4px"><summary style="font-size:10px;color:#666;cursor:pointer">Voir RAW 0:... </summary>
    <div class="addr-raw" onclick="copyT('${raw}')">${raw}</div></details>
  </div>
  ${tx?`<div class="txLink"><b style="font-size:11px;color:#60a5fa">🔗 Preuve:</b><br><a href="https://tonscan.org/tx/${tx}" target="_blank" style="color:#60a5fa;word-break:break-all;font-size:11px">${tx}</a></div>`:''}
  <div style="margin-top:8px">
    <b style="font-size:11px;color:#ffd700">📝 HASH TX Tonkeeper:</b>
    <input id="tx-${w.id}" class="txInput" placeholder="Colle hash TX ici" value="${tx}">
  </div>
  <div style="margin-top:10px;display:flex;flex-wrap:wrap">
    <button class="copyBtn" style="background:#22c55e;color:#000" onclick="copyT('${friendly}')">💸 COPY UQ</button>
    <button class="copyBtn" style="background:#ffcc00;color:#000" onclick="copyT('${net.toFixed(6)}')">COPY ${net.toFixed(6)} TON</button>
    <button class="copyBtn" style="background:#444;color:#fff" onclick="copyT('${raw}')">COPY RAW</button>
    <button class="copyBtn" style="background:#3b82f6;color:#fff" onclick="saveTx('${w.id}')">💾 SAVE + PAID + BOT</button>
  </div>
  </div>`;
 });
 document.getElementById('list').innerHTML=h;
}
function copyT(t){
 navigator.clipboard.writeText(t).then(()=>{
  let el=document.createElement('div');
  el.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#22c55e;color:#000;padding:10px 20px;border-radius:20px;font-weight:900;z-index:9999';
  el.textContent='Copié ✅';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2000);
 });
}
async function saveTx(id){
 let hashEl=document.getElementById('tx-'+id);
 let hash=hashEl.value.trim();
 if(!hash){alert('Colle le HASH TX de Tonkeeper!');return;}
 if(hash.length<10){alert('Hash trop court!');return;}
 if(BOT_TOKEN==="METS_TON_TOKEN_ICI"){ alert('⚠️ Mets ton BOT_TOKEN en haut du fichier ligne 15!'); }
 try{
  let wd=all.find(x=>String(x.id)==String(id));
  if(!wd){alert('Retrait introuvable');return;}
  let {error}=await supa.from('withdrawals').update({status:'paid',tx_hash:hash}).eq('id',id);
  if(error){
    if(error.message.includes('tx_hash')){alert('❌ Ajoute colonne tx_hash text dans Supabase: ALTER TABLE withdrawals ADD COLUMN tx_hash text;');}
    else throw error;
    return;
  }
  all=all.map(x=>{if(String(x.id)==String(id)){x.status='paid'; x.tx_hash=hash;} return x;});
  render();
  showBar('✅ Preuve sauvée! Envoi bot...', '#22c55e');
  
  // BOT NOTIF
  let coins=wd.amount_coins||0;
  let tonNet=wd.amount_ton_net||wd.amount_ton||0;
  let msg=`💸 *Retrait Payé!* ✅\n\n💰 ${coins.toLocaleString('fr-FR')} 🪙 → ${parseFloat(tonNet).toFixed(6)} TON\n🔗 Preuve:\nhttps://tonscan.org/tx/${hash}\n\n👛 Vérifie ton Tonkeeper!\nMerci Harold Coins 👑`;
  
  if(BOT_TOKEN!=="METS_TON_TOKEN_ICI"){
    try{
      await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          chat_id:wd.user_id,
          text:msg,
          parse_mode:'Markdown',
          reply_markup:{inline_keyboard:[[{text:'🔍 Voir sur TonScan', url:`https://tonscan.org/tx/${hash}`}]]}
        })
      });
      showBar(`✅ Bot notifié user ${wd.user_id}!`, '#22c55e');
    }catch(botErr){
      showBar('✅ PAID mais bot échoué - vérifie token', '#facc15');
      console.log(botErr);
    }
  } else {
    showBar('✅ PAID + Preuve OK (bot token manquant)', '#facc15');
  }
 }catch(e){alert('Erreur: '+e.message);}
}
loadWd();
setInterval(loadWd, 8000);
if('Notification' in window && Notification.permission==='default'){ setTimeout(()=>{ Notification.requestPermission(); },2000); }
</script>
</body>
</html>
