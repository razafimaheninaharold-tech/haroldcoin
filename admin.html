<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>👑 ADMIN RETRAITS V8.9.4</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:#0e0e15;color:#fff;font-family:system-ui;padding:10px;margin:0}
.b{padding:8px 14px;border-radius:10px;border:0;font-weight:900;margin:3px;cursor:pointer}
.card{background:#1c1c2a;border:2px solid #333;border-radius:12px;padding:12px;margin:10px 0;word-break:break-all}
.addr{background:#111;padding:8px;border-radius:8px;font-size:11px;margin:6px 0;border:1px dashed #ffd700;cursor:pointer}
.copyBtn{background:#2a7cff;color:#fff;border:0;padding:7px 12px;border-radius:8px;font-size:11px;font-weight:900;margin:3px;cursor:pointer}
small{color:#aaa}
</style>
</head>
<body>
<h2>👑 ADMIN RETRAITS - V8.9.4</h2>
<div style="font-size:11px;opacity:.8;margin-bottom:8px">Auto 15s | 1M=0.1 TON | Frais 10% | Supabase Bridge | FIX Brut+Copy</div>
<button class="b" style="background:#ffcc00;color:#000" onclick="setF('pending')">PENDING</button>
<button class="b" style="background:#22c55e" onclick="setF('approved')">APPROVED</button>
<button class="b" style="background:#3b82f6" onclick="setF('paid')">PAID</button>
<button class="b" style="background:#444;color:#fff" onclick="setF('all')">TOUS</button>
<button class="b" style="background:#fff;color:#000" onclick="loadWd()">🔄 REFRESH</button>
<div id="stats" style="margin:10px 0;font-size:12px"></div>
<div id="list">Chargement...</div>

<script>
const SUPA_URL="https://kgmatxqbdyusxpiuavbw.supabase.co";
const SUPA_KEY="sb_publishable_vn5kPYncLS3TtBS75hSFew_LjeISc47";
const supa=supabase.createClient(SUPA_URL,SUPA_KEY);
let filter='pending';
let all=[];

function setF(f){filter=f;render();}

async function loadWd(){
 document.getElementById('stats').innerText='Chargement Supabase...';
 try{
  let {data,error}=await supa.from('withdrawals').select('*').order('created_at',{ascending:false}).limit(100);
  if(error) throw error;
  all=data||[];
  // fallback local si vide
  if(all.length==0){
    let local=JSON.parse(localStorage.getItem('admin_withdrawals')||'[]');
    if(local.length>0) all=local;
  }
  render();
 }catch(e){
  document.getElementById('stats').innerText='Erreur Supabase: '+e.message+' | Fallback local';
  all=JSON.parse(localStorage.getItem('admin_withdrawals')||'[]');
  render();
 }
}

function render(){
 let f=all;
 if(filter!=='all') f=all.filter(x=>x.status===filter);
 let total=f.reduce((s,x)=>s+parseFloat(x.amount_ton_net||x.amount_ton||x.net||0),0);
 document.getElementById('stats').innerText=`${f.length} retraits | Total: ${total.toFixed(6)} TON | Filtre: ${filter} | Source: Supabase`;
 if(f.length==0){document.getElementById('list').innerHTML=`<p>Aucun retrait ${filter}<br><small>Les retraits faits dans Telegram apparaitront ici</small></p>`;return;}
 let h='';
 f.forEach(w=>{
  let coins=w.amount_coins||w.coins||w.amount||0;
  let brut=parseFloat(w.amount_ton_brut||w.brut||w.gross||0);
  let fee=parseFloat(w.amount_ton_fee||w.fee_ton||w.fee||0);
  let net=parseFloat(w.amount_ton_net||w.amount_ton||w.net||0);
  // FIX si brut 0
  if(brut==0 && net>0){brut=net/0.9; fee=brut*0.1;}
  if(fee==0 && brut>0) fee=brut*0.1;
  if(net==0 && brut>0) net=brut*0.9;
  let wallet=w.wallet||w.address||'N/A';
  let walletF=w.wallet_friendly||'';
  let user=w.user_id||w.userId||'N/A';
  let status=w.status||'pending';
  let date=w.created_at?new Date(w.created_at).toLocaleString() : (w.date||'');
  let id=w.id;
  h+=`<div class="card" style="border-color:${status=='paid'?'#3b82f6':status=='approved'?'#22c55e':'#ffcc00'}">
  <b style="font-size:13px">${Number(coins).toLocaleString()} 🪙 → ${net.toFixed(6)} TON NET</b><br>
  <div style="font-size:12px;margin:4px 0">Brut: <b>${brut.toFixed(6)}</b> | Fee: <span style="color:#ff6666">${fee.toFixed(6)} (10%)</span></div>
  <div style="font-size:11px">User: ${user} | <b style="color:${status=='pending'?'#ffcc00':'#22c55e'}">${status.toUpperCase()}</b> | ${date}</div>
  Wallet:
  <div class="addr" onclick="copyT('${wallet}')">📋 ${wallet}<br><small style="color:#ffd700">${walletF} - CLIQUE POUR COPIER</small></div>
  <div>
    ${status=='pending'?`<button class="copyBtn" style="background:#22c55e" onclick="updateStatus(${id},'approved')">✅ APPROVED</button>`:''}
    <button class="copyBtn" style="background:#3b82f6" onclick="updateStatus(${id},'paid')">💸 PAID</button>
    <button class="copyBtn" style="background:#555" onclick="copyT('${wallet}')">COPY ADDR</button>
    <button class="copyBtn" style="background:#ffcc00;color:#000" onclick="copyT('${net}')">COPY ${net.toFixed(6)}</button>
  </div>
  </div>`;
 });
 document.getElementById('list').innerHTML=h;
}

function copyT(t){navigator.clipboard.writeText(t).then(()=>alert('Copié: '+String(t).slice(0,40)+'...'));}
async function updateStatus(id,newStatus){
 if(!confirm(`Passer en ${newStatus}?`)) return;
 try{
  let {error}=await supa.from('withdrawals').update({status:newStatus}).eq('id',id);
  if(error) throw error;
  all=all.map(x=>{if(x.id==id) x.status=newStatus; return x;});
  render();
  alert('✅ '+newStatus+' OK');
 }catch(e){alert('Erreur: '+e.message);}
}

loadWd();
setInterval(loadWd,15000);
</script>
</body>
</html>
