<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Harold Coins V11 AUTO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}body{background:#0a0a0f;color:#fff;font-family:system-ui;margin:0;text-align:center}
.balance{font-size:32px;font-weight:900;color:#ffcc00}
.coin{font-size:48px;margin:20px 0;cursor:pointer}
.coin:active{transform:scale(0.9)}
.btn{padding:12px 18px;border-radius:12px;border:0;font-weight:900;margin:6px;cursor:pointer}
.box{background:#1c1c2a;border-radius:16px;padding:14px;margin:12px}
.input{width:100%;padding:12px;border-radius:10px;border:1px solid #444;background:#111;color:#fff;margin:6px 0}
</style>
</head>
<body>
<div style="padding:12px;background:#15151f;display:flex;justify-content:space-between"><b>👑 Harold V11 AUTO</b><span id="uid"></span></div>
<div style="padding:14px">
<div class="balance" id="bal">0 🪙</div>
<div id="coin" class="coin">🪙</div>
<div class="box">
<h3>💸 Retrait AUTO ILLIMITÉ</h3>
<input id="withdrawAmount" class="input" type="number" value="50000">
<input id="walletInput" class="input" placeholder="UQ... ou 0:...">
<button class="btn" style="background:#ffcc00;color:#000;width:100%" onclick="requestWithdraw()">🚀 RETRAIT AUTO V11</button>
<div id="msg" style="font-size:12px;margin-top:8px"></div>
</div>
</div>
<script>
const SUPA_URL="https://kgmatxqbdyusxpiuavbw.supabase.co";
const SUPA_KEY="sb_publishable_vn5kPYncLS3TtBS75hSFew_LjeISc47";
const supa=supabase.createClient(SUPA_URL,SUPA_KEY);
let tg=window.Telegram?.WebApp; if(tg) tg.expand();
let tgUserId=tg?.initDataUnsafe?.user?.id||2120736139;
let balance=0;
document.getElementById('uid').innerText='ID: '+tgUserId;
document.getElementById('coin').addEventListener('click',()=>{balance+=1;updateUI();if(balance%10==0)saveBalance();});
function updateUI(){document.getElementById('bal').innerText=balance.toLocaleString()+' 🪙';}
async function loadBalance(){try{let {data}=await supa.from('harold_users').select('balance').eq('id',tgUserId).single();balance=data?.balance||100000;}catch(e){balance=100000;}updateUI();}
async function saveBalance(){await supa.from('harold_users').upsert({id:tgUserId,balance:balance},{onConflict:'id'});}

// V11 CORRIGÉ - UTILISE ANCIEN POUR ÉVITER ERREUR
async function requestWithdraw(){
  let coins=parseInt(document.getElementById('withdrawAmount').value||'0');
  let wallet=document.getElementById('walletInput').value.trim();
  let msgEl=document.getElementById('msg');
  if(coins<10000){msgEl.innerText='❌ Min 10000';return;}
  if(!wallet){msgEl.innerText='❌ Wallet vide';return;}
  if(balance<coins){msgEl.innerText='❌ Solde insuffisant';return;}
  let brut=coins/1000000*0.1; let fee=brut*0.1; let net=brut*0.9;
  msgEl.innerText='⏳ Envoi...'; msgEl.style.color='#ffcc00';
  try{
    // On utilise exactement tes colonnes qui marchent
    let {error}=await supa.from('withdrawals').insert([{user_id:tgUserId,amount_coins:coins,amount_ton:net,fee_ton:fee,wallet:wallet,status:'pending'}]);
    if(error) throw error;
    balance-=coins; updateUI(); await saveBalance();
    msgEl.innerHTML='✅ RETRAIT ENVOYÉ!<br>'+coins+' → '+net.toFixed(6)+' TON<br><small>ADMIN → REFRESH</small>';
    msgEl.style.color='#22c55e';
  }catch(e){
    // Si erreur, essaie avec colonnes brut/net
    try{
      let {error:err2}=await supa.from('withdrawals').insert([{user_id:tgUserId,amount_coins:coins,amount_ton:net,amount_ton_brut:brut,amount_ton_net:net,fee_ton:fee,wallet:wallet,status:'pending'}]);
      if(err2) throw err2;
      balance-=coins; updateUI(); await saveBalance();
      msgEl.innerHTML='✅ RETRAIT ENVOYÉ! (v2)'; msgEl.style.color='#22c55e';
    }catch(e2){msgEl.innerText='❌ '+e2.message; msgEl.style.color='#ff4444';}
  }
}
loadBalance();
</script>
</body>
</html>
