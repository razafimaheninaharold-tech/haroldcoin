<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADMIN HAROLDCOIN V8.9.2</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{background:#0c0a1a;color:#fff;font-family:sans-serif;padding:12px}.card{background:#1a1a2e;border:1px solid #ffd700;border-radius:14px;padding:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}button{padding:8px 12px;border-radius:10px;border:0;font-weight:900;cursor:pointer}.pending{color:#facc15}.approved{color:#22c55e}.paid{color:#888}.small{font-size:11px;color:#aaa}</style></head><body>
<h2>👑 ADMIN RETRAITS - V8.9.2</h2>
<p class="small">Auto-refresh 15s | 1M=0.1 TON | Frais 10%</p>
<div style="display:flex;gap:6px;margin:12px 0;flex-wrap:wrap">
<button onclick="loadWds('pending')" style="background:#facc15;color:#000">PENDING</button>
<button onclick="loadWds('approved')" style="background:#22c55e;color:#000">APPROVED</button>
<button onclick="loadWds('paid')" style="background:#0098ea;color:#fff">PAID</button>
<button onclick="loadWds('all')" style="background:#555;color:#fff">TOUS</button>
<button onclick="loadWds('pending')" style="background:#fff;color:#000">🔄 REFRESH</button>
</div><div id="stats" style="background:#12121f;padding:10px;border-radius:10px;margin-bottom:10px;font-size:12px"></div><div id="list">Chargement...</div>
<script>
const S=supabase.createClient("https://kgmatxqbdyusxpiuavbw.supabase.co","sb_publishable_vn5kPYncLS3TtBS75hSFew_LjeISc47");
async function loadWds(filter){let q=S.from('withdrawals').select('*').order('created_at',{ascending:false}).limit(100);if(filter!=='all') q=q.eq('status',filter);let {data,error}=await q;let el=document.getElementById('list');let statsEl=document.getElementById('stats');if(error){el.innerHTML='Erreur: '+error.message;return}if(!data||!data.length){el.innerHTML='Aucun retrait '+filter;statsEl.innerHTML='';return}let totalNet=data.reduce((a,w)=>a+parseFloat(w.amount_ton_net||w.amount_ton||0),0);statsEl.innerHTML=`${data.length} retraits | Total: ${totalNet.toFixed(6)} TON | Filtre: ${filter}`;let h='';data.forEach(w=>{let tonNet=parseFloat(w.amount_ton_net||w.amount_ton||0);h+=`<div class="card"><div><b>${w.amount_coins?.toLocaleString()} 🪙 → ${tonNet.toFixed(6)} TON NET</b><br><small>Brut: ${parseFloat(w.amount_ton_brut||0).toFixed(6)} | Fee: ${parseFloat(w.amount_ton_fee||w.fee_ton||0).toFixed(6)}</small><br><small>Wallet: <b style="color:#facc15">${w.wallet_friendly||''}</b><br>${w.wallet||''}<br>User: ${w.user_id} | <span class="${w.status}">${w.status.toUpperCase()}</span><br>${new Date(w.created_at).toLocaleString()}</small></div><div style="display:flex;flex-direction:column;gap:6px;min-width:110px">${w.status=='pending'?`<button onclick="upd(${w.id},'approved')" style="background:#22c55e">APPROUVER</button><button onclick="delWd(${w.id})" style="background:#ff4444;color:#fff">REFUSER</button>`:``}${w.status=='approved'?`<button onclick="copyW('${w.wallet}','${tonNet}')" style="background:#ffd700">COPY WALLET</button><button onclick="upd(${w.id},'paid')" style="background:#0098ea;color:#fff">PAYÉ ✅</button>`:``}${w.status=='paid'?`<span style="color:#22c55e;font-weight:900">PAYÉ ✅</span>`:``}</div></div>`});el.innerHTML=h;}
async function upd(id,st){let {error}=await S.from('withdrawals').update({status:st}).eq('id',id);if(error) alert(error.message);else{alert(st.toUpperCase()+' !'+(st=='approved'?' Envoie le TON via Tonkeeper!':''));loadWds(st=='paid'?'paid':'pending');}}
async function delWd(id){if(!confirm('Refuser? Remboursement!')) return;let {data}=await S.from('withdrawals').select('*').eq('id',id).single();if(data){let {data:u}=await S.from('harold_users').select('balance').eq('id',data.user_id).single();if(u) await S.from('harold_users').update({balance:(u.balance||0)+data.amount_coins}).eq('id',data.user_id);}await S.from('withdrawals').update({status:'rejected'}).eq('id',id);loadWds('pending');}
function copyW(wallet,amount){navigator.clipboard.writeText(wallet);alert(`Wallet copié: ${wallet}\nMontant: ${amount} TON NET`);}
loadWds('pending');setInterval(()=>loadWds('pending'),15000);
</script></body></html>
