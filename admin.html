<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADMIN RETRAITS - V8.9.3</title>
<style>
body{background:#0e0e15;color:#fff;font-family:system-ui;padding:12px;margin:0}
.b{padding:8px 14px;border-radius:10px;border:0;font-weight:800;margin:4px;cursor:pointer}
.card{background:#1c1c2a;border:1px solid #333;border-radius:12px;padding:10px;margin:8px 0;word-break:break-all}
.addr{background:#111;padding:6px;border-radius:8px;font-size:11px;margin:4px 0;border:1px dashed #555;cursor:pointer}
.copyBtn{background:#2a7cff;color:#fff;border:0;padding:6px 10px;border-radius:8px;font-size:11px;font-weight:800}
</style>
</head>
<body>
<h2>👑 ADMIN RETRAITS - V8.9.3</h2>
<small>Auto-refresh 15s | 1M=0.1 TON | Frais 10% | FIX Brut + Copy</small><br>
<button class="b" style="background:#ffcc00" onclick="setF('pending')">PENDING</button>
<button class="b" style="background:#22c55e" onclick="setF('approved')">APPROVED</button>
<button class="b" style="background:#3b82f6" onclick="setF('paid')">PAID</button>
<button class="b" style="background:#444;color:#fff" onclick="setF('all')">TOUS</button>
<button class="b" style="background:#fff;color:#000" onclick="loadWd()">🔄 REFRESH</button>
<div id="stats" style="margin:10px 0;font-size:12px;opacity:.8"></div>
<div id="list"></div>
<script>
let filter='pending';
function setF(f){filter=f;loadWd()}
function loadWd(){
 let wds=JSON.parse(localStorage.getItem('admin_withdrawals')||'[]');
 // aussi check ancien storage
 try{let old=JSON.parse(localStorage.getItem('withdrawals')||'[]');if(old.length>wds.length)wds=old}catch(e){}
 let f=wds; if(filter!=='all') f=wds.filter(x=>x.status===filter);
 let total=f.reduce((s,x)=>s+parseFloat(x.net||0),0);
 document.getElementById('stats').innerText=`${f.length} retraits | Total: ${total.toFixed(6)} TON | Filtre: ${filter}`;
 let h=''; f.slice().reverse().forEach((w,i)=>{
  let realIndex = wds.length-1 - f.slice().reverse().indexOf(w) - (wds.length-f.length);
  // FIX CALCUL BRUT
  let brut = parseFloat(w.brut || w.gross || w.amountTON || 0);
  if(brut===0 && w.net){ brut = parseFloat(w.net)/(0.9) } // recalcul si 0
  let fee = brut*0.1;
  let net = w.net || (brut*0.9);
  let coins = w.coins || w.amount || 50000;
  let walletFull = w.wallet || w.address || 'N/A';
  let user = w.userId || w.uid || 'N/A';
  let date = w.date || new Date().toLocaleString();
  let status = w.status||'pending';
  h+=`<div class="card" style="border-color:${status==='paid'?'#ffcc00':status==='approved'?'#22c55e':'#555'}">
  <b>${Number(coins).toLocaleString()} 🪙 → ${parseFloat(net).toFixed(6)} TON NET</b><br>
  Brut: ${brut.toFixed(6)} | Fee: ${fee.toFixed(6)} (10%)<br>
  Wallet:<div class="addr" onclick="copyT('${walletFull}')" title="Clique pour copier">📋 ${walletFull}<br><small>Clique pour COPIER l'adresse</small></div>
  User: ${user} | ${status.toUpperCase()}<br>${date}<br>
  <div style="margin-top:6px">
  ${status==='pending'?`<button class="copyBtn" style="background:#22c55e" onclick="updateS('${w.id||user+coins}','approved')">✅ APPROVED</button>`:''}
  ${status!=='paid'?`<button class="copyBtn" style="background:#3b82f6;margin-left:6px" onclick="updateS('${w.id||user+coins}','paid')">💸 PAID</button>`:''}
  <button class="copyBtn" style="background:#555;margin-left:6px" onclick="copyT('${walletFull}')">COPY ADDR</button>
  <button class="copyBtn" style="background:#ffcc00;color:#000;margin-left:6px" onclick="copyT('${net}')">COPY MONTANT</button>
  </div></div>`;
 });
 document.getElementById('list').innerHTML=h||'<p>Aucun retrait '+filter+'</p>';
}
function copyT(t){navigator.clipboard.writeText(t);alert('Copié: '+t.slice(0,20)+'...');}
function updateS(id,st){
 let wds=JSON.parse(localStorage.getItem('admin_withdrawals')||'[]');
 let w=wds.find(x=>(x.id||x.userId+x.coins)==id || x.userId==id); if(!w) w=wds.find(x=>x.wallet && id.includes(x.wallet.slice(-6)));
 if(w){w.status=st;localStorage.setItem('admin_withdrawals',JSON.stringify(wds));loadWd();}
 else{ // fallback simple
  wds=wds.map(x=>{if((x.id||x.userId+x.coins)==id) x.status=st; return x;});
  localStorage.setItem('admin_withdrawals',JSON.stringify(wds));loadWd();
 }
}
loadWd(); setInterval(loadWd,15000);
</script>
</body>
</html>
