<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Haroldcoin</title>
    <!-- SDK Telegram Officiel (Correction de l'adresse) -->
    <script src="https://telegram.org"></script>
    <!-- Script de connexion à votre Base de Données Supabase -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            background-color: #050312; 
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* Zone d'affichage du score */
        .score-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .score-value {
            font-size: 44px;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
            letter-spacing: 1px;
        }

        /* Petit texte pour voir l'état de la connexion cloud */
        .status-sync {
            font-size: 13px;
            color: #8a91a5;
            margin-top: 6px;
            font-weight: 500;
        }

        /* Zone centrale de jeu */
        .game-zone {
            position: relative;
            width: 250px;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Halo lumineux jaune autour du cercle */
        .coin-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.25) 0%, rgba(255, 215, 0, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
        }

        /* Le bouton contenant votre logo Harold Coins parfait */
        .main-coin-btn {
            position: relative;
            z-index: 2;
            width: 230px;
            height: 230px;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            outline: none;
            touch-action: manipulation;
            transition: transform 0.05s ease;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7);
            
            /* Connexion directe avec votre fichier coin.png sur GitHub */
            background: url('coin.png') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;

            /* Supprime l'effet de surbrillance bleu au clic */
            -webkit-tap-highlight-color: transparent;
        }

        .main-coin-btn:active {
            transform: scale(0.94) translateY(2px);
        }

        /* Chiffre +1 flottant au clic */
        .floating-click {
            position: absolute;
            color: #ffffff;
            font-size: 32px;
            font-weight: 800;
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 3px 6px rgba(0, 0, 0, 0.8);
            animation: moveUpFade 0.5s ease-out forwards;
        }

        @keyframes moveUpFade {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-80px) scale(0.85); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Affichage du Score au-dessus de la pièce -->
    <div class="score-container">
        <div class="score-value" id="scoreDisplay">0</div>
        <!-- Statut de sauvegarde cloud -->
        <div class="status-sync" id="syncStatus">Connexion au Cloud...</div>
    </div>

    <!-- Zone de jeu -->
    <div class="game-zone" id="gameZone">
        <div class="coin-glow"></div>
        <button class="main-coin-btn" id="coinBtn"></button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // Vos identifiants Supabase officiels injectés
        const SUPABASE_URL = "https://supabase.co";
        const SUPABASE_KEY = "sb_publishable_vn5kPYncLS3TtBS75hSFew_LjeISc47";
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let score = 0;
        const clickValue = 1;
        let userId = "joueur_local"; 
        let userName = "Utilisateur Harold";
        let hasChanges = false;

        const scoreDisplay = document.getElementById('scoreDisplay');
        const syncStatus = document.getElementById('syncStatus');
        const coinBtn = document.getElementById('coinBtn');
        const gameZone = document.getElementById('gameZone');

        // Récupération des informations de l'utilisateur Telegram
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            userId = tg.initDataUnsafe.user.id.toString();
            userName = tg.initDataUnsafe.user.username || tg.initDataUnsafe.user.first_name;
        }

        // Mettre à jour l'affichage
        function updateUI() {
            scoreDisplay.innerText = score.toLocaleString('en-US'); 
        }

        // Charger le score depuis Supabase au démarrage
        async function loadPlayerData() {
            syncStatus.innerText = "Chargement du solde Cloud...";
            try {
                let { data, error } = await supabase
                    .from('users')
                    .select('score')
                    .eq('telegram_id', userId)
                    .single();

                if (error && error.code === 'PGRST116') {
                    // Nouvel utilisateur : on l'ajoute à la base de données
                    await supabase.from('users').insert([{ telegram_id: userId, username: userName, score: 0 }]);
                    score = 0;
                } else if (data) {
                    score = data.score;
                }
                syncStatus.innerText = "Nuage synchronisé ☁️";
                updateUI();
            } catch (err) {
                syncStatus.innerText = "Erreur de connexion cloud";
            }
        }
        loadPlayerData();

        // Action au tap sur la pièce
        coinBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            
            score += clickValue;
            hasChanges = true;
            updateUI();

            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }

            generateClickEffect(e.clientX, e.clientY);
        });

        function generateClickEffect(clientX, clientY) {
            const boundary = gameZone.getBoundingClientRect();
            const posX = clientX - boundary.left;
            const posY = clientY - boundary.top;

            const element = document.createElement('div');
            element.className = 'floating-click';
            element.innerText = `+${clickValue}`;
            element.style.left = `${posX}px`;
            element.style.top = `${posY}px`;

            gameZone.appendChild(element);
            setTimeout(() => element.remove(), 500);
        }

        // Sauvegarde automatique toutes les 4 secondes s'il y a eu des clics
        async function savePlayerData() {
            if (!hasChanges) return;
            try {
                const { error } = await supabase
                    .from('users')
                    .update({ score: score, username: userName })
                    .eq('telegram_id', userId);

                if (!error) {
                    hasChanges = false;
                    syncStatus.innerText = "Sauvegarde réussie ✓";
                    setTimeout(() => { syncStatus.innerText = "Nuage synchronisé ☁️"; }, 1500);
                }
            } catch (err) {
                console.log("Erreur de sauvegarde");
            }
        }
        setInterval(savePlayerData, 4000);
    </script>
</body>
</html>
