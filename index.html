<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Haroldcoin</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;display:flex;justify-content:center;overscroll-behavior:none}
.app{width:100%;max-width:420px;height:100vh;background:#000 url('bg.jpg') center/cover no-repeat;position:relative;overflow:hidden}
.content{position:relative;z-index:2;height:100vh;display:flex;flex-direction:column;padding:6px 14px 80px}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.name{font-family:'Cinzel';font-size:30px;font-weight:900;color:#fff;text-shadow:0 0 12px #d4af37}
.lvl{background:linear-gradient(#fff9c4,#d4af37);color:#000;padding:3px 11px;border-radius:20px;font-size:11px;font-weight:900;display:inline-block;margin-top:3px}
.wallet{background:rgba(0,0,0,0.75);border:1.5px solid #d4af37;color:#fff;padding:7px 12px;border-radius:20px;font-size:11px}
.assets-wrap{margin-top:2px;display:flex;flex-direction:column;align-items:center}
.assets-label{font-family:'Cinzel';font-size:11px;color:#d4af37;letter-spacing:3px;display:flex;align-items:center;gap:6px}
.assets-label:before,.assets-label:after{content:'👑';font-size:8px}
.assets-pill{margin-top:5px;background:linear-gradient(180deg,#1a1a1a,#000);border:2px solid #d4af37;border-radius:24px;padding:8px 24px;min-width:240px;text-align:center;box-shadow:0 0 16px rgba(212,175,55,0.4)}
.assets-value{font-family:'Cinzel';font-size:26px;font-weight:900;color:#fff9c4;text-shadow:0 0 10px #d4af37}
.assets-value span{color:#d4af37;font-size:16px}
.center{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;margin-top:6px}
.coin-wrap{position:relative;width:120px;height:120px;display:flex;align-items:center;justify-content:center}
.mining-circle{position:absolute;width:120px;height:120px;transform:rotate(-90deg);z-index:10}
.mining-circle circle{fill:none;stroke-linecap:round}
.track{stroke:rgba(255,215,0,0.15);stroke-width:5px}
.progress{stroke:#FFD700;stroke-width:5px;stroke-dasharray:220;stroke-dashoffset:220;filter:drop-shadow(0 0 6px #FFD700);transition:stroke-dashoffset 0.5s ease}
.coin{width:92px;height:92px;z-index:5;border-radius:50%;clip-path:circle(34% at 50% 50%);filter:brightness(1.3) drop-shadow(0 0 16px #d4af37)}

/* DESIGN 3 CYBER */
.mining-plus{background:linear-gradient(90deg,#0a1a2a,#000);border:1.5px solid #00e5ff;border-radius:16px;padding:7px 18px;min-width:200px;text-align:center;box-shadow:0 0 12px rgba(0,229,255,0.35), inset 0 0 6px rgba(0,229,255,0.1);display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px}
.mining-plus b{font-size:23px;font-weight:900;color:#00ff88;text-shadow:0 0 8px #00ff88}
.mining-plus span{color:#00e5ff;font-size:11px;font-weight:800}
.power-bar{margin-top:10px;width:220px;height:20px;background:linear-gradient(90deg,#0a1a2a,#111);border:1.5px solid #00e5ff;border-radius:8px;position:relative;display:flex;align-items:center;padding:3px 3px 3px 32px;box-shadow:0 0 10px rgba(0,229,255,0.25), inset 0 1px 2px rgba(255,255,255,0.1);overflow:visible}
.power-fill{height:100%;background:repeating-linear-gradient(90deg,#00e5ff 0px,#00e5ff 8px,#00ff88 8px,#ff8c00 16px,#ff8c00 24px);background-size:40px 100%;border-radius:4px;width:0%;transition:width 0.5s;box-shadow:0 0 8px #00e5ff;animation:flow 2s linear infinite}
@keyframes flow{0%{background-position:0 0}100%{background-position:40px 0}}
.power-icon{position:absolute;left:-10px;top:50%;transform:translateY(-50%);width:34px;height:34px;background:linear-gradient(135deg,#0a1a2a,#111);border:2px solid #ff8c00;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;z-index:2;box-shadow:0 0 10px #ff8c00, inset 0 1px 1px rgba(255,255,255,0.2)}
.claim{margin-top:14px;width:88%;height:56px;border:none;border-radius:26px;background:linear-gradient(90deg,#00e5ff 0%,#00e5ff 18%,#ff9c2a 65%,#ff8c00 100%);color:#000;font-family:'Cinzel';font-weight:900;font-size:22px;letter-spacing:1px;box-shadow:0 5px 0 #b85c00, 0 8px 20px rgba(0,229,255,0.5), 0 0 18px rgba(255,140,0,0.4), inset 0 2px 0 rgba(255,255,255,0.7), inset 0 -2px 0 rgba(0,0,0,0.2);cursor:pointer;z-index:20;display:block;text-shadow:0 1px 0 rgba(255,255,255,0.5);transform:translateY(0);transition:all 0.1s}
.claim:active{transform:translateY(4px);box-shadow:0 2px 0 #b85c00, 0 4px 10px rgba(0,229,255,0.5)}
.bottom{position:absolute;bottom:0;left:0;right:0;height:80px;background:linear-gradient(180deg,#0a0a0a,#000);border-top:1px solid #333;display:flex;justify-content:space-around;align-items:center;z-index:999;padding:6px 8px;border-radius:20px 20px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.05)}
.nav{flex:1;max-width:80px;height:64px;background:linear-gradient(180deg,#1a1a1a,#111);border:1px solid #222;border-radius:16px;color:#666;text-align:center;font-size:11px;font-family:'Inter';cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;box-shadow:inset 0 1px 1px rgba(255,255,255,0.05), 0 2px 4px rgba(0,0,0,0.5);transition:all 0.2s}
.nav b{font-size:22px;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,0.5))}
.nav.active{background:linear-gradient(180deg,#1a1a1a,#0f0f0f);border:1.5px solid #d4af37;color:#d4af37;box-shadow:inset 0 1px 2px rgba(255,255,255,0.1), 0 0 12px rgba(212,175,55,0.4), 0 2px 6px rgba(0,0,0,0.6);transform:translateY(-2px)}
.nav:active{transform:translateY(1px) scale(0.96)}
.page{display:none;flex:1;overflow-y:auto}.page.active{display:flex;flex-direction:column}
#page-mine.active{justify-content:flex-start;overflow-y:auto}
.miners-head{margin-bottom:10px}
.miners-title{font-family:'Cinzel';font-size:18px;color:#fff;font-weight:900;text-shadow:0 0 10px #d4af37}
.miners-sub{font-family:'Inter';font-size:11px;color:#aaa;margin-top:3px}
.miner-card{background:linear-gradient(135deg, rgba(22,22,22,0.98), rgba(0,0,0,0.99));border:1.2px solid rgba(212,175,55,0.28);border-radius:13px;padding:10px 11px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.miner-icon{width:42px;height:42px;border-radius:10px;background:#111;border:1px solid #333;display:flex;align-items:center;justify-content:center;font-size:20px}
.miner-info{flex:1;min-width:0}
.miner-lvl{font-size:10px;font-weight:800;color:#888}
.miner-price{font-size:16px;font-weight:900;color:#00ff88}
.miner-hold{font-size:9px;color:#666}
.miner-speed{font-size:10px;font-weight:700;color:#d4af37}
.miner-btn{padding:7px 10px;border-radius:8px;border:none;font-weight:900;font-size:10px;min-width:70px;cursor:pointer}
.btn-active{background:linear-gradient(#fff9c4,#d4af37);color:#000}
.btn-need{background:linear-gradient(#ffeda0,#ffaa00);color:#000}
.btn-locked{background:#222;color:#666;border:1px solid #333}
.btn-max200{background:linear-gradient(#ffd700,#ff8c00);color:#000}
</style>
</head>
<body>
<div class="app">
<div class="content">
<div class="top"><div><div class="name">HAROLD</div><div class="lvl">👑 Lvl 1</div></div><div class="wallet">Connect Wallet</div></div>
<div class="page active" id="page-mine">
<div class="assets-wrap">
<div class="assets-label">ASSETS</div>
<div class="assets-pill"><div class="assets-value" id="assetsValue">0,0880 | <span>HRD</span></div></div>
<div class="mining-plus">📈 <b id="miningPlus">+0.0024</b> <span>HRD</span></div>
</div>
<div class="center">
<div class="coin-wrap">
<svg class="mining-circle" viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="35"></circle><circle class="progress" id="progressCircle" cx="60" cy="60" r="35"></circle></svg>
<img class="coin" src="coin.png">
</div>
<div class="power-bar"><div class="power-icon">⚡</div><div class="power-fill" id="powerFill"></div></div>
<button class="claim" id="claimBtn">CLAIM</button>
</div>
</div>
<div class="page" id="page-miners"><div class="miners-head"><div class="miners-title">MINERS • 200 MAX 👑</div><div class="miners-sub">LVL 1/200 • Scroll pour voir les 200 levels</div></div><div id="minersList"></div></div>
<div class="page" id="page-tasks"><div class="miners-title">TASKS 📦</div><div style="color:#666;font-size:13px;text-align:center;margin-top:50px">Bientôt disponible...</div></div>
<div class="page" id="page-friends"><div class="miners-title">FRIENDS 👥</div><div style="color:#666;font-size:13px;text-align:center;margin-top:50px">Bientôt disponible...</div></div>
</div>
<div class="bottom">
<div class="nav active" data-page="mine"><b>⛏️</b>Mine</div>
<div class="nav" data-page="tasks"><b>📦</b>Tasks</div>
<div class="nav" data-page="miners"><b>⚡</b>Miners</div>
<div class="nav" data-page="friends"><b>👥</b>Friends</div>
</div>
</div>
<script>
function showPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  document.querySelectorAll('.nav').forEach(n=>n.classList.remove('active'));
  document.querySelector(`.nav[data-page="${name}"]`).classList.add('active');
  if(window.Telegram?.WebApp?.HapticFeedback) Telegram.WebApp.HapticFeedback.impactOccurred('light');
}
document.querySelectorAll('.nav').forEach(nav=>{
  const h=(e)=>{e.preventDefault();e.stopPropagation();showPage(nav.dataset.page);};
  nav.addEventListener('click',h);
  nav.addEventListener('touchend',h,{passive:false});
});
let balance=0.0880;let mining=0.0024;let progress=0;
const circle=document.getElementById('progressCircle');
const assetsValue=document.getElementById('assetsValue');
const miningPlus=document.getElementById('miningPlus');
const powerFill=document.getElementById('powerFill');
const btn=document.getElementById('claimBtn');
const circ=2*Math.PI*35;circle.style.strokeDasharray=circ;circle.style.strokeDashoffset=circ;
function updateUI(){
  assetsValue.innerHTML=`${balance.toFixed(4).replace('.',',')} | <span>HRD</span>`;
  miningPlus.textContent=`+${mining.toFixed(4)}`;
  powerFill.style.width=progress+'%';
  circle.style.strokeDashoffset=circ-(circ*progress/100);
  if(progress>=100){btn.textContent='CLAIM READY';btn.style.filter='brightness(1.2) drop-shadow(0 0 15px #00e5ff)';}
}
let iv=setInterval(()=>{if(progress<100){progress+=0.6;mining+=0.00003;updateUI();}else{clearInterval(iv);updateUI();}},100);
btn.addEventListener('click',()=>{
  if(progress>=100){
    balance+=mining;mining=0.0024;progress=0;btn.textContent='CLAIM';btn.style.filter='none';
    updateUI();
    iv=setInterval(()=>{if(progress<100){progress+=0.6;mining+=0.00003;updateUI();}else{clearInterval(iv);updateUI();}},100);
    if(window.Telegram?.WebApp?.HapticFeedback) Telegram.WebApp.HapticFeedback.notificationOccurred('success');
  }
});
updateUI();
const list=document.getElementById('minersList');let html='';
for(let lvl=1;lvl<=200;lvl++){
  let price,hrd,hold,btnClass,btnText;
  if(lvl===1){price='0$';hrd=0;hold=0;btnClass='btn-active';btnText='ACTIVE';}
  else if(lvl===2){price='0.317$';hrd=317;hold=1000;btnClass='btn-need';btnText='NEED 1000';}
  else if(lvl===200){price='2.500$';hrd=25000;hold=100000;btnClass='btn-max200';btnText='MAX 200 👑';}
  else {price=(0.42+(lvl-8)*0.015).toFixed(3)+'$';hrd=4200+(lvl-8)*120;hold=8000+(lvl-8)*800;btnClass='btn-locked';btnText='🔒 LOCKED';}
  const speed=(0.20+(lvl-1)*0.015).toFixed(2);
  const icon=lvl===200?'👑':['🔧','💎','🏆','👑','🚀','🌟'][lvl%6];
  html+=`<div class="miner-card"><div class="miner-icon">${icon}</div><div class="miner-info"><div class="miner-lvl">LVL ${lvl}</div><div class="miner-price">${price}</div><div class="miner-hold">${hrd} HRD • HOLD ${hold.toLocaleString()} HRD</div><div class="miner-speed">⚡ ${speed} TH/s</div></div><button class="miner-btn ${btnClass}" data-lvl="${lvl}">${btnText}</button></div>`;
}
list.innerHTML=html;
list.addEventListener('click',(e)=>{
  const b=e.target.closest('.miner-btn');if(!b)return;
  const lvl=parseInt(b.dataset.lvl);const txt=b.textContent.trim();
  if(window.Telegram?.WebApp?.HapticFeedback) Telegram.WebApp.HapticFeedback.impactOccurred('light');
  if(txt.includes('ACTIVE')) alert('✅ LVL 1 déjà ACTIF!');
  else if(txt.includes('NEED')) alert(`🔧 LVL 2 - ${balance.toFixed(4)} HRD`);
  else if(txt.includes('LOCKED')) alert(`🔒 LVL ${lvl} LOCKED`);
});
</script>
</body>
</html>
