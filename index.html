<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haroldcoins Game</title>
    <style>
        body {
            margin: 0;
            background-color: #1a103c;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        .header {
            margin-top: 30px;
            text-align: center;
            width: 100%;
        }
        .username {
            font-size: 16px;
            color: #a29bfe;
            font-weight: bold;
        }
        .score-container {
            font-size: 48px;
            font-weight: 900;
            color: #f1c40f;
            text-shadow: 0 0 15px rgba(241, 196, 15, 0.5);
            margin-top: 5px;
        }
        .coin-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            width: 100%;
        }
        .coin {
            width: 230px;
            height: 230px;
            cursor: pointer;
            transition: transform 0.05s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }
        .coin img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0px 10px 20px rgba(241, 196, 15, 0.3));
        }
        .coin:active {
            transform: scale(0.92);
        }
        .game-status {
            width: 85%;
            margin-bottom: 15px;
        }
        .energy-text {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .energy-bar-bg {
            width: 100%;
            height: 12px;
            background-color: #2d1f5d;
            border-radius: 10px;
            overflow: hidden;
        }
        .energy-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #f1c40f, #e67e22);
            border-radius: 10px;
            transition: width 0.1s ease;
        }
        .nav-menu {
            width: 100%;
            background-color: #251752;
            display: flex;
            justify-content: space-around;
            padding: 12px 0 25px 0;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.3);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #b2bec3;
            font-size: 12px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }
        .nav-item .icon {
            font-size: 22px;
            margin-bottom: 4px;
        }
        .nav-item.active {
            color: #f1c40f;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="username">⭐ Harold Trader</div>
        <div class="score-container" id="score">0</div>
    </div>

    <div class="coin-container">
        <div class="coin" id="coinBtn">
            <!-- Utilisation d'un lien direct vers votre image d'origine pour éviter les bugs de fichiers -->
            <img src="https://squarespace-cdn.com" alt="Haroldcoins Logo">
        </div>
    </div>

    <div class="game-status">
        <div class="energy-text">
            🟡 <span id="energyText">1000/1000</span>
        </div>
        <div class="energy-bar-bg">
            <div class="energy-bar-fill" id="energyFill"></div>
        </div>
    </div>

    <div class="nav-menu">
        <div class="nav-item">
            <span class="icon">💰</span>
            <span>Gagner</span>
        </div>
        <div class="nav-item">
            <span class="icon">👥</span>
            <span>Amis</span>
        </div>
        <div class="nav-item">
            <span class="icon">🛠️</span>
            <span>Bâtir</span>
        </div>
        <div class="nav-item active">
            <span class="icon">🏠</span>
            <span>Mon</span>
        </div>
    </div>

    <script>
        let score = 0;
        let energy = 1000;
        const maxEnergy = 1000;

        const scoreDisplay = document.getElementById('score');
        const coinButton = document.getElementById('coinBtn');
        const energyText = document.getElementById('energyText');
        const energyFill = document.getElementById('energyFill');

        coinButton.addEventListener('click', () => {
            if (energy > 0) {
                score += 14; 
                energy--;
                
                scoreDisplay.textContent = score.toLocaleString();
                energyText.textContent = `${energy}/${maxEnergy}`;
                energyFill.style.width = `${(energy / maxEnergy) * 100}%`;
                
                if (navigator.vibrate) {
                    navigator.vibrate(40);
                }
            }
        });

        setInterval(() => {
            if (energy < maxEnergy) {
                energy++;
                energyText.textContent = `${energy}/${maxEnergy}`;
                energyFill.style.width = `${(energy / maxEnergy) * 100}%`;
            }
        }, 1000);
    </script>
</body>
</html>
