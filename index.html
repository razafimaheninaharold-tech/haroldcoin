<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Haroldcoin - Tap to Earn</title>
    <!-- SDK Telegram Officiel -->
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-color: #0b071e;
            --surface-color: #161036;
            --accent-color: #ffd700;
            --text-color: #ffffff;
            --text-secondary: #a39bb8;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at center, #1a1242 0%, var(--bg-color) 100%);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: calc(100vh - 32px);
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* En-tête avec les boutons d'action */
        .header-actions {
            width: 100%;
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        .btn-action {
            flex: 1;
            background: var(--surface-color);
            border: 1px solid rgba(255, 215, 0, 0.2);
            padding: 10px;
            border-radius: 12px;
            color: var(--text-color);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.1s ease;
        }

        .btn-action:active {
            transform: scale(0.95);
        }

        /* Compteur principal */
        .score-container {
            text-align: center;
            margin-top: 10px;
        }

        .score-title {
            font-size: 14px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .score-value {
            font-size: 48px;
            font-weight: 800;
            color: var(--accent-color);
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }

        /* Zone du Jeton central */
        .coin-container {
            position: relative;
            width: 260px;
            height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .coin-button {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: url('https://imgur.com') center/cover no-repeat; /* REMPLACEZ PAR VOTRE URL D'IMAGE */
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.3), inset 0 0 20px rgba(255, 215, 0, 0.2);
            cursor: pointer;
            transition: transform 0.05s ease;
            outline: none;
            border: none;
        }

        .coin-button:active {
            transform: scale(0.95);
        }

        /* Effet du +1 flottant */
        .floating-text {
            position: absolute;
            color: var(--accent-color);
            font-size: 28px;
            font-weight: 800;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(0.8); opacity: 0; }
        }

        /* Section Basse : Énergie et Jauge */
        .footer-container {
            width: 100%;
            max-width: 400px;
            margin-bottom: 10px;
        }

        .energy-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .energy-label {
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .energy-bar-bg {
            width: 100%;
            height: 14px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .energy-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff9900, var(--accent-color));
            border-radius: 10px;
            transition: width 0.1s ease;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
    </style>
</head>
<body>

    <!-- Boutons du Haut -->
    <div class="header-actions">
        <button class="btn-action" onclick="openTab('friends')">👥 Amis</button>
        <button class="btn-action" onclick="openTab('gains')" style="color: var(--accent-color);">🎁 Gains</button>
    </div>

    <!-- Zone du Score -->
    <div class="score-container">
        <div class="score-title">Solde Haroldcoin</div>
        <div class="score-value" id="scoreDisplay">0</div>
    </div>

    <!-- Le Bouton de Tap principal -->
    <div class="coin-container" id="coinContainer">
        <button class="coin-button" id="coinBtn"></button>
    </div>

    <!-- Barre d'Énergie en bas -->
    <div class="footer-container">
        <div class="energy-header">
            <span class="energy-label">⚡ Énergie</span>
            <span id="energyText">1000/1000</span>
        </div>
        <div class="energy-bar-bg">
            <div class="energy-bar-fill" id="energyBar"></div>
        </div>
    </div>

    <script>
        // Initialisation de la WebApp Telegram
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // Variables d'état du jeu
        let score = parseInt(localStorage.getItem('harold_score')) || 0;
        let energy = parseInt(localStorage.getItem('harold_energy')) || 1000;
        const maxEnergy = 1000;
        const tapValue = 1;

        // Éléments du DOM
        const scoreDisplay = document.getElementById('scoreDisplay');
        const energyText = document.getElementById('energyText');
        const energyBar = document.getElementById('energyBar');
        const coinBtn = document.getElementById('coinBtn');
        const coinContainer = document.getElementById('coinContainer');

        // Mise à jour initiale de l'affichage
        function updateUI() {
            scoreDisplay.innerText = score.toLocaleString();
            energyText.innerText = `${energy}/${maxEnergy}`;
            const percentage = (energy / maxEnergy) * 100;
            energyBar.style.width = `${percentage}%`;
        }
        updateUI();

        // Gestion du Tap (Gère le tactile multi-touch proprement)
        coinBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            
            if (energy >= tapValue) {
                // Mettre à jour les données
                score += tapValue;
                energy -= tapValue;
                
                // Sauvegarde locale temporaire
                localStorage.setItem('harold_score', score);
                localStorage.setItem('harold_energy', energy);

                updateUI();

                // Retour haptique Telegram (vibration légère au clic)
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred('light');
                }

                // Création de l'effet de texte flottant "+1"
                createFloatingText(e.clientX, e.clientY);
            } else {
                // Vibration d'erreur si pas assez d'énergie
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('error');
                }
            }
        });

        // Fonction pour générer le "+1" flottant à l'endroit exact du clic
        function createFloatingText(x, y) {
            const rect = coinContainer.getBoundingClientRect();
            const relativeX = x - rect.left;
            const relativeY = y - rect.top;

            const text = document.createElement('div');
            text.className = 'floating-text';
            text.innerText = `+${tapValue}`;
            text.style.left = `${relativeX}px`;
            text.style.top = `${relativeY}px`;

            coinContainer.appendChild(text);

            // Nettoyage de l'élément après l'animation
            setTimeout(() => {
                text.remove();
            }, 800);
        }

        // Régénération passive de l'énergie (+3 énergie par seconde)
        setInterval(() => {
            if (energy < maxEnergy) {
                energy = Math.min(maxEnergy, energy + 3);
                localStorage.setItem('harold_energy', energy);
                updateUI();
            }
        }, 1000);

        // Fonctions pour les onglets
        function openTab(tabName) {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            alert(`Ouverture de la section : ${tabName} (Bientôt disponible)`);
        }
    </script>
</body>
</html>
