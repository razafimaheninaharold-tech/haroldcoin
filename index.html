<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADMIN Harold Coins</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{background:#0c0a1a;color:#fff;font-family:sans-serif;padding:12px} .card{background:#1a1a2e;border:1px solid #ffd700;border-radius:14px;padding:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center} button{padding:8px 12px;border-radius:8px;border:0;font-weight:900;cursor:pointer} .pending{background:#facc15;color:#000} .paid{background:#22c55e;color:#000} .reject{background:#ff4444;color:#fff}</style></head><body>
<h2>💸 ADMIN RETRAITS - Harold Coins</h2>
<p style="font-size:12px;color:#aaa">Mot de passe: demande uniquement pour toi (ID Telegram 2120736139)</p>
<div id="list">Chargement...</div>
<script>
const U="https://kgmatxqbdyusxpiuavbw.supabase.co",K="sb_publishable_vn5kPYncLS3TtBS75hSFew_LjeISc47",S=supabase.createClient(U,K);
const ADMIN_ID="2120736139";
// Check admin via local Telegram or prompt
let uid=window.Telegram?.WebApp?.initDataUnsafe?.user?.id+""||localStorage.getItem('uid')||prompt("Ton ID Telegram?")||'';
if(uid!=ADMIN_ID){document.body.innerHTML="<h2>⛔ Accès refusé</h2><p>Uniquement admin 2120736139</p>"; throw "no admin";}
async function load(){
 let {data}=await S.from('withdrawals').select('*').order('created_at',{ascending:false}).limit(50);
 let el=document.getElementById('list');
 if(!data||data.length==0){el.innerHTML="Aucun retrait";return}
 let h='';
 data.forEach(w=>{
  let date=new Date(w.created_at).toLocaleString('fr-FR');
  h+=`<div class="card"><div><b>${w.user_id}</b> - ${w.amount_coins} 🪙 → ${parseFloat(w.amount_ton_net||0).toFixed(6)} TON<br><small style="color:#aaa">${date} | ${w.wallet_friendly||w.wallet?.slice(0,10)}...<br>Status: <b style="color:${w.status=='pending'?'#facc15':'#22c55e'}">${w.status}</b></small></div><div style="display:flex;gap:4px;flex-direction:column"><button class="paid" onclick="setStatus(${w.id},'paid')">PAYER ✅</button><button class="reject" onclick="setStatus(${w.id},'rejected')">REJETER</button><button onclick="copyWallet('${w.wallet}')" style="background:#333;color:#fff">COPIER WALLET</button></div></div>`;
 });
 el.innerHTML=h;
}
async function setStatus(id,status){
 if(!confirm("Passer en "+status+" ?")) return;
 await S.from('withdrawals').update({status}).eq('id',id);
 load();
}
function copyWallet(w){navigator.clipboard.writeText(w);alert("Wallet copié: "+w.slice(0,20)+"...");}
load();
setInterval(load,10000);
</script></body></html>
