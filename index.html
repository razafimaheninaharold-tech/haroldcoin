<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Haroldcoin</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;display:flex;justify-content:center;overscroll-behavior:none}
.app{width:100%;max-width:420px;height:100vh;background:#000 url('bg.jpg') center/cover no-repeat;position:relative;overflow:hidden}
.content{position:relative;z-index:2;height:100vh;display:flex;flex-direction:column;padding:6px 14px 88px}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.name{font-family:'Cinzel';font-size:30px;font-weight:900;color:#fff;text-shadow:0 0 12px #d4af37}
.lvl{background:linear-gradient(#fff9c4,#d4af37);color:#000;padding:3px 11px;border-radius:20px;font-size:11px;font-weight:900;display:inline-block;margin-top:3px}
.wallet{background:rgba(0,0,0,0.75);border:1.5px solid #d4af37;color:#fff;padding:7px 12px;border-radius:20px;font-size:11px}
.assets-wrap{margin-top:2px;display:flex;flex-direction:column;align-items:center}
.assets-label{font-family:'Cinzel';font-size:11px;color:#d4af37;letter-spacing:3px;display:flex;align-items:center;gap:6px}
.assets-label:before,.assets-label:after{content:'👑';font-size:8px}
.assets-pill{margin-top:5px;background:linear-gradient(180deg,#1a1a1a,#000);border:2px solid #d4af37;border-radius:24px;padding:8px 24px;min-width:240px;text-align:center;box-shadow:0 0 16px rgba(212,175,55,0.4)}
.assets-value{font-family:'Cinzel';font-size:26px;font-weight:900;color:#fff9c4;text-shadow:0 0 10px #d4af37}
.assets-value span{color:#d4af37;font-size:16px}

/* MINING VERT 3D - COMME 2EME IMAGE */
.mining-plus{margin-top:10px;background:linear-gradient(180deg,#0a1a0f,#000);border:2px solid #00ff88;border-radius:22px;padding:10px 24px;min-width:220px;text-align:center;box-shadow:0 0 18px rgba(0,255,136,0.35), inset 0 1px 0 rgba(255,255,255,0.06), 0 4px 0 #005522;display:flex;align-items:center;justify-content:center;gap:8px;transform:translateY(0)}
.mining-plus b{font-family:'Inter';font-size:26px;font-weight:900;color:#00ff88;text-shadow:0 0 10px #00ff88}
.mining-plus span{color:#00ff88;font-size:12px;font-weight:800}

/* COIN + CERCLE JAUNE COMME 2EME IMAGE */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;margin-top:22px}
.coin-wrap{position:relative;width:130px;height:130px;display:flex;align-items:center;justify-content:center}
.mining-circle{position:absolute;width:130px;height:130px;transform:rotate(-90deg);z-index:10}
.mining-circle circle{fill:none;stroke-linecap:round}
.track{stroke:rgba(255,215,0,0.12);stroke-width:8px}
.progress{stroke:#FFD700;stroke-width:8px;stroke-dasharray:246;stroke-dashoffset:120;filter:drop-shadow(0 0 10px #FFD700);transition:stroke-dashoffset 0.5s ease}
.coin{width:86px;height:86px;z-index:5;border-radius:50%;border:3px solid #FFD700;box-shadow:0 0 20px #FFD700;object-fit:cover;filter:brightness(1.2)}

/* POWER BAR OR 3D - COMME 2EME IMAGE MAIS EN 3D */
.power-bar{margin-top:30px;width:92%;height:28px;background:linear-gradient(180deg,#111,#000);border:2px solid #d4af37;border-radius:20px;position:relative;display:flex;align-items:center;padding:3px 8px 3px 54px;box-shadow:0 0 15px rgba(212,175,55,0.35), inset 0 1px 0 rgba(255,255,255,0.05), 0 3px 0 #5a4a0a}
.power-fill{height:14px;background:linear-gradient(90deg,#fff9c4,#ffd700,#d4af37);border-radius:10px;width:38%;box-shadow:0 0 8px #FFD700;transition:width 0.5s}
.power-icon{position:absolute;left:-8px;top:50%;transform:translateY(-50%);width:44px;height:40px;background:radial-gradient(#ffd700,#b8941f);border:2.5px solid #000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;z-index:3;box-shadow:0 0 12px #FFD700, 0 3px 0 #5a4a0a}

/* CLAIM OR 3D BONBON - COMME 2EME IMAGE MAIS EN 3D */
.claim{margin-top:20px;width:96%;height:62px;border:none;border-radius:30px;background:linear-gradient(180deg,#ffffe0,#ffeb8a,#ffd700,#d4af37,#b8941f);color:#000;font-family:'Cinzel';font-weight:900;font-size:24px;letter-spacing:1px;box-shadow:0 6px 0 #7a5a0a, 0 10px 25px rgba(212,175,55,0.5), inset 0 3px 0 rgba(255,255,255,0.8), inset 0 -2px 2px rgba(0,0,0,0.2);cursor:pointer;z-index:20;display:block;text-shadow:0 1px 0 rgba(255,255,255,0.6);transform:translateY(0);transition:all 0.1s}
.claim:active{transform:translateY(4px);box-shadow:0 2px 0 #7a5a0a, 0 4px 12px rgba(212,175,55,0.4)}

/* BOTTOM MENU 3D CARRE - COMME 1ERE IMAGE MAIS STYLE OR */
.bottom{position:absolute;bottom:0;left:0;right:0;height:86px;background:linear-gradient(180deg,#0f0f0f,#000);border-top:2px solid #d4af37;display:flex;justify-content:space-around;align-items:center;z-index:999;padding:8px 8px;border-radius:22px 22px 0 0;box-shadow:0 -5px 20px rgba(0,0,0,0.9)}
.nav{flex:1;max-width:84px;height:66px;background:linear-gradient(180deg,#1e1e1e,#111);border:1.5px solid #2a2a2a;border-radius:18px;color:#666;text-align:center;font-size:11px;font-family:'Inter';font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:inset 0 1px 1px rgba(255,255,255,0.05), 0 3px 6px rgba(0,0,0,0.6), 0 2px 0 #000;margin:0 4px;transition:all 0.15s;transform:translateY(0)}
.nav b{font-size:22px;display:block}
.nav.active{background:linear-gradient(180deg,#2a2210,#111);border:2px solid #d4af37;color:#ffdb6b;box-shadow:0 0 18px rgba(212,175,55,0.55), inset 0 1px 2px rgba(255,255,255,0.08), 0 4px 0 #5a4a0a;transform:translateY(-4px)}
.nav:active{transform:translateY(-1px)}

.page{display:none;flex:1;overflow-y:auto}.page.active{display:flex;flex-direction:column}
#page-mine.active{justify-content:flex-start}
.miners-head{margin-bottom:10px}.miners-title{font-family:'Cinzel';font-size:18px;color:#fff;font-weight:900;text-shadow:0 0 10px #d4af37}.miners-sub{font-family:'Inter';font-size:11px;color:#aaa;margin-top:3px}
.miner-card{background:linear-gradient(135deg, rgba(22,22,22,0.98), rgba(0,0,0,0.99));border:1.2px solid rgba(212,175,55,0.28);border-radius:13px;padding:10px 11px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.miner-icon{width:42px;height:42px;border-radius:10px;background:#111;border:1px solid #333;display:flex;align-items:center;justify-content:center;font-size:20px}
.miner-info{flex:1;min-width:0}.miner-lvl{font-size:10px;font-weight:800;color:#888}.miner-price{font-size:16px;font-weight:900;color:#00ff88}.miner-hold{font-size:9px;color:#666}.miner-speed{font-size:10px;font-weight:700;color:#d4af37}
.miner-btn{padding:7px 10px;border-radius:8px;border:none;font-weight:900;font-size:10px;min-width:70px;cursor:pointer}
.btn-active{background:linear-gradient(#fff9c4,#d4af37);color:#000}.btn-need{background:linear-gradient(#ffeda0,#ffaa00);color:#000}.btn-locked{background:#222;color:#666;border:1px solid #333}.btn-max200{background:linear-gradient(#ffd700,#ff8c00);color:#000}
</style>
</head>
<body>
<div class="app">
<div class="content">
<div class="top"><div><div class="name">HAROLD</div><div class="lvl">👑 Lvl 1</div></div><div class="wallet">Connect Wallet</div></div>
<div class="page active" id="page-mine">
<div class="assets-wrap">
<div class="assets-label">ASSETS</div>
<div class="assets-pill"><div class="assets-value" id="assetsValue">0,0880 | <span>HRD</span></div></div>
<div class="mining-plus"><b id="miningPlus">+0.0024</b> <span>HRD</span></div>
</div>
<div class="center">
<div class="coin-wrap">
<svg class="mining-circle" viewBox="0 0 130 130"><circle class="track" cx="65" cy="65" r="39"></circle><circle class="progress" id="progressCircle" cx="65" cy="65" r="39"></circle></svg>
<img class="coin" src="coin.png" onerror="this.src='https://i.imgur.com/8Km9tLL.png'">
</div>
<div class="power-bar"><div class="power-icon">⚡</div><div class="power-fill" id="powerFill"></div></div>
<button class="claim" id="claimBtn">CLAIM</button>
</div>
</div>
<div class="page" id="page-miners"><div class="miners-head"><div class="miners-title">MINERS • 200 MAX 👑</div><div class="miners-sub">LVL 1/200 • Scroll pour voir les 200 levels</div></div><div id="minersList"></div></div>
<div class="page" id="page-tasks"><div class="miners-title">TASKS 📦</div><div style="color:#666;font-size:13px;text-align:center;margin-top:50px">Bientôt disponible...</div></div>
<div class="page" id="page-friends"><div class="miners-title">FRIENDS 👥</div><div style="color:#666;font-size:13px;text-align:center;margin-top:50px">Bientôt disponible...</div></div>
</div>
<div class="bottom">
<div class="nav active" data-page="mine"><b>⛏️</b>Mine</div>
<div class="nav" data-page="tasks"><b>📦</b>Tasks</div>
<div class="nav" data-page="miners"><b>⚡</b>Miners</div>
<div class="nav" data-page="friends"><b>👥</b>Friends</div>
</div>
</div>
<script>
function showPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  document.querySelectorAll('.nav').forEach(n=>n.classList.remove('active'));
  document.querySelector(`.nav[data-page="${name}"]`).classList.add('active');
  if(window.Telegram?.WebApp?.HapticFeedback) Telegram.WebApp.HapticFeedback.impactOccurred('light');
}
document.querySelectorAll('.nav').forEach(nav=>{
  const h=(e)=>{e.preventDefault();e.stopPropagation();showPage(nav.dataset.page);};
  nav.addEventListener('click',h);
  nav.addEventListener('touchend',h,{passive:false});
});
let balance=0.0880;let mining=0.0024;let progress=45;
const circle=document.getElementById('progressCircle');
const assetsValue=document.getElementById('assetsValue');
const miningPlus=document.getElementById('miningPlus');
const powerFill=document.getElementById('powerFill');
const btn=document.getElementById('claimBtn');
const circ=2*Math.PI*39;circle.style.strokeDasharray=circ;
function updateUI(){
  assetsValue.innerHTML=`${balance.toFixed(4).replace('.',',')} | <span>HRD</span>`;
  miningPlus.innerHTML=`<b>+${mining.toFixed(4)}</b> <span>HRD</span>`;
  powerFill.style.width=progress+'%';
  circle.style.strokeDashoffset=circ-(circ*progress/100);
  if(progress>=100){btn.textContent='CLAIM READY';btn.style.boxShadow='0 6px 0 #7a5a0a, 0 0 30px #ffd700';}
}
let iv=setInterval(()=>{if(progress<100){progress+=0.5;mining+=0.00002;updateUI();}else{clearInterval(iv);}},110);
btn.addEventListener('click',()=>{
  if(progress>=20){
    if(progress>=100){balance+=mining;mining=0.0024;progress=0;}
    else{progress=Math.min(100,progress+18); mining+=0.0004;}
    btn.textContent='CLAIM';updateUI();clearInterval(iv);
    iv=setInterval(()=>{if(progress<100){progress+=0.5;mining+=0.00002;updateUI();}else{clearInterval(iv);updateUI();}},110);
    if(window.Telegram?.WebApp?.HapticFeedback) Telegram.WebApp.HapticFeedback.notificationOccurred('success');
  }
});
updateUI();
const list=document.getElementById('minersList');let html='';
for(let lvl=1;lvl<=200;lvl++){
  let price,hrd,hold,btnClass,btnText;
  if(lvl===1){price='0$';hrd=0;hold=0;btnClass='btn-active';btnText='ACTIVE';}
  else if(lvl===2){price='0.317$';hrd=317;hold=1000;btnClass='btn-need';btnText='NEED 1000';}
  else if(lvl===200){price='2.500$';hrd=25000;hold=100000;btnClass='btn-max200';btnText='MAX 200 👑';}
  else {price=(0.42+(lvl-8)*0.015).toFixed(3)+'$';hrd=4200+(lvl-8)*120;hold=8000+(lvl-8)*800;btnClass='btn-locked';btnText='🔒 LOCKED';}
  const speed=(0.20+(lvl-1)*0.015).toFixed(2);
  const icon=lvl===200?'👑':['🔧','💎','🏆','👑','🚀','🌟'][lvl%6];
  html+=`<div class="miner-card"><div class="miner-icon">${icon}</div><div class="miner-info"><div class="miner-lvl">LVL ${lvl}</div><div class="miner-price">${price}</div><div class="miner-hold">${hrd} HRD • HOLD ${hold.toLocaleString()} HRD</div><div class="miner-speed">⚡ ${speed} TH/s</div></div><button class="miner-btn ${btnClass}">${btnText}</button></div>`;
}
list.innerHTML=html;
</script>
</body>
</html>
