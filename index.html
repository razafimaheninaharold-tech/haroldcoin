<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Haroldcoin</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            background-color: #050312; margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden; font-family: sans-serif;
            user-select: none; -webkit-user-select: none;
        }
        .score { font-size: 50px; font-weight: bold; color: white; margin-bottom: 30px; }
        .coin-btn {
            width: 220px; height: 220px; border-radius: 50%;
            border: none; outline: none; cursor: pointer;
            background: url('coin.png') center/cover no-repeat;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.05s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .coin-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="score" id="scoreDisplay">0</div>
    <button class="coin-btn" id="coinBtn"></button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); tg.ready();

        let score = parseInt(localStorage.getItem('h_score')) || 0;
        const scoreDisplay = document.getElementById('scoreDisplay');
        const coinBtn = document.getElementById('coinBtn');

        scoreDisplay.innerText = score;

        coinBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            score += 1;
            scoreDisplay.innerText = score;
            localStorage.setItem('h_score', score);

            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        });
    </script>
</body>
</html>
