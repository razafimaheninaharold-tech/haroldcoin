<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Haroldcoin - Miners 200 Max</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;justify-content:center}
.app{width:100%;max-width:420px;min-height:100vh;background:#0a0a0a url('bg.jpg') center/cover no-repeat fixed;position:relative;padding-bottom:80px}
.content{position:relative;z-index:2;padding:16px}
.header{position:sticky;top:0;z-index:5;background:rgba(0,0,0,0.92);padding:12px 0;display:flex;align-items:center;gap:12px;margin:-16px -16px 16px -16px;padding-left:16px;border-bottom:1px solid rgba(212,175,55,0.3)}
.back{width:36px;height:36px;border-radius:50%;background:rgba(212,175,55,0.15);border:1px solid #d4af37;display:flex;align-items:center;justify-content:center;color:#d4af37;font-size:18px}
.title{font-family:'Cinzel';font-size:22px;font-weight:900;color:#fff}
.subtitle{font-family:'Inter';font-size:11px;color:#888}
.miner-card{background:linear-gradient(135deg, rgba(20,20,20,0.96), rgba(0,0,0,0.99));border:1.2px solid rgba(212,175,55,0.25);border-radius:16px;padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.miner-card.active{border-color:#d4af37;box-shadow:0 0 18px rgba(212,175,55,0.25)}
.miner-card.max200{border:2px solid #ffd700;background:linear-gradient(135deg, rgba(40,35,0,0.98), rgba(0,0,0,0.99));box-shadow:0 0 30px rgba(255,215,0,0.4)}
.miner-icon{width:48px;height:48px;border-radius:12px;background:#111;border:1px solid #333;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.miner-info{flex:1;min-width:0}
.miner-lvl{font-family:'Inter';font-size:11px;font-weight:800;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.miner-price{font-family:'Inter';font-size:18px;font-weight:800;color:#00ff88}
.miner-hold{font-family:'Inter';font-size:10px;color:#666;margin-top:1px}
.miner-speed{font-family:'Inter';font-size:11px;font-weight:700;color:#d4af37;margin-top:2px}
.miner-btn{padding:8px 14px;border-radius:10px;border:none;font-family:'Inter';font-weight:900;font-size:10px;cursor:pointer;min-width:82px}
.btn-active{background:linear-gradient(#fff9c4,#d4af37);color:#000}
.btn-need{background:linear-gradient(#ffeda0,#ffaa00);color:#000}
.btn-locked{background:#222;color:#666;border:1px solid #333}
.btn-max200{background:linear-gradient(#ffd700,#ff8c00);color:#000;box-shadow:0 0 15px #ffd700;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.progress-bar{height:4px;background:rgba(212,175,55,0.15);border-radius:2px;margin-top:16px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#d4af37,#ffd700);width:0.5%;transition:width 0.3s}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;height:68px;background:rgba(0,0,0,0.97);border-top:1px solid #d4af37;display:flex;justify-content:space-around;align-items:center;z-index:10}
.nav{color:#555;text-align:center;font-size:10px;font-family:'Inter'}.nav.active{color:#d4af37}
</style>
</head>
<body>
<div class="app">
<div class="content">
<div class="header">
<div class="back">←</div>
<div><div class="title">MINERS • 200 MAX 👑</div><div class="subtitle" id="progressText">LVL 1/200 • 0.5% complété</div><div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div></div>
</div>
<div id="minersList"></div>
</div>
<div class="bottom"><div class="nav">⛏️<br>Mine</div><div class="nav">📦<br>Tasks</div><div class="nav active">⚡<br>Miners</div><div class="nav">👥<br>Friends</div></div>
</div>

<script>
const minersList = document.getElementById('minersList');
const icons = ['⛏️','⚙️','🔧','💎','🏆','👑','🚀','🌟','🔥','⚡','💰','🎯','🛠️','🔱','💸'];
let html = '';

// Prix de base selon ta table
const basePrices = [0, 0, 0.317, 0.323, 0.333, 0.375, 0.39, 0.405, 0.42];

for(let lvl=1; lvl<=200; lvl++){
  let price, hrdCost, hold, status, btnClass, btnText, cardClass='';
  
  if(lvl===1){
    price=0; hrdCost=0; hold=0; status='ACTIVE'; btnClass='btn-active'; btnText='ACTIVE'; cardClass='active';
  }else if(lvl<=8){
    price=basePrices[lvl]; 
    hrdCost = [0,317,3230,3330,3750,3900,4050,4200][lvl-1] || Math.floor(4200 + (lvl-8)*50);
    hold = [0,1000,3000,4000,5000,6000,7000,8000][lvl-1] || 8000 + (lvl-8)*500;
    if(lvl===2){btnClass='btn-need'; btnText='NEED 1000 HRD';}
    else {btnClass='btn-locked'; btnText='🔒 LOCKED';}
  }else{
    // Formule pour lvl 9-199
    price = (0.42 + (lvl-8)*0.015).toFixed(3);
    hrdCost = 4200 + (lvl-8)*120;
    hold = 8000 + (lvl-8)*800;
    btnClass='btn-locked'; btnText='🔒 LOCKED';
  }
  
  // LVL 200 MAX ULTIME
  if(lvl===200){
    price = '2.500'; hrdCost=25000; hold=100000; 
    btnClass='btn-max200'; btnText='MAX 200 👑'; 
    cardClass='max200';
  }

  const icon = lvl===200 ? '👑' : icons[lvl % icons.length];
  const speed = (0.20 + (lvl-1)*0.015).toFixed(2); // Speed augmente légèrement
  
  html += `
  <div class="miner-card ${cardClass}">
    <div class="miner-icon">${icon}</div>
    <div class="miner-info">
      <div class="miner-lvl">LVL ${lvl} ${lvl===200?'- MAX ULTIME 200 👑':lvl===1?'- BASIC':''}</div>
      <div class="miner-price" style="${lvl===200?'color:#ffd700':''}">${price}$</div>
      <div class="miner-hold">${hrdCost} HRD • HOLD ${hold.toLocaleString()} HRD</div>
      <div class="miner-speed">⚡ ${speed} TH/s ${lvl===200?'• ULTIME':''}</div>
    </div>
    <button class="miner-btn ${btnClass}">${btnText}</button>
  </div>`;
}

minersList.innerHTML = html;
document.getElementById('progressFill').style.width = '0.5%';
</script>
</body>
</html>
