<div id="msg" style="margin-top:12px;color:#22c55e"></div>
<script>
const SUPA_URL="https://kgmatxqbdyusxpiuavbw.supabase.co",SUPA_KEY="sb_publishable_vn5kPYncLS3TtBS75hSFew_LjeISc47";
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);
let uid=window.Telegram?.WebApp?.initDataUnsafe?.user?.id+""||localStorage.getItem('uid')||"12345";
localStorage.setItem('uid',uid);
let coins=parseInt(localStorage.getItem('coins')||"0"),energy=parseInt(localStorage.getItem('energy')||"1500");
