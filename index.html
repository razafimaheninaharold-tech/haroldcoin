<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADMIN Harold Coins</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{background:#0c0a1a;color:#fff;font-family:sans-serif;padding:12px} .card{background:#1a1a2e;border:1px solid #ffd700;border-radius:14px;padding:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center} button{padding:8px 12px;border-radius:8px;border:0;font-weight:900;cursor:pointer} .pending{background:#facc15;color:#000} .paid{background:#22c55e;color:#000} .reject{background:#ff4444;color:#fff}</style></head><body>
<h2>💸 ADMIN RETRAITS - Harold Coins V8.9.3</h2>
<div id="list">Vérification...</div>
<script>
const U="https://kgmatxqbdyusxpiuavbw.supabase.co",K="sb_publishable_vn5kPYncLS3TtBS75hSFew_LjeISc47",S=supabase.createClient(U,K);
const ADMIN_ID="2120736139";
let uid="";
try{ uid=window.Telegram?.WebApp?.initDataUnsafe?.user?.id+""||""; }catch{}
if(!uid || uid=="undefined"){
  uid=prompt("🔑 Entre ton ID admin 2120736139:")||"";
  if(uid) localStorage.setItem('admin_uid',uid);
  else uid=localStorage.getItem('admin_uid')||"";
}
if(uid!=ADMIN_ID){
  document.body.innerHTML=`<h2 style="color:#ff4444">⛔ Accès refusé</h2><p>ID détecté: ${uid}<br>Uniquement admin ${ADMIN_ID}</p><button onclick="localStorage.removeItem('admin_uid');localStorage.removeItem('uid');location.reload()" style="background:#ffd700;color:#000;padding:10px;border-radius:10px;font-weight:900">🔄 Réessayer + entrer ID</button><br><br><small style="color:#aaa">Astuce: ouvre ce lien DANS Telegram ou tape 2120736139</small>`;
  throw "no admin";
}
async function load(){
 let {data}=await S.from('withdrawals').select('*').order('created_at',{ascending:false}).limit(50);
 let el=document.getElementById('list');
 if(!data||data.length==0){el.innerHTML="Aucun retrait pour l'instant";return}
 let h=`<p style="color:#22c55e">✅ Connecté admin ${uid} - ${data.length} retraits</p>`;
 data.forEach(w=>{
  let date=new Date(w.created_at).toLocaleString('fr-FR');
  h+=`<div class="card"><div><b>${w.user_id}</b> - ${w.amount_coins} 🪙 → ${parseFloat(w.amount_ton_net||0).toFixed(6)} TON<br><small style="color:#aaa">${date} | ${w.wallet_friendly||w.wallet?.slice(0,10)}...<br>Status: <b style="color:${w.status=='pending'?'#facc15':'#22c55e'}">${w.status}</b></small></div><div style="display:flex;gap:4px;flex-direction:column"><button class="paid" onclick="setStatus(${w.id},'paid')">PAYER ✅</button><button class="reject" onclick="setStatus(${w.id},'rejected')">REJETER</button><button onclick="copyWallet('${w.wallet}')" style="background:#333;color:#fff">COPIER</button></div></div>`;
 });
 el.innerHTML=h;
}
async function setStatus(id,status){ if(!confirm("Passer en "+status+" ?")) return; await S.from('withdrawals').update({status}).eq('id',id); load(); }
function copyWallet(w){navigator.clipboard.writeText(w);alert("Wallet copié!");}
load(); setInterval(load,10000);
</script></body></html>
