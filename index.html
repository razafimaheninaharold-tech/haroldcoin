<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Haroldcoin</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;justify-content:center}
.app{width:100%;max-width:420px;height:100vh;background:#000 url('bg.jpg') center/cover;position:relative;overflow:hidden}
.app::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.6) 80%);z-index:0}
.content{position:relative;z-index:2;height:100vh;display:flex;flex-direction:column;padding:12px 14px 80px}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.name{font-family:'Cinzel';font-size:30px;font-weight:900;color:#fff;text-shadow:0 0 30px #d4af37,0 0 60px #d4af37;letter-spacing:2px}
.lvl{margin-top:8px;background:linear-gradient(180deg,#fff9c4 0%,#f9e79f 30%,#d4af37 100%);color:#000;padding:6px 16px;border-radius:20px;font-size:13px;font-weight:900;display:inline-flex;gap:6px;box-shadow:0 4px 15px rgba(212,175,55,0.6), inset 0 1px 0 #fff}
.wallet{background:rgba(0,0,0,0.6);backdrop-filter:blur(10px);border:1.8px solid #d4af37;color:#fff;padding:14px 18px;border-radius:22px;font-size:14px;font-weight:700;min-width:100px;text-align:center;box-shadow:0 0 20px rgba(212,175,55,0.3)}

/* CERCLE MAGNIFIQUE */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.coin-wrapper{position:relative;width:260px;height:260px;display:flex;align-items:center;justify-content:center}
/* Halo externe géant doré */
.halo-outer{position:absolute;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(212,175,55,0.35) 0%,rgba(212,175,55,0.15) 30%,rgba(212,175,55,0.05) 60%,transparent 75%);filter:blur(8px);animation:pulseOuter 3s ease-in-out infinite}
@keyframes pulseOuter{0%,100%{transform:scale(0.85);opacity:0.6}50%{transform:scale(1.15);opacity:1}}
/* Halo moyen brillant */
.halo-mid{position:absolute;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,249,196,0.25) 0%,rgba(212,175,55,0.35) 25%,transparent 70%);filter:blur(2px);animation:pulseMid 2s ease-in-out infinite alternate}
@keyframes pulseMid{0%{transform:scale(0.9)}100%{transform:scale(1.1)}}
/* Anneau doré qui tourne */
.ring{position:absolute;width:230px;height:230px;border-radius:50%;border:2px solid transparent;border-top:2px solid #d4af37;border-right:1.5px solid #f9e79f;box-shadow:0 0 20px #d4af37, inset 0 0 20px rgba(212,175,55,0.2);animation:rotate 4s linear infinite}
.ring2{position:absolute;width:245px;height:245px;border-radius:50%;border:1.5px solid transparent;border-bottom:1.5px solid #f9e79f;border-left:1px solid #d4af37;animation:rotateReverse 6s linear infinite;opacity:0.6}
@keyframes rotate{to{transform:rotate(360deg)}}@keyframes rotateReverse{to{transform:rotate(-360deg)}}
/* Particules dorées */
.particle{position:absolute;width:4px;height:4px;background:#f9e79f;border-radius:50%;box-shadow:0 0 10px #d4af37,0 0 20px #d4af37;animation:floatParticle 3s ease-in-out infinite}
@keyframes floatParticle{0%,100%{transform:translateY(0) scale(1);opacity:0.8}50%{transform:translateY(-20px) scale(1.5);opacity:1}}
.p1{top:10%;left:15%;animation-delay:0s}.p2{top:20%;right:10%;animation-delay:0.5s}.p3{bottom:15%;left:20%;animation-delay:1s}.p4{bottom:10%;right:15%;animation-delay:1.5s}.p5{top:50%;left:0%;animation-delay:0.8s}.p6{top:50%;right:0%;animation-delay:1.2s}
/* Le coin */
.coin{width:200px;height:200px;border-radius:50%;object-fit:contain;position:relative;z-index:5;filter:drop-shadow(0 0 25px rgba(212,175,55,0.9)) drop-shadow(0 0 60px rgba(212,175,55,0.5)) drop-shadow(0 0 100px rgba(212,175,55,0.2));animation:coinFloat 3.5s ease-in-out infinite}
@keyframes coinFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-10px) scale(1.03)}}

.balance{font-family:'Cinzel';font-size:40px;font-weight:900;color:#f9e79f;margin-top:24px;text-shadow:0 0 20px #d4af37,0 0 40px rgba(212,175,55,0.6);letter-spacing:2px}
.claim{margin-top:22px;width:92%;height:68px;border:none;border-radius:22px;background:linear-gradient(180deg,#ffffd0 0%,#fff9c4 20%,#f9e79f 40%,#d4af37 70%,#b8960c 100%);color:#1a1200;font-family:'Cinzel';font-weight:900;font-size:30px;letter-spacing:3px;box-shadow:0 12px 35px rgba(212,175,55,0.6), inset 0 2px 0 #fff, inset 0 -2px 0 rgba(0,0,0,0.2);cursor:pointer;transition:transform 0.1s}
.claim:active{transform:scale(0.96)}
.bottom{position:absolute;bottom:0;left:0;right:0;height:74px;background:linear-gradient(180deg,rgba(10,8,4,0.95),rgba(0,0,0,1));backdrop-filter:blur(15px);border-top:1.5px solid rgba(212,175,55,0.3);display:flex;justify-content:space-around;align-items:center;z-index:10}
.nav{color:#6a5a3a;text-align:center;font-size:10px;font-weight:700;opacity:0.7}.nav.active{color:#d4af37;opacity:1;text-shadow:0 0 10px #d4af37}
</style>
</head>
<body>
<div class="app">
<div class="content">
<div class="top"><div><div class="name">HAROLD</div><div class="lvl">👑 Lvl 1</div></div><div class="wallet">Connect</div></div>

<div class="center">
<div class="coin-wrapper">
<div class="halo-outer"></div>
<div class="halo-mid"></div>
<div class="ring"></div>
<div class="ring2"></div>
<span class="particle p1"></span><span class="particle p2"></span><span class="particle p3"></span><span class="particle p4"></span><span class="particle p5"></span><span class="particle p6"></span>
<img class="coin" src="coin.png">
</div>
<div class="balance" id="bal">0.0760 HRD</div>
<button class="claim" onclick="claim()">CLAIM</button>
</div>
</div>
<div class="bottom"><div class="nav active">⛏️<br>Mine</div><div class="nav">📦<br>Tasks</div><div class="nav">⚡<br>Miners</div><div class="nav">👥<br>Friends</div></div>
</div>
<script>
let b=0.076;
function claim(){b+=0.001;document.getElementById('bal').textContent=b.toFixed(4)+' HRD';let btn=document.querySelector('.claim');btn.textContent='✨ +0.001';setTimeout(()=>btn.textContent='CLAIM',800);}
</script>
</body>
</html>
