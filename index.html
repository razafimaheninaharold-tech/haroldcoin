<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>V11 AUTO TEST</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{background:#0c0a1a;color:#fff;font-family:system-ui;text-align:center;padding:20px}
.box{background:#1c1c2e;border:2px solid #ffd700;border-radius:16px;padding:16px;margin:12px auto;max-width:400px}
.input{width:100%;padding:12px;border-radius:10px;border:1px solid #444;background:#111;color:#fff;margin:8px 0;font-size:16px}
.btn{width:100%;padding:14px;border-radius:12px;border:0;font-weight:900;background:#ffd700;color:#000;cursor:pointer;font-size:16px}
.bal{font-size:36px;font-weight:900;color:#ffd700;margin:20px 0}
</style>
</head>
<body>
<h2>👑 V11 AUTO - TEST ILLIMITÉ</h2>
<div class="bal" id="bal">Chargement...</div>
<div class="box">
<h3>💸 Retrait AUTO</h3>
<div style="font-size:11px;opacity:.7;margin-bottom:8px">✅ Ancienne méthode qui marche<br>50k = 0.005 TON Brut | 0.0045 NET | ILLIMITÉ</div>
<input id="wdAmount" class="input" type="number" value="50000">
<input id="wdWallet" class="input" placeholder="UQ... ton wallet Tonkeeper">
<button class="btn" onclick="testWithdraw()">🚀 TEST RETRAIT V11 AUTO</button>
<div id="msg" style="margin-top:12px;font-size:13px;min-height:30px"></div>
</div>

<script>
const SUPA_URL="https://kgmatxqbdyusxpiuavbw.supabase.co";
const SUPA_KEY="sb_publishable_vn5kPYncLS3TtBS75hSFew_LjeISc47";
const supa=supabase.createClient(SUPA_URL,SUPA_KEY);
let T=window.Telegram?.WebApp; if(T) T.expand();
let uid=T?.initDataUnsafe?.user?.id||2120736139;
let bal=0;

async function loadBal(){
  try{
    let {data}=await supa.from('harold_users').select('balance').eq('id',parseInt(uid)).single();
    bal=data?.balance||881500;
  }catch(e){ bal=881500; }
  document.getElementById('bal').innerText=bal.toLocaleString()+' 🪙';
}
loadBal();

async function testWithdraw(){
  let amt=parseInt(document.getElementById('wdAmount').value||'0');
  let wallet=document.getElementById('wdWallet').value.trim();
  let msg=document.getElementById('msg');
  if(amt<10000){msg.innerText='❌ Min 10000';return;}
  if(!wallet){msg.innerText='❌ Mets ton wallet UQ...';return;}
  if(bal<amt){msg.innerText='❌ Solde insuffisant: '+bal;return;}
  let brut=amt/1000000*0.1;
  let fee=brut*0.1;
  let net=brut*0.9;
  msg.style.color='#ffcc00';
  msg.innerText='⏳ Envoi '+amt+' → '+net.toFixed(6)+' TON...';
  try{
    // ANCIENNE MÉTHODE QUI DONNE SUCCESS
    let {data,error}=await supa.from('withdrawals').insert([{
      user_id: parseInt(uid),
      amount_coins: amt,
      amount_ton: net,
      fee_ton: fee,
      wallet: wallet,
      status: 'pending'
    }]).select();
    if(error) throw error;
    bal-=amt;
    document.getElementById('bal').innerText=bal.toLocaleString()+' 🪙';
    await supa.from('harold_users').upsert({id:parseInt(uid),balance:bal},{onConflict:'id'});
    msg.style.color='#22c55e';
    msg.innerHTML='✅ RETRAIT ENVOYÉ!<br>'+amt.toLocaleString()+' 🪙 → '+net.toFixed(6)+' TON<br><small>Va dans ADMIN → TOUS → REFRESH</small>';
  }catch(e){
    msg.style.color='#ff4444';
    msg.innerText='❌ Erreur: '+e.message;
  }
}
</script>
</body>
</html>
