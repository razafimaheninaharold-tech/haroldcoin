<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Haroldcoin - Nettoyé</title>
    <!-- SDK Telegram Officiel -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            background-color: #050312; 
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Zone centrale de jeu */
        .game-zone {
            position: relative;
            width: 250px;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Halo lumineux jaune autour du cercle */
        .coin-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.25) 0%, rgba(255, 215, 0, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
        }

        /* Le bouton contenant votre logo Harold Coins ENFIN SANS BLANC */
        .main-coin-btn {
            position: relative;
            z-index: 2;
            width: 230px;
            height: 230px;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            outline: none;
            touch-action: manipulation;
            transition: transform 0.05s ease;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7);
            
            /* Lien direct vers votre logo entièrement nettoyé sans le damier blanc */
            background: url('https://postimg.cc') center/contain no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;

            /* Supprime l'effet de surbrillance bleu au clic */
            -webkit-tap-highlight-color: transparent;
        }

        .main-coin-btn:active {
            transform: scale(0.94) translateY(2px);
        }

        /* Chiffre +1 flottant au clic */
        .floating-click {
            position: absolute;
            color: #ffffff;
            font-size: 32px;
            font-weight: 800;
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 3px 6px rgba(0, 0, 0, 0.8);
            animation: moveUpFade 0.5s ease-out forwards;
        }

        @keyframes moveUpFade {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-80px) scale(0.85); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="game-zone" id="gameZone">
        <div class="coin-glow"></div>
        <button class="main-coin-btn" id="coinBtn"></button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        let score = parseInt(localStorage.getItem('h_github_score')) || 0;
        const clickValue = 1;

        const coinBtn = document.getElementById('coinBtn');
        const gameZone = document.getElementById('gameZone');

        coinBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            
            score += clickValue;
            localStorage.setItem('h_github_score', score);

            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }

            generateClickEffect(e.clientX, e.clientY);
        });

        function generateClickEffect(clientX, clientY) {
            const boundary = gameZone.getBoundingClientRect();
            const posX = clientX - boundary.left;
            const posY = clientY - boundary.top;

            const element = document.createElement('div');
            element.className = 'floating-click';
            element.innerText = `+${clickValue}`;
            element.style.left = `${posX}px`;
            element.style.top = `${posY}px`;

            gameZone.appendChild(element);
            setTimeout(() => element.remove(), 500);
        }
    </script>
</body>
</html>
