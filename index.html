<script>
function showPage(n){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('page-'+n).classList.add('active');document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));document.querySelector(`.nav[data-page="${n}"]`).classList.add('active');if(n==='friends'){loadFriends();loadTopInviters();}if(n==='tasks')renderTasks();}
document.querySelectorAll('.nav').forEach(nav=>{nav.addEventListener('click',()=>showPage(nav.dataset.page));});
const SUPA_URL="https://kgmatxqbdyusxpiuavbw.supabase.co";const SUPA_KEY="sb_publishable_vn5kPYncLS3TtBS75hSFew_LjeISc47";const supa=supabase.createClient(SUPA_URL,SUPA_KEY);
let tg=window.Telegram?.WebApp;let uid=tg?.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : '2120736139';
const MINING_DURATION=4*60*60*1000;let balanceCoins=0,balanceHRD=0,mining=0,progress=0,currentLvl=1,loaded=false,miningStartTime=Date.now(),miningCards={},tasksDone={},friendsCount=0;let currentUserName='',currentUserPhoto='';let walletAddress=null,walletFriendly=null;let tonConnectUI=null;
const circle=document.getElementById('progressCircle'),assetsValue=document.getElementById('assetsValue'),miningPlus=document.getElementById('miningPlus'),btn=document.getElementById('claimBtn'),timerEl=document.getElementById('timer');
const circ=2*Math.PI*40;circle.style.strokeDasharray=circ;
const TASKS=[{id:'x_follow',name:'Follow X',sub:'@Haroldcoinsbot',icon:'𝕏',color:'linear-gradient(135deg,#000,#444)',link:'https://x.com/Haroldcoinsbot',reward:15000},{id:'insta_follow',name:'Follow Instagram',sub:'haroldcoinsbot',icon:'📸',color:'linear-gradient(135deg,#833AB4,#E1306C,#FCB045)',link:'https://instagram.com/haroldcoinsbot',reward:15000},{id:'tg_channel',name:'Rejoindre Canal HRD',sub:'t.me/HaroldcoinsOfficial',icon:'📢',color:'linear-gradient(135deg,#00e5ff,#0080ff)',link:'https://t.me/HaroldcoinsOfficial',reward:15000},{id:'tg_bot',name:'Lancer le Bot',sub:'@Haroldcoinsbot',icon:'🤖',color:'linear-gradient(135deg,#ffd700,#ff8c00)',link:'https://t.me/Haroldcoinsbot',reward:10000},{id:'invite_1',name:'Invite 1 Friend',sub:'1 ami',icon:'👥',color:'linear-gradient(135deg,#00ff88,#00cc66)',link:'#invite',reward:10000,needRef:1},{id:'invite_3',name:'Invite 3 Friends',sub:'3 amis',icon:'🚀',color:'linear-gradient(135deg,#00e5ff,#ffd700)',link:'#invite',reward:30000,needRef:3},{id:'invite_10',name:'Invite 10 Friends',sub:'10 amis',icon:'👑',color:'linear-gradient(135deg,#ffd700,#ff0080)',link:'#invite',reward:100000,needRef:10}];
function getHold(lvl){if(lvl<=1) return 0; return 1800 * lvl * lvl;}
function getMinerData(lvl){let hold=getHold(lvl);let speed=0.20 + (lvl-1)*0.02;let hrd4h=speed*0.04*4;let priceValue=hold*0.0000015;if(priceValue<0.001) priceValue=0.001+hold*0.0000008;let price='$'+priceValue.toFixed(3);if(lvl==1) price='$0.001';return {price:price,hold:hold,speed:parseFloat(speed.toFixed(2)),hrd4h:hrd4h};}
function getLevelFromBalance(bal){if(bal<1800) return 1; let lvl=Math.floor(Math.sqrt(bal/1800)); if(lvl<1) lvl=1; if(lvl>1000) lvl=1000; return lvl;}
function formatTime(ms){if(ms<=0)return "00:00:00 - CLAIM!";let s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')} restant`;}
function toUQ(addr){if(!addr) return addr; try{ return new TonWeb.utils.Address(addr).toString(true,true,false,false);}catch(e){return addr;}}
function updateUI(){if(assetsValue) assetsValue.textContent=balanceCoins.toLocaleString("en-US")+" coins";if(miningPlus) miningPlus.textContent="+"+mining.toFixed(4)+" HRD";let hr=document.getElementById('hashRate');if(hr) hr.textContent=getMinerData(currentLvl).speed+" TH/s";circle.style.strokeDashoffset=circ-(circ*progress/100);let remain=MINING_DURATION-(Date.now()-miningStartTime);timerEl.textContent=formatTime(remain);if(progress>=100){btn.textContent="CLAIM READY!";btn.classList.add('ready');}else{btn.textContent="MINING...";btn.classList.remove('ready');}document.getElementById('lvlDisplay').textContent="LVL "+currentLvl;let rl=document.getElementById('rightLvl');if(rl) rl.textContent="LVL "+currentLvl;let rv=document.getElementById('rightVal');if(rv) rv.innerHTML="+"+(friendsCount*10)+"%<br>BONUS";let nextHold=getHold(currentLvl+1);let needCoins=Math.max(0,nextHold-balanceCoins);let needDollars=needCoins*0.0000015;if(needDollars<0.001) needDollars=0.001+needCoins*0.0000008;let leftEl=document.getElementById('leftToLvl');if(leftEl) leftEl.textContent=needDollars.toFixed(4)+"$ left to Lvl UP ›";let ms=document.getElementById('minersSub');if(ms) ms.textContent="LVL "+currentLvl+"/1000 • NEXT: "+nextHold.toLocaleString("en-US");}
function updateWalletUI(){let wBtn=document.getElementById('walletBtn');let wText=document.getElementById('walletText');if(walletAddress){walletFriendly=toUQ(walletAddress);wBtn.classList.add('connected');wText.innerHTML=walletFriendly.slice(0,6)+'...'+walletFriendly.slice(-4)+'<br>✓';}else{wBtn.classList.remove('connected');wText.innerHTML='Connect Wallet';}}
async function saveBalance(){if(!loaded) return; try{await supa.from('harold_users').upsert({id:parseInt(uid),balance:balanceCoins,first_name:currentUserName,photo_url:currentUserPhoto,wallet_address:walletFriendly||walletAddress,mining_start:new Date(miningStartTime).toISOString(),mining_amount:mining,mining_cards:JSON.stringify(miningCards),tasks_done:JSON.stringify(tasksDone),last_seen:new Date().toISOString()},{onConflict:'id'});}catch(e){}}
async function loadBalance(){walletAddress=localStorage.getItem('hrd_wallet_'+uid)||null; walletFriendly=localStorage.getItem('hrd_wallet_friendly_'+uid)||toUQ(walletAddress); updateWalletUI(); try{let u=tg?.initDataUnsafe?.user;if(u){currentUserName=(u.first_name||'Player')+(u.last_name?' '+u.last_name:'');currentUserPhoto=u.photo_url||'';document.getElementById('userName').textContent=currentUserName;if(u.photo_url){let img=document.getElementById('userAvatar');img.src=u.photo_url;img.style.display='block';document.getElementById('userAvatarFallback').style.display='none';}}}catch(e){currentUserName='Player '+uid;document.getElementById('userName').textContent=currentUserName;} try{let {data}=await supa.from('harold_users').select('*').eq('id',parseInt(uid)).single(); if(data){balanceCoins=data.balance||0;balanceHRD=balanceCoins/1000000;currentLvl=getLevelFromBalance(balanceCoins);if(data.wallet_address){ walletAddress=data.wallet_address; walletFriendly=toUQ(data.wallet_address); localStorage.setItem('hrd_wallet_'+uid, walletAddress); localStorage.setItem('hrd_wallet_friendly_'+uid, walletFriendly); updateWalletUI(); }try{miningCards=JSON.parse(data.mining_cards||"{}");}catch(e){}try{tasksDone=JSON.parse(data.tasks_done||"{}");}catch(e){}if(data.mining_start) miningStartTime=new Date(data.mining_start).getTime(); if(data.mining_amount) mining=parseFloat(data.mining_amount)||0;} let elapsed=Date.now()-miningStartTime;if(elapsed>=MINING_DURATION){progress=100;mining=getMinerData(currentLvl).hrd4h;}else{progress=(elapsed/MINING_DURATION)*100;mining=(progress/100)*getMinerData(currentLvl).hrd4h;} loaded=true;updateUI();renderMiners();renderTasks();document.getElementById('inviteLink').value="https://t.me/Haroldcoin_bot?start="+uid;saveBalance();}catch(e){let elapsed=Date.now()-miningStartTime;if(elapsed>=MINING_DURATION){progress=100;mining=getMinerData(currentLvl).hrd4h;}else{progress=(elapsed/MINING_DURATION)*100;mining=(progress/100)*getMinerData(currentLvl).hrd4h;}loaded=true;updateUI();renderMiners();renderTasks();}}
document.addEventListener('DOMContentLoaded', ()=>{tonConnectUI = new TON_CONNECT_UI.TonConnectUI({manifestUrl: 'https://razafimaheninaharold-tech.github.io/haroldcoin/tonconnect-manifest.json',buttonRootId: 'ton-root-hidden'}); tonConnectUI.onStatusChange(wallet => {if(wallet && wallet.account){ walletAddress=wallet.account.address; walletFriendly=toUQ(walletAddress); localStorage.setItem('hrd_wallet_'+uid, walletAddress); localStorage.setItem('hrd_wallet_friendly_'+uid, walletFriendly); updateWalletUI();saveBalance();}else{ walletAddress=null;walletFriendly=null; localStorage.removeItem('hrd_wallet_'+uid); localStorage.removeItem('hrd_wallet_friendly_'+uid); updateWalletUI();saveBalance();}});});
async function connectWallet(){ if(!tonConnectUI) return; if(walletAddress){ if(confirm('Copier UQ?\n'+walletFriendly)) navigator.clipboard.writeText(walletFriendly); if(confirm('Déconnecter?')) await tonConnectUI.disconnect(); } else { await tonConnectUI.openModal(); }}
function renderMiners(){let html='';for(let lvl=1;lvl<=1000;lvl++){let d=getMinerData(lvl),bc,bt;if(lvl<currentLvl){bc='btn-active';bt='ACTIVE';}else if(lvl===currentLvl){bc='btn-max';bt='ACTUEL';}else if(balanceCoins>=d.hold){bc='btn-need';bt='UPGRADE';}else{bc='btn-locked';bt='NEED '+d.hold.toLocaleString("en-US");}html+=`<div class="miner-card"><div class="miner-icon">⚡</div><div style="flex:1"><div style="font-size:10px;color:#888">LVL ${lvl}</div><div style="font-size:14px;color:#00ff88;font-weight:900">${d.price}</div><div style="font-size:9px;color:#aaa">HOLD ${d.hold.toLocaleString()} • ${d.speed} TH/s</div></div><button class="miner-btn ${bc}" onclick="buyLevel(${lvl})">${bt}</button></div>`;}document.getElementById('minersList').innerHTML=html;}
function renderTasks(){let html='';TASKS.forEach(t=>{let done=tasksDone[t.id];html+=`<div class="miner-card"><div class="miner-icon" style="background:${t.color}">${t.icon}</div><div style="flex:1"><div style="font-size:13px;color:#fff;font-weight:800">${t.name}</div><div style="font-size:11px;color:#00ff88">${t.sub} • +${t.reward.toLocaleString()}</div></div><button class="miner-btn ${done?'btn-max':'btn-need'}" onclick="${done?'':`doTask('${t.id}')`}">${done?'✅ FAIT':'GO'}</button></div>`;});document.getElementById('tasksList').innerHTML=html;}
async function doTask(id){let task=TASKS.find(x=>x.id===id);if(!task || tasksDone[id]) return;if(task.link!=='#invite') window.open(task.link,'_blank'); setTimeout(async()=>{tasksDone[id]=true;balanceCoins+=task.reward;balanceHRD=balanceCoins/1000000;currentLvl=getLevelFromBalance(balanceCoins);updateUI();renderMiners();renderTasks();await saveBalance();},1200);}
function buyLevel(lvl){let need=getHold(lvl);if(balanceCoins<need || lvl<=currentLvl) return; currentLvl=lvl;updateUI();renderMiners();saveBalance();}
setInterval(()=>{if(!loaded)return;let elapsed=Date.now()-miningStartTime;if(elapsed>=MINING_DURATION){progress=100;mining=getMinerData(currentLvl).hrd4h;}else{progress=(elapsed/MINING_DURATION)*100;mining=(progress/100)*getMinerData(currentLvl).hrd4h;}updateUI();},1000);
btn.addEventListener('click',async()=>{let elapsedCheck=Date.now()-miningStartTime;if(elapsedCheck < MINING_DURATION - 5000) return; if(progress>=100){let claimed=mining;if(claimed<=0) return;balanceHRD+=claimed;balanceCoins=Math.floor(balanceHRD*1000000);mining=0;progress=0;miningStartTime=Date.now();updateUI();renderMiners();await saveBalance();}});
async function loadFriends(){try{let {data:f}=await supa.from('harold_users').select('*').eq('referred_by',parseInt(uid));f=f||[];friendsCount=f.length;document.getElementById('friendsSub').textContent=f.length+" amis • +"+(f.length*10)+"%";document.getElementById('myFriendsSub').textContent=f.length+" amis";let list=document.getElementById('friendsList');if(f.length===0){list.innerHTML='<div style="color:#666;text-align:center;margin-top:10px">Aucun ami</div>';return;}let h='';f.forEach(u=>{h+=`<div class="miner-card"><div class="miner-icon">👤</div><div style="flex:1"><div style="color:#fff;font-size:12px">${u.first_name||'Ami'}</div><div style="color:#00ff88;font-size:11px">${(u.balance||0).toLocaleString()} coins</div></div></div>`;});list.innerHTML=h;updateUI();}catch(e){}}
async function loadTopInviters(){try{let {data}=await supa.from('harold_users').select('referred_by').not('referred_by','is',null);let counts={};(data||[]).forEach(r=>{counts[r.referred_by]=(counts[r.referred_by]||0)+1;});let sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,10);let html='';sorted.forEach((e,i)=>{let m=i<3?['🥇','🥈','🥉'][i]:`#${i+1}`;html+=`<div class="miner-card"><div class="miner-icon">${m}</div><div style="flex:1"><div style="color:#fff;font-size:12px">ID ${String(e[0]).slice(-4)}</div><div style="color:#00ff88;font-size:11px">${e[1]} invités</div></div></div>`;});document.getElementById('topInviters').innerHTML=html||'<div style="color:#666;text-align:center">Aucun</div>';}catch(e){}}
function copyLink(){navigator.clipboard.writeText(document.getElementById('inviteLink').value); alert('Lien copié!');}
document.getElementById('inviteBtn')?.addEventListener('click',copyLink);

loadBalance();if(tg){tg.ready();tg.expand();}
