<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Haroldcoin</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;justify-content:center}
.app{width:100%;max-width:420px;height:100vh;background:#000 url('bg.jpg') center/cover no-repeat;position:relative;overflow:hidden}
.content{position:relative;z-index:2;height:100vh;display:flex;flex-direction:column;padding:14px 14px 85px}
.top{display:flex;justify-content:space-between}
.name{font-family:'Cinzel';font-size:32px;font-weight:900;color:#fff;text-shadow:0 0 12px #d4af37}
.lvl{background:linear-gradient(#fff9c4,#d4af37);color:#000;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:900;display:inline-block;margin-top:4px}
.wallet{background:rgba(0,0,0,0.75);border:1.5px solid #d4af37;color:#fff;padding:8px 14px;border-radius:20px;font-size:11px}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.coin-wrap{position:relative;width:150px;height:150px;display:flex;align-items:center;justify-content:center;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.mining-circle{position:absolute;width:150px;height:150px;transform:rotate(-90deg);z-index:10}
.mining-circle circle{fill:none;stroke-linecap:round}
.track{stroke:rgba(255,215,0,0.14);stroke-width:8px}
.progress{stroke:#FFD700;stroke-width:8px;stroke-dasharray:282;stroke-dashoffset:282;filter:drop-shadow(0 0 12px #FFD700) drop-shadow(0 0 20px #d4af37);transition:stroke-dashoffset 0.6s ease}
.coin{width:130px;height:130px;z-index:5;border-radius:50%;clip-path:circle(36.5% at 50% 50%);filter:brightness(1.28) drop-shadow(0 0 22px #d4af37);animation:shine 2s infinite}
@keyframes shine{0%,100%{filter:brightness(1.25) drop-shadow(0 0 15px #d4af37)}50%{filter:brightness(1.4) drop-shadow(0 0 32px #ffd700)}}
.bal{font-family:'Cinzel';font-size:38px;font-weight:900;color:#fff;margin-top:16px;text-shadow:0 0 15px #d4af37}
.mining-text{font-family:'Inter';font-size:13px;color:#FFD700;margin-top:10px;font-weight:800;letter-spacing:1px;text-shadow:0 0 12px #FFD700}
.claim{margin-top:20px;width:90%;height:60px;border:none;border-radius:24px;background:linear-gradient(180deg,#ffffd0,#f9e79f,#d4af37,#b8941f);color:#000;font-family:'Cinzel';font-weight:900;font-size:24px;box-shadow:0 8px 28px rgba(212,175,55,0.6);cursor:pointer}
.bottom{position:absolute;bottom:0;left:0;right:0;height:72px;background:rgba(0,0,0,0.92);border-top:1px solid #d4af37;display:flex;justify-content:space-around;align-items:center;z-index:10}
.nav{color:#666;text-align:center;font-size:11px}.nav.active{color:#d4af37}
</style>
</head>
<body>
<div class="app">
<div class="content">
<div class="top"><div><div class="name">HAROLD</div><div class="lvl">👑 Lvl 1</div></div><div class="wallet">Connect Wallet</div></div>
<div class="center">
<div class="coin-wrap">
<svg class="mining-circle" viewBox="0 0 150 150">
<circle class="track" cx="75" cy="75" r="45"></circle>
<circle class="progress" id="progressCircle" cx="75" cy="75" r="45"></circle>
</svg>
<img class="coin" src="coin.png">
</div>
<div class="bal">0.0780 HRD</div>
<div class="mining-text" id="miningText">⛏️ MINING... 0%</div>
<button class="claim" id="claimBtn">CLAIM</button>
</div>
</div>
<div class="bottom"><div class="nav active">⛏️<br>Mine</div><div class="nav">📦<br>Tasks</div><div class="nav">⚡<br>Miners</div><div class="nav">👥<br>Friends</div></div>
</div>
<script>
let progress=0;
const circle=document.getElementById('progressCircle');
const text=document.getElementById('miningText');
const btn=document.getElementById('claimBtn');
const circ=2*Math.PI*45;
circle.style.strokeDasharray=circ;
circle.style.strokeDashoffset=circ;
function setProgress(p){
  const offset=circ-(p/100)*circ;
  circle.style.strokeDashoffset=offset;
  text.textContent=p>=100?'✅ COMPLET - CLAIM!':`⛏️ MINING... ${Math.floor(p)}%`;
  if(p>=100){btn.textContent='CLAIM READY';btn.style.boxShadow='0 0 35px #ffd700, 0 0 60px #d4af37';}
}
let iv=setInterval(()=>{if(progress<100){progress+=0.7;setProgress(progress);}else{clearInterval(iv);}},100);
btn.addEventListener('click',()=>{if(progress>=100){progress=0;setProgress(0);btn.textContent='CLAIM';iv=setInterval(()=>{if(progress<100){progress+=0.7;setProgress(progress);}else{clearInterval(iv);}},100);}});
</script>
</body>
</html>
