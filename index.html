<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Haroldcoin - Version Notcoin</title>
    <!-- SDK Telegram Officiel -->
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(180deg, #1b2236 0%, #0d111b 100%);
            --accent-gold: #f3ba2f;
            --text-main: #ffffff;
            --text-muted: #8a91a5;
            --surface-blur: rgba(255, 255, 255, 0.06);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: calc(100vh - 32px);
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 1. Bannière d'information supérieure (Wallet News / Status) */
        .top-banner {
            width: 100%;
            max-width: 400px;
            background: #181c26;
            border-radius: 16px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
        }

        .banner-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .wallet-icon {
            width: 40px;
            height: 40px;
            background: #007aff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .banner-text-title {
            font-size: 14px;
            font-weight: 600;
        }

        .banner-text-value {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .league-badge-top {
            background: rgba(255,255,255,0.05);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 2. Affichage du Score géant */
        .score-section {
            text-align: center;
            margin-top: 10px;
        }

        .score-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .mini-coin {
            width: 35px;
            height: 35px;
            background: var(--accent-gold);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(243, 186, 47, 0.5);
        }

        .main-score {
            font-size: 44px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .league-navigation {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 8px;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
        }

        /* 3. Zone Centrale du Jeton de jeu */
        .game-zone {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-coin-btn {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            /* METTEZ L'URL DE VOTRE IMAGE ICI DANS LES GUILLEMETS */
            background: url('') center/cover no-repeat, var(--accent-gold); 
            border: none;
            outline: none;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), inset 0 -8px 0px rgba(0,0,0,0.15);
            cursor: pointer;
            transition: transform 0.05s ease;
        }

        .main-coin-btn:active {
            transform: scale(0.96) translateY(2px);
        }

        /* Effet du +1 flottant */
        .floating-click {
            position: absolute;
            color: #ffffff;
            font-size: 26px;
            font-weight: 700;
            pointer-events: none;
            animation: moveUpFade 0.6s ease-out forwards;
        }

        @keyframes moveUpFade {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-80px); opacity: 0; }
        }

        /* 4. Section Basse : Énergie */
        .energy-section {
            width: 100%;
            max-width: 400px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 5px;
        }

        .energy-icon-text {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
        }

        .energy-progress-bg {
            flex-grow: 1;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .energy-progress-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ffd700, #ffa500);
            border-radius: 10px;
            transition: width 0.1s ease;
        }

        /* 5. Menu de navigation inférieur (Frens, Earn, Boosts) */
        .bottom-nav {
            width: 100%;
            max-width: 400px;
            background: var(--surface-blur);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            display: flex;
            padding: 8px 4px;
            box-sizing: border-box;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .nav-item:active {
            opacity: 1;
            transform: scale(0.95);
        }

        .nav-icon {
            font-size: 20px;
        }
    </style>
</head>
<body>

    <!-- En-tête (Style Notcoin) -->
    <div class="top-banner">
        <div class="banner-left">
            <div class="wallet-icon">👛</div>
            <div>
                <div class="banner-text-title">Wallet News</div>
                <div class="banner-text-value">8,184,977,457</div>
            </div>
        </div>
        <div class="league-badge-top">💎 Diamond</div>
    </div>

    <!-- Affichage des points et de la Ligue -->
    <div class="score-section">
        <div class="score-row">
            <div class="mini-coin"></div>
            <div class="main-score" id="scoreDisplay">0</div>
        </div>
        <div class="league-navigation" onclick="openLeague()">
            <span>🏆 Silver</span>
            <span>›</span>
        </div>
    </div>

    <!-- Zone de Click du Jeton principal -->
    <div class="game-zone" id="gameZone">
        <button class="main-coin-btn" id="coinBtn"></button>
    </div>

    <!-- Indicateur d'Énergie -->
    <div class="energy-section">
        <div class="energy-icon-text">⚡ <span id="energyText">1000</span></div>
        <div class="energy-progress-bg">
            <div class="energy-progress-fill" id="energyBar"></div>
        </div>
    </div>

    <!-- Menu de navigation inférieur -->
    <div class="bottom-nav">
        <button class="nav-item" onclick="navigate('frens')">
            <span class="nav-icon">🎁</span>
            <span>Frens</span>
        </button>
        <button class="nav-item" onclick="navigate('earn')">
            <span class="nav-icon">🪙</span>
            <span>Earn</span>
        </button>
        <button class="nav-item" onclick="navigate('boosts')">
            <span class="nav-icon">🚀</span>
            <span>Boosts</span>
        </button>
    </div>
