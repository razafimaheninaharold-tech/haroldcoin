<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haroldcoin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{background:#050312;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0}
#score{font-size:50px;font-weight:800;color:#ffd700}
#coin{width:200px;height:200px;border-radius:50%;background:#ffd700;border:none;font-size:80px}
</style>
</head>
<body>
<div id="score">0</div>
<button id="coin">🪙</button>
<div id="status">Test OK</div>
<script>
const tg = window.Telegram.WebApp;
tg.expand();
tg.ready();
let s = 0;
document.getElementById('coin').onclick = ()=>{
 s++; 
 document.getElementById('score').innerText = s;
 tg.HapticFeedback.impactOccurred('light');
}
document.getElementById('status').innerText = "User: " + (tg.initDataUnsafe.user?.first_name || "Joueur");
</script>
</body>
</html>
