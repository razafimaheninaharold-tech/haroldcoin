        .main-coin-btn {

            border-radius: 50%; cursor: pointer; border: none; outline: none; 
            touch-action: manipulation; transition: transform 0.05s ease; 
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7); 
            background: url('coin.png') center/cover no-repeat; 
            display: flex; align-items: center; justify-content: center; 
            -webkit-tap-highlight-color: transparent; 
        }
        .main-coin-btn:active { transform: scale(0.94) translateY(2px); }
        
        .floating-click { position: absolute; color: #ffffff; font-size: 32px; font-weight: 800; pointer-events: none; z-index: 10; text-shadow: 0 3px 6px rgba(0, 0, 0, 0.8); animation: moveUpFade 0.5s ease-out forwards; }
        @keyframes moveUpFade { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-80px) scale(0.85); opacity: 0; } }
