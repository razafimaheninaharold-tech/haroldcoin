<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Haroldcoin - Solo Coin</title>
    <!-- SDK Telegram Officiel -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            background-color: #050312; /* Fond sombre pour faire ressortir le cercle */
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Zone centrale de jeu */
        .game-zone {
            position: relative;
            width: 250px;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Halo lumineux jaune uniquement autour du cercle */
        .coin-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.3) 0%, rgba(255, 215, 0, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
        }

        /* Le Cercle Jaune Seul */
        .main-coin-btn {
            position: relative;
            z-index: 2;
            width: 230px;
            height: 230px;
            border-radius: 50%;
            cursor: pointer;
            border: 6px solid #ffd700;
            outline: none;
            touch-action: manipulation;
            transition: transform 0.05s ease;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7);
            
            /* Design premium dégradé jaune/or */
            background: radial-gradient(circle, #ffe552 0%, #f3ba2f 70%, #a07600 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Symbole central */
        .main-coin-btn::after {
            content: "⚡";
            font-size: 90px;
            color: #ffffff;
            text-shadow: 0 4px 12px rgba(0,0,0,0.4);
        }

        .main-coin-btn:active {
            transform: scale(0.94) translateY(2px);
        }

        /* Chiffre +1 flottant au clic */
        .floating-click {
            position: absolute;
            color: #ffffff;
            font-size: 32px;
            font-weight: 800;
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 3px 6px rgba(0, 0, 0, 0.8);
            animation: moveUpFade 0.5s ease-out forwards;
        }

        @keyframes moveUpFade {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-80px) scale(0.85); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Uniquement la zone du cercle jaune -->
    <div class="game-zone" id="gameZone">
        <div class="coin-glow"></div>
        <button class="main-coin-btn" id="coinBtn"></button>
    </div>

    <script>
        // Init Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // Sauvegarde simplifiée du score
        let score = parseInt(localStorage.getItem('h_solo_score')) || 0;
        const clickValue = 1;

        const coinBtn = document.getElementById('coinBtn');
        const gameZone = document.getElementById('gameZone');

        // Événement du clic
        coinBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            
            score += clickValue;
            localStorage.setItem('h_solo_score', score);

            // Vibration légère sur le téléphone via Telegram
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }

            // Génération de l'effet flottant +1
            generateClickEffect(e.clientX, e.clientY);
        });

        function generateClickEffect(clientX, clientY) {
            const boundary = gameZone.getBoundingClientRect();
            const posX = clientX - boundary.left;
            const posY = clientY - boundary.top;

            const element = document.createElement('div');
            element.className = 'floating-click';
            element.innerText = `+${clickValue}`;
            element.style.left = `${posX}px`;
            element.style.top = `${posY}px`;

            gameZone.appendChild(element);
            setTimeout(() => element.remove(), 500);
        }
    </script>
</body>
</html>
