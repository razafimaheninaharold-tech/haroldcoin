<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Haroldcoin - Secours Local</title>
    <style>
        body {
            margin: 0;
            background-color: #1a103c;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        .header {
            margin-top: 30px;
            text-align: center;
            width: 100%;
        }
        .username {
            font-size: 18px;
            color: #a29bfe;
            font-weight: bold;
        }
        .score-container {
            font-size: 54px;
            font-weight: 900;
            color: #f1c40f;
            margin-top: 5px;
        }
        .coin-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            width: 100%;
        }
        /* Bouton ultra-robuste sans fioritures */
        .gros-bouton-piece {
            width: 260px;
            height: 260px;
            border-radius: 50%;
            border: 6px solid #f1c40f;
            overflow: hidden;
            background-color: #0b061d;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(241, 196, 15, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        .gros-bouton-piece img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }
        .gros-bouton-piece:active {
            transform: scale(0.92);
        }
        .game-status {
            width: 85%;
            margin-bottom: 50px;
        }
        .energy-text {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .energy-bar-bg {
            width: 100%;
            height: 16px;
            background-color: #2d1f5d;
            border-radius: 10px;
            overflow: hidden;
        }
        .energy-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #f1c40f, #e67e22);
            border-radius: 10px;
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="username">⭐ Harold Trader (Mode Local)</div>
        <div class="score-container" id="affichageScore">0</div>
    </div>

    <div class="coin-container">
        <!-- Utilisation d'un bouton HTML standard, le plus robuste pour mobile -->
        <button class="gros-bouton-piece" id="zoneClic">
            <img src="téléchargement (63) (1) (2) (1) (2) (1).jpeg" alt="Logo">
        </button>
    </div>

    <div class="game-status">
        <div class="energy-text">🟡 <span id="texteEnergie">1000/1000</span></div>
        <div class="energy-bar-bg">
            <div class="energy-bar-fill" id="barreEnergie"></div>
        </div>
    </div>

    <script>
        // Logique 100% autonome et immédiate sans aucun script externe
        let scoreActuel = parseInt(localStorage.getItem('harold_score_local')) || 0;
        let energieActuelle = 1000;
        const energieMax = 1000;

        const affichageScore = document.getElementById('affichageScore');
        const texteEnergie = document.getElementById('texteEnergie');
        const barreEnergie = document.getElementById('barreEnergie');
        const zoneClic = document.getElementById('zoneClic');

        // Affichage de départ instantané
        affichageScore.innerText = scoreActuel.toLocaleString();
        texteEnergie.innerText = energieActuelle + "/1000";
        barreEnergie.style.width = "100%";

        // Fonction d'action de clic pure
        function executerClic() {
            if (energieActuelle > 0) {
                scoreActuel = scoreActuel + 14;
                energieActuelle = energieActuelle - 1;

                // Mise à jour visuelle instantanée de l'écran
                affichageScore.innerText = scoreActuel.toLocaleString();
                texteEnergie.innerText = energieActuelle + "/1000";
                barreEnergie.style.width = (energieActuelle / energieMax * 100) + "%";

                // Sauvegarde immédiate dans la mémoire du téléphone
                localStorage.setItem('harold_score_local', scoreActuel);
            }
        }

        // Branchement des écouteurs tactiles universels de force brute
        zoneClic.onclick = function(e) {
            e.preventDefault();
            executerClic();
        };
        
        zoneClic.addEventListener('touchstart', function(e) {
            e.preventDefault();
            executerClic();
        }, { passive: false });

        // Recharge automatique de l'énergie (+1 par seconde)
        setInterval(function() {
            if (energieActuelle < energieMax) {
                energieActuelle = energieActuelle + 1;
                texteEnergie.innerText = energieActuelle + "/1000";
                barreEnergie.style.width = (energieActuelle / energieMax * 100) + "%";
            }
        }, 1000);
    </script>

</body>
</html>
