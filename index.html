<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haroldcoins Game</title>
    <style>
        body {
            margin: 0;
            background-color: #0b1426;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        .header {
            margin-top: 50px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 32px;
            letter-spacing: 2px;
        }
        .score-container {
            font-size: 56px;
            font-weight: bold;
            color: #f1c40f;
            text-shadow: 0 0 20px rgba(241, 196, 15, 0.6);
            margin-top: 10px;
        }
        .coin-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
        }
        .coin {
            width: 240px;
            height: 240px;
            background: linear-gradient(135deg, #f39c12, #d35400);
            border-radius: 50%;
            box-shadow: 0 15px 35px rgba(211, 84, 0, 0.6), inset 0 0 25px rgba(255, 255, 255, 0.4);
            border: 8px solid #f1c40f;
            cursor: pointer;
            transition: transform 0.05s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 90px;
            -webkit-tap-highlight-color: transparent;
        }
        .coin:active {
            transform: scale(0.92);
        }
        .footer {
            margin-bottom: 50px;
            font-size: 16px;
            color: #7f8c8d;
            text-align: center;
            padding: 0 20px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>HAROLDCOINS</h1>
        <div class="score-container" id="score">0</div>
    </div>

    <div class="coin-container">
        <div class="coin" id="coinBtn">🪙</div>
    </div>

    <div class="footer">
        Cliquez sur la pièce pour accumuler vos points avant l'Airdrop !
    </div>

    <script>
        let score = 0;
        const scoreDisplay = document.getElementById('score');
        const coinButton = document.getElementById('coinBtn');

        coinButton.addEventListener('click', () => {
            score++;
            scoreDisplay.textContent = score;
            
            // Petite vibration sur mobile pour rendre le clic satisfaisant
            if (navigator.vibrate) {
                navigator.vibrate(40);
            }
        });
    </script>
</body>
  </html>
