<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Haroldcoin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(circle at top,#1e1c42 0%,#080516 70%);color:white;font-family:sans-serif;height:100vh;overflow:hidden}
#app{height:100vh;display:flex;flex-direction:column}
.header{padding:14px 16px;display:flex;justify-content:space-between}
.balance-row{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:8px}
.balance{font-size:44px;font-weight:800}
.profit{text-align:center;margin:10px;opacity:0.8;font-size:13px}
.center{flex:1;display:flex;align-items:center;justify-content:center;position:relative}
.coin-wrapper{
  width:310px;height:310px;
  border-radius:50%;
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle,rgba(245,213,72,0.25) 0%,transparent 70%);
  box-shadow:0 0 80px rgba(245,213,72,0.4);
  border:3px solid #f5d548;
}
.coin{
  width:100%;height:100%;
  object-fit:cover;
  display:block;
}
.coin:active{transform:scale(0.93)}
.energy{padding:10px 16px;display:flex;justify-content:space-between}
.energy-bar{height:8px;background:#1e1c3a;margin:6px 16px;border-radius:10px;overflow:hidden}
.energy-fill{height:100%;background:linear-gradient(90deg,#f5d548,#ffaa00);width:100%}
.nav{display:flex;justify-content:space-around;background:#13111f;padding:10px 0;border-top:1px solid #24224a}
.nav-item{opacity:0.5;font-size:11px;text-align:center}
.nav-item.active{opacity:1;color:#f5d548}
.tap-effect{position:absolute;color:#f5d548;font-weight:800;font-size:30px;animation:up 0.8s forwards;pointer-events:none}
@keyframes up{to{transform:translateY(-130px);opacity:0}}
</style>
</head>
<body>
<div id="app">
<div class="header"><div>Level 1 • Harold Beginner</div><div>⚙️</div></div>
<div class="balance-row"><div class="balance" id="balance">0</div></div>
<div class="profit">💰 Profit per hour +1,000</div>
<div class="center" id="coinContainer">
<div class="coin-wrapper">
<img src="./coin.png" class="coin" id="coin">
</div>
</div>
<div class="energy"><div>⚡ <span id="energy">1500</span>/1500</div><div>Boost</div></div>
<div class="energy-bar"><div class="energy-fill" id="fill"></div></div>
<div class="nav">
<div class="nav-item active">🪙<br>Exchange</div>
<div class="nav-item">⛏️<br>Mine</div>
<div class="nav-item">👥<br>Frens</div>
<div class="nav-item">💰<br>Earn</div>
<div class="nav-item">🏆<br>Tops</div>
</div>
</div>
<script>
const tg=Telegram.WebApp; tg.expand();
let bal=parseInt(localStorage.getItem('harold_bal')||'2872');
let en=1500;
const balEl=document.getElementById('balance');
const enEl=document.getElementById('energy');
const fill=document.getElementById('fill');
const container=document.getElementById('coinContainer');
const coin=document.getElementById('coin');
function upd(){balEl.textContent=bal.toLocaleString('fr-FR');enEl.textContent=en;fill.style.width=en/1500*100+'%';localStorage.setItem('harold_bal',bal);}
function showEffect(x,y){const d=document.createElement('div');d.className='tap-effect';d.textContent='+2';d.style.left=x+'px';d.style.top=y+'px';container.appendChild(d);setTimeout(()=>d.remove(),800);}
function tap(e){e.preventDefault();if(en<=0)return;const t=e.touches?e.touches[0]:e;bal+=2;en-=1;showEffect(t.clientX,t.clientY);if(navigator.vibrate)navigator.vibrate(20);upd();}
coin.addEventListener('touchstart',tap,{passive:false});
coin.addEventListener('mousedown',tap);
setInterval(()=>{if(en<1500){en+=2;if(en>1500)en=1500;upd();}},1000);
upd();
</script>
</body>
</html>
