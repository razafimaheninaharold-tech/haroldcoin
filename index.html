<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Haroldcoin - Étape 2</title>
    <style>
        body {
            margin: 0;
            background-color: #1a103c;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        .header {
            margin-top: 30px;
            text-align: center;
            width: 100%;
        }
        .username {
            font-size: 16px;
            color: #a29bfe;
            font-weight: bold;
        }
        .score-container {
            font-size: 48px;
            font-weight: 900;
            color: #f1c40f;
            text-shadow: 0 0 15px rgba(241, 196, 15, 0.5);
            margin-top: 5px;
        }
        .coin-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            width: 100%;
        }
        .coin-btn {
            width: 270px;
            height: 270px;
            aspect-ratio: 1 / 1;
            cursor: pointer;
            transition: transform 0.05s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
            border-radius: 50%;
            border: 5px solid #f1c40f;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(241, 196, 15, 0.4);
            box-sizing: border-box;
            background-color: #0b061d;
            padding: 0;
        }
        .coin-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            pointer-events: none;
        }
        .coin-btn:active {
            transform: scale(0.92);
        }
        .game-status {
            width: 85%;
            margin-bottom: 40px;
        }
        .energy-text {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .energy-bar-bg {
            width: 100%;
            height: 14px;
            background-color: #2d1f5d;
            border-radius: 10px;
            overflow: hidden;
        }
        .energy-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #f1c40f, #e67e22);
            border-radius: 10px;
            transition: width 0.1s ease;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="username">⭐ Harold Trader</div>
        <div class="score-container" id="totalScore">0</div>
    </div>

    <div class="coin-container">
        <button class="coin-btn" id="clickArea">
            <img src="téléchargement (63) (1) (2) (1) (2) (1).jpeg" alt="Logo">
        </button>
    </div>

    <div class="game-status">
        <div class="energy-text">🟡 <span id="energyText">1000/1000</span></div>
        <div class="energy-bar-bg">
            <div class="energy-bar-fill" id="energyFill"></div>
        </div>
    </div>

    <script>
        let score = 0;
        let energy = 1000;
        const maxEnergy = 1000;

        const scoreDisplay = document.getElementById('totalScore');
        const energyText = document.getElementById('energyText');
        const energyFill = document.getElementById('energyFill');
        const clickArea = document.getElementById('clickArea');

        // Utilisation de la fonction onclick ultra-robuste qui fonctionne chez vous
        clickArea.onclick = function() {
            if (energy > 0) {
                score = score + 14;
                energy = energy - 1;
                
                scoreDisplay.innerText = score.toLocaleString();
                energyText.innerText = energy + "/1000";
                energyFill.style.width = (energy / maxEnergy * 100) + "%";
            }
        };

        // Recharge automatique de l'énergie (+1 par seconde)
        setInterval(function() {
            if (energy < maxEnergy) {
                energy = energy + 1;
                energyText.innerText = energy + "/1000";
                energyFill.style.width = (energy / maxEnergy * 100) + "%";
            }
        }, 1000);
    </script>
</body>
</html>
