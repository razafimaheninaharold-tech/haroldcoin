<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Haroldcoin - Étape Finale</title>
    <style>
        body {
            margin: 0;
            background-color: #1a103c;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        .header {
            margin-top: 30px;
            text-align: center;
            width: 100%;
            position: relative;
        }
        .username {
            font-size: 16px;
            color: #a29bfe;
            font-weight: bold;
        }
        .score-container {
            font-size: 48px;
            font-weight: 900;
            color: #f1c40f;
            margin-top: 5px;
        }
        .event-btn {
            position: absolute;
            top: 0;
            right: 20px;
            background-color: #251752;
            border: 2px solid #f1c40f;
            color: #f1c40f;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .coin-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            width: 100%;
        }
        .coin-btn {
            width: 260px;
            height: 260px;
            cursor: pointer;
            transition: transform 0.05s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
            border-radius: 50%;
            border: 5px solid #f1c40f;
            overflow: hidden;
            background-color: #0b061d;
            padding: 0;
        }
        .coin-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }
        .coin-btn:active {
            transform: scale(0.92);
        }
        .game-status {
            width: 85%;
            margin-bottom: 40px;
        }
        .energy-text {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .energy-bar-bg {
            width: 100%;
            height: 14px;
            background-color: #2d1f5d;
            border-radius: 10px;
            overflow: hidden;
        }
        .energy-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #f1c40f, #e67e22);
            border-radius: 10px;
        }
        
        /* Fenêtre Pop-up renforcée */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(11, 6, 29, 0.95);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .modal-content {
            background-color: #251752;
            border: 2px solid #f1c40f;
            width: 85%;
            border-radius: 20px;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .modal-title {
            font-size: 20px;
            font-weight: bold;
            color: #f1c40f;
        }
        .close-btn {
            font-size: 24px;
            cursor: pointer;
            color: #b2bec3;
            padding: 5px 10px;
        }
        .card {
            background-color: #1a103c;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
        }
        .card-title {
            font-weight: bold;
            color: #f1c40f;
            margin-bottom: 8px;
        }
        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            padding: 4px 0;
        }
        .lottery-btn {
            width: 100%;
            background: linear-gradient(90deg, #f1c40f, #e67e22);
            border: none;
            color: white;
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="username">⭐ Harold Trader</div>
        <div class="score-container" id="totalScore">0</div>
        <button class="event-btn" id="openMenuBtn">🎁 Gains</button>
    </div>

    <div class="coin-container">
        <button class="coin-btn" id="clickArea">
            <img src="téléchargement (63) (1) (2) (1) (2) (1).jpeg" alt="Logo">
        </button>
    </div>

    <div class="game-status">
        <div class="energy-text">🟡 <span id="energyText">1000/1000</span></div>
        <div class="energy-bar-bg">
            <div class="energy-bar-fill" id="energyFill"></div>
        </div>
    </div>

    <!-- LA BOÎTE POP-UP -->
    <div class="modal" id="eventModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">🏆 Zone de Cashprize</div>
                <div class="close-btn" id="closeMenuBtn">✕</div>
            </div>

            <div class="card">
                <div class="card-title">🥇 Tournoi Hebdo (20$)</div>
                <div class="leaderboard-item" style="color:#f1c40f;"><span>1. 👑 Joueur_9843</span><span>450k HRC</span></div>
                <div class="leaderboard-item"><span>2. 🥈 CryptoKing</span><span>320k HRC</span></div>
                <div class="leaderboard-item"><span>3. 🥉 Razaf_Tech</span><span>210k HRC</span></div>
                <div class="leaderboard-item" style="color:#a29bfe; font-weight:bold; margin-top:4px;">
                    <span>Vous :</span><span id="yourRankScore">0 HRC</span>
                </div>
            </div>

            <div class="card">
                <div class="card-title">🎟️ Grand Tirage (20$)</div>
                <button class="lottery-btn" id="buyTicketBtn">Acheter 1 Ticket (500 HRC)</button>
                <div style="font-size: 12px; color: #a29bfe; text-align: center; margin-top: 6px;" id="ticketDisplay">Vos tickets : 0 🎟️</div>
            </div>
        </div>
    </div>

    <script>
        let score = 0;
        let energy = 1000;
        const maxEnergy = 1000;
        let myTickets = 0;

        const scoreDisplay = document.getElementById('totalScore');
        const yourRankScore = document.getElementById('yourRankScore');
        const energyText = document.getElementById('energyText');
        const energyFill = document.getElementById('energyFill');
        const clickArea = document.getElementById('clickArea');

        const modal = document.getElementById('eventModal');
        const openMenuBtn = document.getElementById('openMenuBtn');
        const closeMenuBtn = document.getElementById('closeMenuBtn');
        const buyTicketBtn = document.getElementById('buyTicketBtn');
        const ticketDisplay = document.getElementById('ticketDisplay');

        // CLIC PIÈCE
        clickArea.onclick = function() {
            if (energy > 0) {
                score = score + 14;
                energy = energy - 1;
                scoreDisplay.innerText = score.toLocaleString();
                yourRankScore.innerText = score.toLocaleString() + " HRC";
                energyText.innerText = energy + "/1000";
                energyFill.style.width = (energy / maxEnergy * 100) + "%";
            }
        };

        // COMMANDES DIRECTES POUR LA BOÎTE POP-UP
        openMenuBtn.onclick = function() {
            modal.style.display = 'flex';
        };

        closeMenuBtn.onclick = function() {
            modal.style.display = 'none';
        };

        // ACHAT TICKET
        buyTicketBtn.onclick = function() {
            if (score >= 500) {
                score = score - 500;
                myTickets = myTickets + 1;
                scoreDisplay.innerText = score.toLocaleString();
                yourRankScore.innerText = score.toLocaleString() + " HRC";
                ticketDisplay.innerText = "Vos tickets : " + myTickets + " 🎟️";
                alert("🎟️ Ticket acheté ! Bonne chance.");
            } else {
                alert("❌ Solde insuffisant ! (Il faut 500 HRC)");
            }
        };

        // ENERGIE
        setInterval(function() {
            if (energy < maxEnergy) {
                energy = energy + 1;
                energyText.innerText = energy + "/1000";
                energyFill.style.width = (energy / maxEnergy * 100) + "%";
            }
        }, 1000);
    </script>
</body>
</html>
