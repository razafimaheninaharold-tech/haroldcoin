<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Haroldcoin</title>
    <!-- SDK Telegram Officiel -->
    <script src="https://telegram.org"></script>
    <!-- Script de connexion à votre Base de Données Supabase (Version Cloud ultra-compatible) -->
    <script src="https://unpkg.com"></script>
    <style>
        :root {
            --bg-color: #050312;
            --surface-blur: rgba(255, 255, 255, 0.05);
            --accent-gold: #ffd700;
            --text-main: #ffffff;
            --text-muted: #8a91a5;
        }

        body {
            background-color: var(--bg-color); 
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* Zone d'affichage du score */
        .score-container {
            text-align: center;
            margin-top: 10px;
        }

        .score-value {
            font-size: 44px;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
            letter-spacing: 1px;
        }

        .status-sync {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 6px;
            font-weight: 500;
        }

        /* Zone centrale de jeu */
        .game-zone {
            position: relative;
            width: 230px;
            height: 230px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Halo lumineux jaune autour du cercle */
        .coin-glow {
            position: absolute;
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.25) 0%, rgba(255, 215, 0, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
        }

        /* Le bouton contenant votre logo Harold Coins parfait */
        .main-coin-btn {
            position: relative;
            z-index: 2;
            width: 210px;
            height: 210px;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            outline: none;
            touch-action: manipulation;
            transition: transform 0.05s ease;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7);
            
            background: url('coin.png') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        .main-coin-btn:active {
            transform: scale(0.94) translateY(2px);
        }

        /* Chiffre +1 flottant au clic */
        .floating-click {
            position: absolute;
            color: #ffffff;
            font-size: 32px;
            font-weight: 800;
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 3px 6px rgba(0, 0, 0, 0.8);
            animation: moveUpFade 0.5s ease-out forwards;
        }

        @keyframes moveUpFade {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-80px) scale(0.85); opacity: 0; }
        }

        /* Menu inférieur Notcoin */
        .bottom-nav {
            width: 100%;
            max-width: 380px;
            background: var(--surface-blur);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 16px;
            display: flex;
            justify-content: space-around;
            padding: 12px 4px;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 5px;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            opacity: 0.8;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-item:active {
            transform: scale(0.92);
            opacity: 1;
        }

        .nav-icon {
            font-size: 20px;
            margin-bottom: 2px;
        }

        /* Fenêtres surgissantes (Modales) */
        .game-modal {
            display: none;
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: #110d29;
            border-top: 2px solid var(--accent-gold);
            border-radius: 24px 24px 0 0;
            padding: 24px;
            z-index: 100;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.9);
            animation: slideUp 0.25s ease-out;
            max-height: 70vh;
            overflow-y: auto;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
        }

        .close-btn {
            background: none; border: none; color: #ff4a4a;
            font-size: 26px; font-weight: bold; cursor: pointer;
        }

        .item-card {
            background: rgba(255,255,255,0.04);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 12px;
        }

        .card-info-title {
            font-size: 15px; font-weight: 700; margin-bottom: 4px; color: #ffffff;
        }

        .card-info-desc {
            font-size: 12px; color: var(--text-muted);
        }

        .action-card-btn {
            background: var(--accent-gold);
            color: #000000;
            border: none; padding: 10px 14px;
            border-radius: 10px; font-weight: 700;
            cursor: pointer;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="score-container">
        <div class="score-value" id="scoreDisplay">0</div>
        <div class="status-sync" id="syncStatus">Nuage synchronisé ☁️</div>
    </div>

    <div class="game-zone" id="gameZone">
        <div class="coin-glow"></div>
        <button class="main-coin-btn" id="coinBtn"></button>
    </div>

    <div class="bottom-nav">
        <button class="nav-item" onclick="openModal('modalFrens')">
            <span class="nav-icon">🎁</span>
            <span>Frens</span>
        </button>
        <button class="nav-item" onclick="openModal('modalEarn')">
            <span class="nav-icon">🪙</span>
            <span>Earn</span>
        </button>
        <button class="nav-item" onclick="openModal('modalBoosts')">
            <span class="nav-icon">🚀</span>
            <span>Boosts</span>
        </button>
    </div>

    <!-- Fenêtre Frens -->
    <div class="game-modal" id="modalFrens">
        <div class="modal-header">
            <div class="modal-title">🎁 Inviter des Amis</div>
            <button class="close-btn" onclick="closeModal('modalFrens')">×</button>
        </div>
        <div class="item-card">
            <div>
                <div class="card-info-title">Lien de parrainage</div>
                <div class="card-info-desc">Gagnez +1,000 pièces par invité</div>
            </div>
            <button class="action-card-btn" onclick="copyInviteLink()">Partager</button>
        </div>
    </div>

    <!-- Fenêtre Earn -->
    <div class="game-modal" id="modalEarn">
        <div class="modal-header">
            <div class="modal-title">🪙 Tâches et Communauté</div>
            <button class="close-btn" onclick="closeModal('modalEarn')">×</button>
        </div>
        <div class="item-card">
            <div>
                <div class="card-info-title">Rejoindre notre Canal</div>
                <div class="card-info-desc">Récompense : +5,000 🪙</div>
            </div>
            <button class="action-card-btn" onclick="claimTask(5000)">Rejoindre</button>
        </div>
    </div>

    <!-- Fenêtre Boosts -->
    <div class="game-modal" id="modalBoosts">
        <div class="modal-header">
            <div class="modal-title">🚀 Améliorations</div>
            <button class="close-btn" onclick="closeModal('modalBoosts')">×</button>
        </div>
        <div class="item-card">
            <div>
                <div class="card-info-title">Multitap</div>
                <div class="card-info-desc">Donne (<span id="clickValueTxt">+1</span>) par tap</div>
            </div>
            <button class="action-card-btn" id="buyBoostBtn" onclick="buyMultitap()">Acheter (100 🪙)</button>
        </div>
    </div>

        tg.expand();
        tg.ready();

        const SUPABASE_URL = "https://supabase.co";
        const SUPABASE_KEY = "sb_publishable_vn5kPYncLS3TtBS75hSFew_LjeISc47";
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
