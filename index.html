<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Haroldcoin - Version Logo Original</title>
    <!-- SDK Telegram Officiel -->
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(180deg, #0f0a2a 0%, #050312 100%);
            --accent-gold: #ffd700;
            --coin-secondary: #f3ba2f;
            --text-main: #ffffff;
            --text-muted: #8a91a5;
            --surface-blur: rgba(255, 255, 255, 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* En-tête Statut */
        .top-banner {
            width: 100%;
            max-width: 380px;
            background: rgba(22, 17, 49, 0.8);
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 14px;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
        }

        .banner-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .wallet-icon {
            width: 36px;
            height: 36px;
            background: #2481cc;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .banner-text-title {
            font-size: 13px;
            font-weight: 600;
        }

        .banner-text-value {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 1px;
        }

        .league-badge-top {
            background: rgba(255, 215, 0, 0.1);
            color: var(--accent-gold);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        /* Zone du Score global */
        .score-section {
            text-align: center;
        }

        .score-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .mini-coin {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, var(--accent-gold), var(--coin-secondary));
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
        }

        .main-score {
            font-size: 42px;
            font-weight: 800;
        }

        .league-navigation {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            margin-top: 4px;
            font-size: 12px;
            color: var(--text-muted);
            cursor: pointer;
        }

        /* Zone Centrale : Intégration de votre logo rond d'origine */
        .game-zone {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .coin-glow {
            position: absolute;
            width: 240px;
            height: 240px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.25) 0%, rgba(255, 215, 0, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .main-coin-btn {
            position: relative;
            z-index: 2;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            outline: none;
            touch-action: manipulation;
            transition: transform 0.05s ease;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
            
            /* ICI : Chargement de votre logo rond d'origine (coin.png) */
        background: url('https://ibb.co') center/cover no-repeat;
                
        }

        .main-coin-btn:active {
            transform: scale(0.94) translateY(2px);
        }

        /* Effet +1 flottant au clic */
        .floating-click {
            position: absolute;
            color: #ffffff;
            font-size: 28px;
            font-weight: 800;
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 3px 6px rgba(0, 0, 0, 0.8);
            animation: moveUpFade 0.5s ease-out forwards;
        }

        @keyframes moveUpFade {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-70px) scale(0.85); opacity: 0; }
        }

        /* Barre d'énergie */
        .energy-section {
            width: 100%;
            max-width: 380px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 4px;
            box-sizing: border-box;
        }

        .energy-icon-text {
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
        }

        .energy-progress-bg {
            flex-grow: 1;
            height: 10px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
        }

        .energy-progress-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff9900, #ffd700);
            border-radius: 10px;
            transition: width 0.1s ease;
        }

        /* Menu de navigation inférieur */
        .bottom-nav {
            width: 100%;
            max-width: 380px;
            background: var(--surface-blur);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 16px;
            display: flex;
            justify-content: space-around;
            padding: 12px 4px;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 5px;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            opacity: 0.8;
        }

        .nav-item:active {
            transform: scale(0.92);
        }

        .nav-icon {
            font-size: 20px;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <!-- En-tête -->
    <div class="top-banner">
        <div class="banner-left">
            <div class="wallet-icon">👛</div>
            <div>
                <div class="banner-text-title">Harold Wallet</div>
                <div class="banner-text-value">Connecté</div>
            </div>
        </div>
        <div class="league-badge-top">💎 Diamond</div>
    </div>

    <!-- Points et Ligue -->
    <div class="score-section">
        <div class="score-row">
            <div class="mini-coin"></div>
            <div class="main-score" id="scoreDisplay">0</div>
        </div>
        <div class="league-navigation" onclick="openLeague()">
            <span>🏆 Ligue Silver</span>
            <span>›</span>
        </div>
    </div>

    <!-- Zone de clic avec Halo et Logo -->
    <div class="game-zone" id="gameZone">
        <div class="coin-glow"></div>
        <button class="main-coin-btn" id="coinBtn"></button>
    </div>

    <!-- Section Énergie -->
    <div class="energy-section">
        <div class="energy-icon-text">⚡ <span id="energyText">1000</span></div>
        <div class="energy-progress-bg">
            <div class="energy-progress-fill" id="energyBar"></div>
        </div>
    </div>

    <!-- Menu Inférieur -->
    <div class="bottom-nav">
        <button class="nav-item" onclick="navigate('frens')">
            <span class="nav-icon">🎁</span>
            <span>Frens</span>
        </button>
        <button class="nav-item" onclick="navigate('earn')">
            <span class="nav-icon">🪙</span>
            <span>Earn</span>
        </button>
        <button class="nav-item" onclick="navigate('boosts')">
            <span class="nav-icon">🚀</span>
            <span>Boosts</span>
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        let score = parseInt(localStorage.getItem('h_final_score')) || 0;
        let energy = parseInt(localStorage.getItem('h_final_energy')) || 1000;
        const maxEnergy = 1000;
        const clickValue = 1;

        const scoreDisplay = document.getElementById('scoreDisplay');
        const energyText = document.getElementById('energyText');
        const energyBar = document.getElementById('energyBar');
        const coinBtn = document.getElementById('coinBtn');
        const gameZone = document.getElementById('gameZone');

        function updateGameUI() {
            scoreDisplay.innerText = score.toLocaleString('en-US'); 
            energyText.innerText = energy;
            energyBar.style.width = `${(energy / maxEnergy) * 100}%`;
        }
