<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Haroldcoin MAX 1000</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;display:flex;justify-content:center}
.app{width:100%;max-width:400px;height:100vh;background:#000 url('bg.jpg') center/cover no-repeat;position:relative;overflow:hidden}
.content{position:relative;z-index:2;height:100vh;display:flex;flex-direction:column;padding:6px 8px 90px;overflow-x:hidden}
.top{display:flex;justify-content:space-between;align-items:center;background:rgba(5,15,25,0.75);border:1px solid rgba(0,229,255,0.15);border-radius:12px;padding:8px 10px}
.name{font-family:'Orbitron';font-size:20px;font-weight:900;color:#fff}
.lvl{background:rgba(0,0,0,0.6);border:1px solid #00e5ff;color:#00e5ff;padding:2px 8px;border-radius:8px;font-size:10px;font-weight:900}
.wallet{background:rgba(0,0,0,0.6);border:1.5px solid transparent;background:linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)) padding-box, linear-gradient(90deg,#00e5ff,#ffbb66) border-box;color:#fff;padding:6px 10px;border-radius:16px;font-size:10px;font-weight:600}
.assets-wrap{margin-top:10px;display:flex;justify-content:space-between;gap:8px}
.assets-pill{background:linear-gradient(90deg,#d4af37,#ffec8b,#d4af37);border-radius:18px;padding:6px 12px;flex:1;display:flex;align-items:center;gap:6px}
.assets-pill:before{content:'🪙';font-size:16px}
.assets-value{font-family:'Inter';font-size:12px;font-weight:900;color:#000;line-height:1.2}
.mining-plus{background:rgba(0,0,0,0.7);border:1.5px solid #00ff88;border-radius:16px;padding:6px 10px;flex:1}
.mining-plus .m-label{font-size:8px;color:#fff}
.mining-plus b{font-size:12px;color:#00ff88}
.center{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;margin-top:14px}
.coin-wrap{position:relative;width:120px;height:120px;display:flex;align-items:center;justify-content:center}
.mining-circle{position:absolute;width:120px;height:120px;transform:rotate(-90deg)}
.mining-circle circle{fill:none;stroke-linecap:round}
.track{stroke:rgba(255,215,0,0.15);stroke-width:5}
.progress{stroke:#FFD700;stroke-width:5;stroke-dasharray:220;stroke-dashoffset:220;transition:stroke-dashoffset 0.5s}
.coin{width:92px;height:92px;border-radius:50%;clip-path:circle(34% at 50% 50%);filter:brightness(1.3) drop-shadow(0 0 16px #d4af37)}
.power-bar{margin-top:18px;width:100%;height:36px;background:rgba(0,0,0,0.88);border:1.5px solid rgba(0,229,255,0.35);border-radius:20px;display:flex;align-items:center;padding:3px 6px 3px 46px;position:relative}
.power-fill{height:12px;background:linear-gradient(90deg,#00e5ff,#ffaa55);border-radius:12px;width:0%;transition:width 0.5s}
.power-icon{position:absolute;left:-1px;top:50%;transform:translateY(-50%);width:42px;height:36px;background:linear-gradient(135deg,#00e5ff,#ff8c00);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px}
.claim{margin-top:16px;width:100%;height:52px;border:2px solid transparent;border-radius:26px;background:linear-gradient(#0a0a14,#0a0a14) padding-box, linear-gradient(90deg,#00e5ff,#ffbb66) border-box;color:#fff;font-family:'Orbitron';font-weight:900;font-size:19px;letter-spacing:2px;cursor:pointer}
.bottom{position:absolute;bottom:0;left:0;right:0;height:86px;background:rgba(5,10,20,0.98);border-top:1px solid rgba(212,175,55,0.2);display:flex;justify-content:space-between;padding:8px 6px;gap:6px;border-radius:18px 18px 0 0;z-index:999}
.nav{flex:1;height:62px;background:linear-gradient(145deg,#1e2535,#151a28);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#6b7280;font-size:10px;font-weight:700;cursor:pointer}
.nav.active{background:linear-gradient(145deg,#2a2215,#1f1a0f);border:1.5px solid #ffd700;color:#ffd700}
.nav b{font-size:20px}
.page{display:none;flex:1;overflow-y:auto}.page.active{display:flex;flex-direction:column}
.miners-head{position:sticky;top:0;background:rgba(0,0,0,0.9);padding:6px;z-index:5;border-radius:10px;margin-bottom:10px}
.miners-title{font-family:'Cinzel';font-size:18px;color:#fff;font-weight:900}
.miners-sub{font-size:11px;color:#aaa;margin-top:3px}
.miner-card{background:linear-gradient(135deg,rgba(22,22,22,0.98),rgba(0,0,0,0.99));border:1.2px solid rgba(212,175,55,0.28);border-radius:13px;padding:10px 11px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.miner-icon{width:42px;height:42px;background:#111;border:1px solid #333;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.miner-info{flex:1}.miner-lvl{font-size:10px;color:#888;font-weight:800}.miner-price{font-size:16px;color:#00ff88;font-weight:900}.miner-hold{font-size:9px;color:#666}.miner-speed{font-size:10px;color:#d4af37;font-weight:700}
.miner-btn{padding:7px 10px;border-radius:8px;border:none;font-weight:900;font-size:10px;min-width:75px;cursor:pointer}
.btn-active{background:linear-gradient(#fff9c4,#d4af37);color:#000}.btn-need{background:linear-gradient(#ffeda0,#ffaa00);color:#000}.btn-locked{background:#222;color:#666;border:1px solid #333}.btn-max{background:linear-gradient(#ffd700,#ff8c00);color:#000}
</style>
</head>
<body>
<div class="app">
<div class="content">
<div class="top"><div style="display:flex;align-items:center;gap:4px"><div class="name">HAROLD</div><div class="lvl" id="lvlDisplay">Lvl ...</div></div><div class="wallet">Connect Wallet</div></div>
<div class="page active" id="page-mine">
<div class="assets-wrap">
<div class="assets-pill"><div class="assets-value" id="assetsValue">Chargement...</div></div>
<div class="mining-plus"><div class="m-label">Mining</div><b id="miningPlus">+0.0000 HRD</b></div>
</div>
<div class="center">
<div class="coin-wrap">
<svg class="mining-circle" viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="35"></circle><circle class="progress" id="progressCircle" cx="60" cy="60" r="35"></circle></svg>
<img class="coin" src="coin.png">
</div>
<div class="power-bar"><div class="power-icon">⚡</div><div class="power-fill" id="powerFill"></div></div>
<button class="claim" id="claimBtn">CLAIM</button>
</div>
</div>
<div class="page" id="page-miners"><div class="miners-head"><div class="miners-title">MINERS • 1000 MAX</div><div class="miners-sub" id="minersSub">Chargement...</div></div><div id="minersList"></div></div>
<div class="page" id="page-tasks"><div class="miners-title">TASKS</div><div style="color:#666;text-align:center;margin-top:50px">Bientôt...</div></div>
<div class="page" id="page-friends"><div class="miners-title">FRIENDS</div><div style="color:#666;text-align:center;margin-top:50px">Bientôt...</div></div>
</div>
<div class="bottom">
<div class="nav active" data-page="mine"><b>⛏️</b>Mine</div>
<div class="nav" data-page="tasks"><b>☰</b>Tasks</div>
<div class="nav" data-page="miners"><b>🤖</b>Miners</div>
<div class="nav" data-page="friends"><b>👥</b>Friends</div>
</div>
</div>
<script>
function showPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  document.querySelectorAll('.nav').forEach(n=>n.classList.remove('active'));
  document.querySelector(`.nav[data-page="${name}"]`).classList.add('active');
}
document.querySelectorAll('.nav').forEach(nav=>{nav.addEventListener('click',()=>showPage(nav.dataset.page));});

const SUPA_URL="https://kgmatxqbdyusxpiuavbw.supabase.co";
const SUPA_KEY="sb_publishable_vn5kPYncLS3TtBS75hSFew_LjeISc47";
const supa=supabase.createClient(SUPA_URL,SUPA_KEY);
let tg=window.Telegram?.WebApp;
let uid=tg?.initDataUnsafe?.user?.id+""||localStorage.getItem('uid')||'12345';
localStorage.setItem('uid',uid);

let balanceCoins=0;
let balanceHRD=0;
let mining=0;
let progress=0;
let currentLvl=1;
let loaded=false;

const circle=document.getElementById('progressCircle');
const assetsValue=document.getElementById('assetsValue');
const miningPlus=document.getElementById('miningPlus');
const powerFill=document.getElementById('powerFill');
const btn=document.getElementById('claimBtn');
const circ=2*Math.PI*35;
circle.style.strokeDasharray=circ;
circle.style.strokeDashoffset=circ;

function updateUI(){
  if(balanceCoins>0){
    assetsValue.innerHTML=balanceCoins.toLocaleString()+" coins<br><span style='font-size:10px;opacity:0.8'>"+balanceHRD.toFixed(4).replace('.',',')+" HRD</span>";
  }else{
    assetsValue.innerHTML="0 coins<br><span style='font-size:10px'>0,0000 HRD</span>";
  }
  miningPlus.textContent="+"+mining.toFixed(4)+" HRD";
  powerFill.style.width=progress+"%";
  circle.style.strokeDashoffset=circ-(circ*progress/100);
  btn.textContent=progress>=100?"CLAIM READY":"CLAIM";
  document.getElementById('lvlDisplay').textContent="Lvl "+currentLvl;
  document.getElementById('minersSub').textContent="LVL "+currentLvl+"/1000 • "+balanceCoins.toLocaleString()+" coins";
}

async function loadBalance(){
  try{
    let {data}=await supa.from('harold_users').select('balance').eq('id',parseInt(uid)).single();
    if(data && data.balance){
      balanceCoins=data.balance;
      balanceHRD=balanceCoins/1000000;
      if(balanceCoins<=161600){
        currentLvl=Math.floor((balanceCoins-8000)/800)+8;
        if(currentLvl<1) currentLvl=1;
      }else{
        currentLvl=200+Math.floor((balanceCoins-161600)/1100);
      }
      if(currentLvl>1000) currentLvl=1000;
    }
    loaded=true;
    updateUI();
    renderMiners();
    saveBalance();
  }catch(e){
    loaded=true;
    updateUI();
    renderMiners();
  }
}

async function saveBalance(){
  if(!loaded) return;
  try{
    await supa.from('harold_users').upsert({id:parseInt(uid),balance:balanceCoins,last_seen:new Date().toISOString()},{onConflict:'id'});
  }catch(e){}
}

let iv=setInterval(()=>{if(progress<100){progress+=0.6;mining+=0.00003;updateUI();}else{clearInterval(iv);updateUI();}},100);

btn.addEventListener('click',()=>{
  if(progress>=100){
    balanceHRD+=mining;
    balanceCoins=Math.floor(balanceHRD*1000000);
    mining=0;
    progress=0;
    if(balanceCoins<=161600){
      let nl=Math.floor((balanceCoins-8000)/800)+8;
      if(nl>currentLvl) currentLvl=nl;
    }else{
      let nl=200+Math.floor((balanceCoins-161600)/1100);
      if(nl>currentLvl) currentLvl=nl;
    }
    if(currentLvl>1000) currentLvl=1000;
    updateUI();
    renderMiners();
    saveBalance();
    iv=setInterval(()=>{if(progress<100){progress+=0.6;mining+=0.00003;updateUI();}else{clearInterval(iv);updateUI();}},100);
  }
});

function getMinerData(lvl){
  let price,hrd,hold,speed;
  if(lvl===1) return {price:'0$',hrd:0,hold:0,speed:0.20};
  if(lvl===2) return {price:'0.317$',hrd:317,hold:1000,speed:0.21};
  if(lvl<=200){
    price=(0.42+(lvl-8)*0.015).toFixed(3)+'$';
    hrd=4200+(lvl-8)*120;
    hold=8000+(lvl-8)*800;
    speed=(0.20+(lvl-1)*0.015).toFixed(2);
    return {price,hrd,hold,speed:parseFloat(speed)};
  }else{
    let extra=lvl-200;
    price=(3.30+extra*0.02).toFixed(3)+'$';
    hrd=27250+extra*120;
    hold=161600+extra*1100;
    speed=(3.19+extra*0.02).toFixed(2);
    return {price,hrd,hold,speed:parseFloat(speed)};
  }
}

function renderMiners(){
  const list=document.getElementById('minersList');
  let html='';
  for(let lvl=1;lvl<=1000;lvl++){
    let data=getMinerData(lvl);
    let btnClass,btnText;
    if(lvl<currentLvl){btnClass='btn-active';btnText='ACTIVE';}
    else if(lvl===currentLvl){btnClass='btn-max';btnText='ACTUEL';}
    else if(balanceCoins>=data.hold){btnClass='btn-need';btnText='MONTER LVL '+lvl;}
    else {btnClass='btn-locked';btnText='NEED '+data.hold.toLocaleString();}
    let icon=lvl>=1000?'🔥':lvl>=500?'💎':lvl>=200?'👑':'🔧';
    let highlight=lvl===currentLvl?'border:2px solid #ffd700;box-shadow:0 0 16px rgba(255,215,0,0.5)':'';
    html+='<div class="miner-card" style="'+highlight+'"><div class="miner-icon">'+icon+'</div><div class="miner-info"><div class="miner-lvl">LVL '+lvl+'</div><div class="miner-price">'+data.price+'</div><div class="miner-hold">'+data.hrd+' HRD • HOLD '+data.hold.toLocaleString()+' coins</div><div class="miner-speed">⚡ '+data.speed+' TH/s</div></div><button class="miner-btn '+btnClass+'" onclick="buyLevel('+lvl+','+data.hold+')">'+btnText+'</button></div>';
  }
  list.innerHTML=html;
}

function buyLevel(lvl,hold){
  if(balanceCoins<hold) return;
  if(lvl<=currentLvl) return;
  currentLvl=lvl;
  updateUI();
  renderMiners();
  saveBalance();
}

loadBalance();
if(tg){tg.ready();tg.expand();}
setInterval(saveBalance,4000);
</script>
</body>
</html>
