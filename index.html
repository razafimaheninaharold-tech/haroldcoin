<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Haroldcoin - Base de données & Parrainage</title>
    <style>
        body {
            margin: 0;
            background-color: #1a103c;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        .header {
            margin-top: 30px;
            text-align: center;
            width: 100%;
            position: relative;
        }
        .username {
            font-size: 16px;
            color: #a29bfe;
            font-weight: bold;
        }
        .score-container {
            font-size: 48px;
            font-weight: 900;
            color: #f1c40f;
            margin-top: 5px;
        }
        .event-btn {
            position: absolute;
            top: 0;
            right: 20px;
            background-color: #251752;
            border: 2px solid #f1c40f;
            color: #f1c40f;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .ref-btn {
            position: absolute;
            top: 0;
            left: 20px;
            background-color: #251752;
            border: 2px solid #a29bfe;
            color: #a29bfe;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .coin-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            width: 100%;
        }
        .coin-btn {
            width: 260px;
            height: 260px;
            cursor: pointer;
            transition: transform 0.05s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
            border-radius: 50%;
            border: 5px solid #f1c40f;
            overflow: hidden;
            background-color: #0b061d;
            padding: 0;
        }
        .coin-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }
        .coin-btn:active {
            transform: scale(0.92);
        }
        .game-status {
            width: 85%;
            margin-bottom: 40px;
        }
        .energy-text {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .energy-bar-bg {
            width: 100%;
            height: 14px;
            background-color: #2d1f5d;
            border-radius: 10px;
            overflow: hidden;
        }
        .energy-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #f1c40f, #e67e22);
            border-radius: 10px;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(11, 6, 29, 0.95);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .modal-content {
            background-color: #251752;
            border: 2px solid #f1c40f;
            width: 85%;
            border-radius: 20px;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .modal-title {
            font-size: 20px;
            font-weight: bold;
            color: #f1c40f;
        }
        .close-btn {
            font-size: 24px;
            cursor: pointer;
            color: #b2bec3;
            padding: 5px 10px;
        }
        .card {
            background-color: #1a103c;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
        }
        .card-title {
            font-weight: bold;
            color: #f1c40f;
            margin-bottom: 8px;
        }
        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            padding: 4px 0;
        }
        .lottery-btn {
            width: 100%;
            background: linear-gradient(90deg, #f1c40f, #e67e22);
            border: none;
            color: white;
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }
        .share-box {
            background-color: #1a103c;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            word-break: break-all;
            color: #a29bfe;
            margin-bottom: 10px;
            border: 1px dashed #a29bfe;
        }
    </style>
    
    <!-- Scripts officiels Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, increment } from "https://gstatic.com";

        // Votre configuration injectée au cœur du moteur du jeu
        const firebaseConfig = {
            apiKey: "AIzaSyB9Bo1B8Pxvc_szGMf_3TOxgOoMne0yV8w",
            authDomain: "haroldcoin-game.firebaseapp.com",
            projectId: "haroldcoin-game",
            storageBucket: "haroldcoin-game.firebasestorage.app",
            messagingSenderId: "508155963084",
            appId: "1:508155963084:web:26971d48cba0165e100469",
            measurementId: "G-9PKB9QLKWM"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Récupération automatique de l'identifiant Telegram du joueur
        let userId = "joueur_local";
        let userName = "⭐ Harold Trader";

        if (window.Telegram && window.Telegram.WebApp) {
            const tg = window.Telegram.WebApp;
            tg.ready();
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                userId = "tg_" + tg.initDataUnsafe.user.id;
                userName = tg.initDataUnsafe.user.username || tg.initDataUnsafe.user.first_name || "Harold Trader";
            }
        }

        // Système de gestion d'URL pour le parrainage
        const urlParams = new URLSearchParams(window.location.search);
        const referrerId = urlParams.get('ref');

        let score = 0;
        let energy = 1000;
        const maxEnergy = 1000;
        let myTickets = 0;

        window.addEventListener('DOMContentLoaded', async () => {
            const scoreDisplay = document.getElementById('totalScore');
            const yourRankScore = document.getElementById('yourRankScore');
            const energyText = document.getElementById('energyText');
            const energyFill = document.getElementById('energyFill');
            const clickArea = document.getElementById('clickArea');
            const refLinkBox = document.getElementById('refLinkBox');

            // Génération du lien de parrainage unique pour le joueur
            const myRefLink = "https://t.me" + userId;
            if(refLinkBox) refLinkBox.innerText = myRefLink;

            // Connexion et récupération des données du joueur dans Firebase
            const userDocRef = doc(db, "players", userId);
            const userDoc = await getDoc(userDocRef);

            if (!userDoc.exists()) {
                score = 0;
                await setDoc(userDocRef, { name: userName, score: 0, tickets: 0 });
                
                // Si l'utilisateur a été parrainé par un ami, on offre +5000 points au parrain
                if (referrerId && referrerId !== userId) {
                    const refDocRef = doc(db, "players", referrerId);
                    const refDoc = await getDoc(refDocRef);
                    if (refDoc.exists()) {
                        await updateDoc(refDocRef, { score: increment(5000) });
                    }
                }
            } else {
                const data = userDoc.data();
                score = data.score || 0;
                myTickets = data.tickets || 0;
            }

            scoreDisplay.innerText = score.toLocaleString();
            yourRankScore.innerText = score.toLocaleString() + " HRC";
            document.getElementById('ticketDisplay').innerText = "Vos tickets : " + myTickets + " 🎟️";

            // Clic sur la pièce synchrone avec Firebase
            clickArea.onclick = async function() {
                if (energy > 0) {
                    score = score + 14;
                    energy = energy - 1;
                    scoreDisplay.innerText = score.toLocaleString();
                    yourRankScore.innerText = score.toLocaleString() + " HRC";
                    energyText.innerText = energy + "/1000";
                    energyFill.style.width = (energy / maxEnergy * 100) + "%";

                    // Sauvegarde directe asynchrone pour éviter tout ralentissement tactile
                    updateDoc(userDocRef, { score: score });
                }
            };

            // Achat ticket lié à la base de données
            document.getElementById('buyTicketBtn').onclick = async function() {
                if (score >= 500) {
                    score = score - 500;
                    myTickets = myTickets + 1;
