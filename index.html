<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Haroldcoin</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;justify-content:center}
.app{width:100%;max-width:420px;height:100vh;background:#000 url('bg.jpg') center/cover;position:relative;overflow:hidden}
.content{position:relative;z-index:2;height:100vh;display:flex;flex-direction:column;padding:12px 14px 0}
.top{display:flex;justify-content:space-between}
.name{font-family:'Cinzel';font-size:34px;font-weight:900;color:#fff;text-shadow:0 0 20px #d4af37}
.lvl{margin-top:6px;background:linear-gradient(#fff9c4,#d4af37);color:#000;padding:5px 14px;border-radius:20px;font-size:13px;font-weight:900;display:inline-block}
.wallet{background:rgba(0,0,0,0.7);border:1.5px solid #d4af37;color:#fff;padding:10px 14px;border-radius:20px;font-size:12px;font-weight:700}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-top:-40px}
.coin-wrap{position:relative;width:260px;height:260px;display:flex;align-items:center;justify-content:center}
/* EFFET MAGNIFIQUE TRÈS VISIBLE */
.halo{position:absolute;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle, rgba(255,230,100,0.35) 0%, rgba(212,175,55,0.2) 30%, transparent 70%);box-shadow:0 0 80px rgba(212,175,55,0.5);animation:glow 2s ease-in-out infinite alternate}
@keyframes glow{0%{transform:scale(0.9);opacity:0.6}100%{transform:scale(1.15);opacity:1}}
.ring{position:absolute;width:240px;height:240px;border-radius:50%;border:2px solid rgba(212,175,55,0.8);border-top-color:transparent;border-bottom-color:transparent;box-shadow:0 0 20px #d4af37;animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.coin{width:210px;height:210px;position:relative;z-index:5;filter:drop-shadow(0 0 30px #d4af37)}
.bal{font-family:'Cinzel';font-size:52px;font-weight:900;color:#fff9c4;margin-top:15px;text-shadow:0 0 20px #d4af37}
.claim{margin-top:15px;width:92%;height:62px;border:none;border-radius:20px;background:linear-gradient(#ffffd0,#d4af37);color:#000;font-family:'Cinzel';font-weight:900;font-size:26px}
.bottom{position:absolute;bottom:0;left:0;right:0;height:70px;background:rgba(0,0,0,0.95);border-top:1px solid #d4af37;display:flex;justify-content:space-around;align-items:center}
.nav{color:#666;text-align:center;font-size:11px}.nav.active{color:#d4af37}
</style>
</head>
<body>
<div class="app">
<div class="content">
<div class="top"><div><div class="name">HAROLD</div><div class="lvl">👑 Lvl 1</div></div><div class="wallet">Connect Wallet</div></div>
<div class="center">
<div class="coin-wrap"><div class="halo"></div><div class="ring"></div><img class="coin" src="coin.png"></div>
<div class="bal">0.0780 HRD</div>
<button class="claim">CLAIM</button>
</div>
</div>
<div class="bottom"><div class="nav active">⛏️<br>Mine</div><div class="nav">📦<br>Tasks</div><div class="nav">⚡<br>Miners</div><div class="nav">👥<br>Friends</div></div>
</div>
</body>
</html>
