<style>*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif}body{background:#0c0a1a;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow:hidden;padding-bottom:84px}.a{width:100%;max-width:420px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center}.b{background:#1e1e2e;border-radius:20px;padding:4px 10px;font-weight:900;display:flex;align-items:center;gap:8px;border:1px solid #2a2a40}.c{width:100%;max-width:420px;padding:0 8px;display:flex;gap:4px}.d{flex:1;background:#1c1c2e;border-radius:9px;padding:5px;text-align:center;font-size:9px;border:1px solid #222}.e{width:100%;max-width:420px;padding:0 10px}.f{height:6px;background:#1a1a2e;border-radius:8px;overflow:hidden}.g{height:100%;background:linear-gradient(90deg,#ffd700,#ff9500);width:29%}.h{flex:1;display:flex;align-items:center;justify-content:center;width:100%}.i{width:220px;height:220px;display:flex;align-items:center;justify-content:center;border-radius:50%}.j{width:190px;height:190px;object-fit:contain;border-radius:50%;animation:gold 1.5s infinite alternate}.l{width:calc(100% - 10px);max-width:420px;padding:5px;display:flex;justify-content:space-between;background:#12121f;border:2px solid #ffd700;gap:3px;align-items:center;position:fixed;bottom:5px;left:50%;transform:translateX(-50%);border-radius:14px;z-index:100}.topBtn{background:#1c1c2e;border:1px solid #2a2a40;color:#fff;padding:4px 6px;border-radius:12px;font-weight:900;font-size:9px;cursor:pointer}.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.93);z-index:200;display:none;align-items:center;justify-content:center;padding:14px}.modal.show{display:flex}.box{background:#1a1a2e;width:100%;max-width:380px;border-radius:20px;padding:16px;border:2px solid #ffd700}@keyframes gold{0%{transform:scale(1)}100%{transform:scale(1.03)}}</style></head><body>
<div class="a"><div class="b"><div>💰 <span id="q">0</span></div><small id="userName" style="font-size:9px;color:#ffd700"></small></div><div style="text-align:right;font-size:11px"><span id="levelName">L1</span><br><span id="s" style="font-size:10px;color:#22c55e">SANS TOP/AMIS - TEST DB</span></div></div>
<div class="c"><div class="d">ENERGY<br><b id="e1">1500 / 1500</b></div><div class="d">LEVEL<br><b id="lv">1</b></div><div class="d">TAP<br><b id="tapPower">+1</b></div><div class="d" style="background:#333;color:#666">🏆<br><b>TOP OFF</b></div></div>

<div class="h"><div class="i"><img class="j" id="coin" src="coin.png"></div></div>

<div class="modal" id="wdModal"><div class="box"><h3>💸 Retrait - Solde Principal</h3><p>Solde: <b id="wdBal">0</b></p><button onclick="closeWithdraw()" style="margin-top:10px;background:#ff4444;color:#fff;border:0;padding:6px 12px;border-radius:8px">Fermer</button><br><small style="color:#22c55e">Ce solde vient de DB - Variable pour chacun!</small></div></div>
<script>
const U="https://kgmatxqbdyusxpiuavbw.supabase.co",K="sb_publishable_vn5kPYncLS3TtBS75hSFew_LjeISc47";
const S=supabase.createClient(U,K);
let T=window.Telegram?.WebApp;let rawId=T?.initDataUnsafe?.user?.id;let uid=rawId?String(rawId):(localStorage.getItem('uid_real')||'2120736139');localStorage.setItem('uid_real',uid);
let tgFirstName=T?.initDataUnsafe?.user?.first_name||'';let tgUsername=T?.initDataUnsafe?.user?.username||'';
let b=parseInt(localStorage.getItem('myBalance')||'0');let bestScore=parseInt(localStorage.getItem('bestScore')||'0');let e=parseInt(localStorage.getItem('myEnergy')||'1500');
let q=document.getElementById('q'),e1=document.getElementById('e1'),e2=document.getElementById('e2'),lv=document.getElementById('lv'),bf=document.getElementById('bf'),co=document.getElementById('coin');
let _lastTap=0;
const LEVELS=[{min:0,max:4999,level:1,name:"L1",tap:1,img:"coin.png"},{min:5000,max:14999,level:2,name:"L2",tap:2,img:"coin_level2.png"},{min:15000,max:49999,level:3,name:"L3",tap:5,img:"coin_level3.png"},{min:50000,max:999999999,level:4,name:"L4",tap:13,img:"coin_level4.png"}];
function getLevelInfo(c){for(let x of LEVELS){if(c>=x.min&&c<=x.max)return x}return LEVELS[0]}
function getMaxEnergy(){return 9000;} function getTapPower(){return getLevelInfo(bestScore).tap;}
function r(){if(b>bestScore)bestScore=b;let maxE=getMaxEnergy();q.textContent=Math.floor(b).toLocaleString('fr-FR');e1.textContent=e+' / '+maxE;e2.textContent=e;document.getElementById('eMax').textContent=maxE;if(bf)bf.style.width=(e/maxE*100)+'%';lv.textContent=getLevelInfo(bestScore).level;document.getElementById('levelName').textContent=getLevelInfo(bestScore).name;document.getElementById('tapPower').textContent='+'+getTapPower();co.src=getLevelInfo(bestScore).img;localStorage.setItem('myBalance',b);localStorage.setItem('bestScore',bestScore+'');localStorage.setItem('myEnergy',e);}
async function sv(){
  let finalB=Math.floor(b);
  try{
    await S.from('harold_users').upsert({id:parseInt(uid),balance:finalB,energy:e,level:getLevelInfo(bestScore).level,last_seen:new Date().toISOString(),first_name:tgFirstName||'Player',username:tgUsername},{onConflict:'id'});
    await fetch(`${U}/rest/v1/harold_users`,{method:'POST',headers:{'apikey':K,'Authorization':'Bearer '+K,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},body:JSON.stringify({id:parseInt(uid),balance:finalB,energy:e,level:getLevelInfo(bestScore).level,last_seen:new Date().toISOString(),first_name:tgFirstName||'Player',username:tgUsername})});
    document.getElementById('s').textContent='DB SYNC '+finalB.toLocaleString('fr-FR')+' ✅';
    console.log('SOLDE PRINCIPAL ENREGISTRE DB:',finalB,'pour uid',uid);
    setTimeout(()=>{document.getElementById('s').textContent='SANS TOP/AMIS - TEST DB';},2000);
  }catch(err){console.log('ERR',err); document.getElementById('s').textContent='SYNC ERR';}
}
async function ld(){r();try{let {data:d}=await S.from('harold_users').select('*').eq('id',parseInt(uid)).single();if(d&&d.balance){if(b==0){b=d.balance;}if(b>bestScore)bestScore=b;if(d.energy)e=d.energy;}}catch(e){}r();setTimeout(sv,500);}
function tp(){if(e<=0)return;let now=Date.now();if(now-_lastTap<50)return;_lastTap=now;e--;b+=getTapPower();if(b>bestScore)bestScore=b;r();sv();}
co.onclick=tp;co.ontouchstart=(e)=>{e.preventDefault();tp();};
setInterval(()=>{if(e<getMaxEnergy()){e++;r();}},1000);
ld();r();if(T){T.ready();T.expand();}
function openWithdraw(){document.getElementById('wdBal').textContent=Math.floor(b).toLocaleString('fr-FR');document.getElementById('wdModal').classList.add('show');}
function closeWithdraw(){document.getElementById('wdModal').classList.remove('show');}
</script>
</body></html>
