<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>👑 ADMIN V8.9.9 BOT NOTIF</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/tonweb@0.0.66/dist/tonweb.min.js"></script><style>*{box-sizing:border-box}body{background:#0e0e15;color:#fff;font-family:system-ui;padding:10px;margin:0}.b{padding:10px 14px;border-radius:12px;border:0;font-weight:900;margin:3px;cursor:pointer;font-size:12px}.card{background:#1c1c2a;border:2px solid #333;border-radius:16px;padding:14px;margin:12px 0;word-break:break-all}.addr{background:#0f2a1a;padding:12px;border-radius:12px;font-size:12px;margin:8px 0;border:2px dashed #22c55e;color:#4ade80;font-weight:800;cursor:pointer}.copyBtn{padding:10px 16px;border-radius:10px;border:0;font-weight:900;margin:4px 3px;cursor:pointer;font-size:11px}.txInput{width:100%;padding:10px;background:#111;border:1.5px solid #ffd700;border-radius:10px;color:#fff;margin:8px 0;font-size:11px}#notifBar{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#22c55e;color:#000;padding:12px 20px;border-radius:25px;font-weight:900;z-index:99999;display:none;max-width:92%}</style></head><body><div id="notifBar"></div><h2>👑 ADMIN V8.9.9 BOT NOTIF</h2><div style="font-size:11px;opacity:.7">✅ Preuve + ✅ Notif Chrome + ✅ Bot Telegram</div><div style="display:flex;flex-wrap:wrap"><button class="b" style="background:#ffcc00;color:#000" onclick="setF('pending')">PENDING</button><button class="b" style="background:#22c55e" onclick="setF('approved')">APPROVED</button><button class="b" style="background:#3b82f6;color:#fff" onclick="setF('paid')">PAID</button><button class="b" style="background:#444;color:#fff" onclick="setF('all')">TOUS</button><button class="b" style="background:#fff;color:#000" onclick="loadWd()">REFRESH</button></div><div id="stats" style="margin:10px 0;background:#1a1a2a;padding:8px;border-radius:8px;font-size:12px"></div><div id="list">Chargement...</div><script>
const SUPA_URL="https://kgmatxqbdyusxpiuavbw.supabase.co";const SUPA_KEY="sb_publishable_vn5kPYncLS3TtBS75hSFew_LjeISc47";const BOT_TOKEN="METS_TON_TOKEN_ICI";const supa=supabase.createClient(SUPA_URL,SUPA_KEY);let filter='pending',all=[],lastPendingCount=0,firstLoad=true;
function rawToUQ(r){try{if(!r)return'N/A';r=String(r).trim();if(r.startsWith('UQ')||r.startsWith('EQ'))return r;if(r.startsWith('0:')){return new TonWeb.utils.Address(r).toString(true,true,true,false);}}catch(e){}return r;}
function setF(f){filter=f;render();}function showBar(m,c='#22c55e'){let b=document.getElementById('notifBar');b.style.background=c;b.innerHTML=m;b.style.display='block';setTimeout(()=>b.style.display='none',5000);}
async function loadWd(){try{let {data}=await supa.from('withdrawals').select('*').order('created_at',{ascending:false}).limit(150);let pendingNow=(data||[]).filter(x=>x.status==='pending').length;if(!firstLoad&&pendingNow>lastPendingCount){showBar(`💰 +${pendingNow-lastPendingCount} NOUVEAU RETRAIT!`,'#ffcc00');}lastPendingCount=pendingNow;firstLoad=false;all=data||[];render();}catch(e){document.getElementById('stats').innerText='Erreur '+e.message;}}
function render(){let f=all;if(filter!=='all')f=all.filter(x=>x.status===filter);let total=f.reduce((s,x)=>s+parseFloat(x.amount_ton_net||x.amount_ton||0),0);document.getElementById('stats').innerHTML=`<b>${f.length}</b> | NET ${total.toFixed(6)} TON | PENDING ${all.filter(x=>x.status==='pending').length}`;let h='';f.forEach(w=>{let coins=w.amount_coins||0;let net=parseFloat(w.amount_ton_net||w.amount_ton||0)||coins/1000000*0.09;let brut=parseFloat(w.amount_ton_brut||0)||coins/1000000*0.1;let raw=w.wallet||'';let friendly=rawToUQ(raw);let tx=w.tx_hash||'';let color=w.status=='paid'?'#3b82f6':w.status=='approved'?'#22c55e':'#ffcc00';h+=`<div class="card" style="border-color:${color}"><b>${coins.toLocaleString()} → ${net.toFixed(6)} TON</b> <span style="background:${color};color:#000;padding:2px 8px;border-radius:10px;font-size:10px">${w.status}</span><br>User ${w.user_id} | ${new Date(w.created_at).toLocaleString('fr-FR')}<div class="addr" onclick="navigator.clipboard.writeText('${friendly}')">${friendly}</div>${tx?`<div style="background:#0a2a4a;padding:8px;border-radius:8px"><a href="https://tonscan.org/tx/${tx}" target="_blank" style="color:#60a5fa">${tx}</a></div>`:''}<input id="tx-${w.id}" style="width:100%;padding:10px;background:#111;border:1px solid #ffd700;border-radius:10px;color:#fff;margin:6px 0" placeholder="Hash TX Tonkeeper" value="${tx}"><div><button class="copyBtn" style="background:#22c55e" onclick="navigator.clipboard.writeText('${friendly}')">COPY UQ</button><button class="copyBtn" style="background:#3b82f6;color:#fff" onclick="saveTx('${w.id}')">💾 SAVE + PAID + BOT</button></div></div>`;});document.getElementById('list').innerHTML=h||'Aucun';}
async function saveTx(id){let hash=document.getElementById('tx-'+id).value.trim();if(!hash){alert('Colle hash TX');return;}let wd=all.find(x=>String(x.id)==String(id));if(!wd)return;let {error}=await supa.from('withdrawals').update({status:'paid',tx_hash:hash}).eq('id',id);if(error){alert(error.message);return;}all=all.map(x=>{if(String(x.id)==String(id)){x.status='paid';x.tx_hash=hash;}return x;});render();showBar('✅ PAID + Preuve + Envoi bot...');let coins=wd.amount_coins||0;let tonNet=wd.amount_ton_net||0;let msg=`💸 *Retrait Payé!* ✅\n\n💰 ${coins.toLocaleString()} 🪙 → ${parseFloat(tonNet).toFixed(6)} TON\n🔗 Preuve:\nhttps://tonscan.org/tx/${hash}\n\n👛 Vérifie Tonkeeper!\nMerci Harold Coins 👑`;try{await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:wd.user_id,text:msg,parse_mode:'Markdown',reply_markup:{inline_keyboard:[[{text:'🔍 Voir sur TonScan',url:`https://tonscan.org/tx/${hash}`}]]}})});showBar(`✅ Bot notifié user ${wd.user_id}!`,'#22c55e');}catch(e){showBar('✅ PAID mais bot échoué - vérifie token','#facc15');}}
loadWd();setInterval(loadWd,8000);
</script></body></html>
