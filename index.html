<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Haroldcoin - Play to Earn</title>
    <!-- SDK Telegram Officiel -->
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(180deg, #120c31 0%, #050312 100%);
            --accent-gold: #ffd700;
            --coin-secondary: #f3ba2f;
            --text-main: #ffffff;
            --text-muted: #8a91a5;
            --surface-blur: rgba(255, 255, 255, 0.04);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: calc(100vh - 32px);
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 1. Bannière supérieure */
        .top-banner {
            width: 100%;
            max-width: 400px;
            background: rgba(22, 17, 49, 0.7);
            border: 1px solid rgba(255, 215, 0, 0.1);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
        }

        .banner-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .wallet-icon {
            width: 40px;
            height: 40px;
            background: #2481cc;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .banner-text-title {
            font-size: 14px;
            font-weight: 600;
        }

        .banner-text-value {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .league-badge-top {
            background: rgba(255, 215, 0, 0.1);
            color: var(--accent-gold);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        /* 2. Zone du Score global */
        .score-section {
            text-align: center;
            margin-top: 5px;
        }

        .score-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .mini-coin {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent-gold), var(--coin-secondary));
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.4);
        }

        .main-score {
            font-size: 46px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .league-navigation {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 6px;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
        }

        /* 3. Zone Centrale : Le Jeton Harold Coins */
        .game-zone {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Halo lumineux derrière la pièce */
        .coin-glow {
            position: absolute;
            width: 260px;
            height: 260px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.25) 0%, rgba(255, 215, 0, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
        }

        .main-coin-btn {
            position: relative;
            z-index: 2;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            outline: none;
            touch-action: manipulation;
            transition: transform 0.05s ease;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            
            /* Configuration de secours : Jeton Or si l'image ne charge pas */
            background: linear-gradient(135deg, #ffe552 0%, #cc9900 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Intégration transparente de votre logo Haroldcoins */
        .main-coin-btn::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            /* Remplacer coin.png par le nom exact de votre image si nécessaire */
            background: url('coin.png') center/cover no-repeat; 
            z-index: 3;
        }

        /* Lettre de secours affichée en fond si votre image manque */
        .coin-fallback-text {
            font-size: 90px;
            font-weight: 900;
            color: #7a5800;
            text-shadow: 0 2px 4px rgba(255,255,255,0.2);
            z-index: 2;
        }

        .main-coin-btn:active {
            transform: scale(0.95) translateY(3px);
        }

        /* Nombre +1 flottant au clic */
        .floating-click {
            position: absolute;
            color: #ffffff;
            font-size: 32px;
            font-weight: 800;
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.8);
            animation: moveUpFade 0.6s ease-out forwards;
        }

        @keyframes moveUpFade {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(0.85); opacity: 0; }
        }

        /* 4. Barre de statut d'Énergie */
        .energy-section {
            width: 100%;
            max-width: 400px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 5px;
            padding: 0 8px;
            box-sizing: border-box;
        }

        .energy-icon-text {
            font-size: 15px;
            font-weight: 700;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .energy-progress-bg {
            flex-grow: 1;
            height: 12px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .energy-progress-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ffb700, #ffd700);
            border-radius: 10px;
            transition: width 0.1s ease;
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.4);
        }

        /* 5. Menu inférieur de navigation */
        .bottom-nav {
            width: 100%;
            max-width: 400px;
            background: var(--surface-blur);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 18px;
            display: flex;
            padding: 10px 4px;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            opacity: 0.75;
            transition: all 0.2s;
        }

        .nav-item:active {
            opacity: 1;
            transform: scale(0.92);
        }

        .nav-icon {
            font-size: 22px;
        }
    </style>
</head>
<body>

    <!-- En-tête Statut -->
    <div class="top-banner">
        <div class="banner-left">
            <div class="wallet-icon">👛</div>
            <div>
                <div class="banner-text-title">Harold Wallet</div>
                <div class="banner-text-value">Connecté</div>
            </div>
        </div>
        <div class="league-badge-top">💎 Diamond</div>
    </div>

    <!-- Section Points et Ligue -->
    <div class="score-section">
        <div class="score-row">
            <div class="mini-coin"></div>
            <div class="main-score" id="scoreDisplay">0</div>
        </div>
        <div class="league-navigation" onclick="openLeague()">
            <span>🏆 Ligue Silver</span>
            <span>›</span>
        </div>
    </div>

    <!-- Zone de jeu et Pièce Haroldcoins -->
    <div class="game-zone" id="gameZone">
        <div class="coin-glow"></div>
        <button class="main-coin-btn" id="coinBtn">
            <span class="coin-fallback-text">H</span>
        </button>
    </div>

    <!-- Section Énergie -->
    <div class="energy-section">
        <div class="energy-icon-text">⚡ <span id="energyText">1000</span></div>
        <div class="energy-progress-bg">
            <div class="energy-progress-fill" id="energyBar"></div>
        </div>
    </div>

    <!-- Menu Inférieur -->
    <div class="bottom-nav">
        <button class="nav-item" onclick="navigate('frens')">
            <span class="nav-icon">🎁</span>
