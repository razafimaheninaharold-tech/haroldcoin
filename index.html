<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0a0a0a;color:#fff;min-height:100vh;padding-bottom:80px}
.top{padding:12px;display:flex;justify-content:space-between;align-items:center}
.balance{font-size:22px;font-weight:800}
.badge{background:#1a1a1a;border:1px solid #333;padding:6px 14px;border-radius:20px;font-size:13px}
.modal{margin:12px;border:2px solid #facc15;border-radius:20px;padding:16px;background:#111}
.infoBox{background:#1a1a1a;border-radius:12px;padding:10px;margin-bottom:12px;font-size:13px}
.row{display:flex;gap:8px;margin-bottom:12px}
.row button{flex:1;padding:10px;background:#222;border:1px solid #333;border-radius:10px;color:#fff;font-weight:700}
.row button.active{background:#facc15;color:#000}
input{width:100%;padding:12px;background:#1e1e1e;border:1px solid #333;border-radius:10px;color:#fff;font-size:16px;margin-bottom:8px}
.tonLine{display:flex;justify-content:space-between;font-size:13px;margin-bottom:10px}
.green{color:#22c55e;font-weight:800}
.red{color:#ef4444}
.walletBox{background:#0f2a1a;border:1px solid #1a5a30;border-radius:10px;padding:10px;font-size:13px;margin-bottom:12px}
.btnGreen{width:100%;padding:14px;background:#22c55e;border:none;border-radius:12px;color:#000;font-weight:900;font-size:15px}
.history{margin-top:12px;background:#151515;border-radius:10px;padding:10px;font-size:12px;display:flex;justify-content:space-between}

</head>
<body>
<div class="top">
<div><div style="color:#facc15">💰</div><div class="balance">25 219</div><div style="font-size:11px;color:#aaa">Hugo Mahary</div></div>
<div class="badge">UQAN...lxkc ▼</div>
<div style="font-size:11px;text-align:right">Level 4<br>Ultimate</div>
</div>
<div class="modal">
<h2>💸 Retrait TON V8.8.3</h2>
<div class="infoBox">Solde: <b style="color:#facc15">25 219</b> 🪙<br><span style="color:#aaa">Taux: 1M = 0.1 TON | Min 50k | Frais 10%</span></div>
<div class="row"><button onclick="setPct(0.25)">25%</button><button onclick="setPct(0.50)">50%</button><button class="active" onclick="setPct(1)">MAX</button></div>
<div style="font-size:12px;color:#aaa;margin-bottom:6px">Montant coins</div>
<input id="withdrawCoins" type="number" value="50000" oninput="calcTON()">
<div class="tonLine"><span class="green" id="tonNetDisplay">0.004500 TON NET</span><span class="red" id="feeDisplay">Frais 10%: 0.000500 TON</span></div>
<div style="font-size:11px;color:#666;margin-bottom:10px" id="tonBrutDisplay">Brut: 0.005000 TON</div>
<div class="walletBox">Wallet TON: <span style="color:#facc15">UQAN...lxkc</span></div>
<button class="btnGreen" onclick="demanderRetrait()">DEMANDER RETRAIT</button>
<div class="history" id="historyLine"><span>50000 → 0.0045 TON</span><span style="color:#22c55e">paid</span></div>
</div>
<script>
const SUPABASE_URL = "https://kgmatxqbdyusxpiuavbw.supabase.co";
const SUPABASE_KEY = "sb_publishable_vn5kPYncLS3TtBS75hSFew_LjeISc47";
const TAUX = 0.1 / 1000000; const FRAIS = 0.10; const MIN = 50000;
let currentBalance = 25219;
let fullWalletRaw = "0:0d606bb005736e57686617bb1a26b8d60a9797";
let friendlyWallet = "UQAN...lxkc";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
function setPct(p){ const m=Math.min(currentBalance,1000000); const v=Math.floor(m*p); document.getElementById('withdrawCoins').value=v<MIN?MIN:v; calcTON(); }
function calcTON(){ const c=parseInt(document.getElementById('withdrawCoins').value)||0; const b=c*TAUX; const f=b*FRAIS; const n=b-f; document.getElementById('tonBrutDisplay').innerText=`Brut: ${b.toFixed(6)} TON`; document.getElementById('feeDisplay').innerText=`Frais 10%: ${f.toFixed(6)} TON`; document.getElementById('tonNetDisplay').innerText=`${n.toFixed(6)} TON NET`; return {brut:b,fee:f,net:n,coins:c}; }
async function demanderRetrait(){ const {coins,brut,fee,net}=calcTON(); if(coins<MIN) return alert(`Minimum ${MIN}`); const {error}=await supabaseClient.from('withdrawals').insert([{user_id: window.Telegram?.WebApp?.initDataUnsafe?.user?.id||123, amount_coins: coins, amount_ton_brut: brut, amount_ton_fee: fee, amount_ton_net: net, wallet: fullWalletRaw, wallet_friendly: friendlyWallet, status:'pending'}]); if(error) alert('Erreur: '+error.message); else alert(`✅ ${coins} = ${net.toFixed(6)} TON envoyée!`); document.getElementById('historyLine').innerHTML=`<span>${coins} → ${net.toFixed(6)} TON</span><span style="color:#f59e0b">pending</span>`; }
calcTON();
if(window.Telegram?.WebApp){ Telegram.WebApp.ready(); Telegram.WebApp.expand(); }
</script>
</body>
</html>
