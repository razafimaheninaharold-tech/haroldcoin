<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haroldcoin Simplifié</title>
    <style>
        body {
            margin: 0;
            background-color: #1a103c;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .score {
            font-size: 48px;
            font-weight: bold;
            color: #f1c40f;
            margin-bottom: 20px;
        }
        .coin-btn {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            border: 5px solid #f1c40f;
            overflow: hidden;
            cursor: pointer;
            background-color: #0b061d;
        }
        .coin-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="score" id="totalScore">0</div>

    <!-- Bouton gros et simple qui encaisse les clics -->
    <button class="coin-btn" id="clickArea">
        <img src="téléchargement (63) (1) (2) (1) (2) (1).jpeg" alt="Logo">
    </button>

    <script>
        let score = 0;
        const scoreDisplay = document.getElementById('totalScore');
        const clickArea = document.getElementById('clickArea');

        // La fonction la plus simple du monde pour le clic
        clickArea.onclick = function() {
            score = score + 1;
            scoreDisplay.innerText = score;
        };
    </script>
</body>
</html>
