<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Haroldcoin</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;justify-content:center}
.app{width:100%;max-width:420px;height:100vh;background:#000 url('bg.jpg') center/cover;position:relative;overflow:hidden}
.app::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,0.55);z-index:0}
.content{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;padding:12px 14px 80px}
.top{display:flex;justify-content:space-between;color:#fff}
.name{font-family:'Cinzel';font-size:26px;font-weight:900;text-shadow:0 0 20px #d4af37}
.lvl{margin-top:6px;background:linear-gradient(#fff9c4,#d4af37);color:#000;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:900;display:inline-block}
.wallet{background:rgba(0,0,0,0.7);border:1px solid #d4af37;color:#fff;padding:8px 14px;border-radius:20px;font-size:12px}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.coin{width:180px;height:180px;border-radius:50%;filter:drop-shadow(0 0 30px #d4af37)}
.balance{font-family:'Cinzel';font-size:32px;color:#f9e79f;margin-top:20px;text-shadow:0 0 20px #d4af37}
.claim{margin-top:20px;width:90%;height:60px;border:none;border-radius:20px;background:linear-gradient(#fff9c4,#d4af37);color:#000;font-family:'Cinzel';font-weight:900;font-size:24px;box-shadow:0 8px 25px rgba(212,175,55,0.5)}
.bottom{position:absolute;bottom:0;left:0;right:0;height:70px;background:rgba(0,0,0,0.9);border-top:1px solid #d4af37;display:flex;justify-content:space-around;align-items:center}
.nav{color:#8a7a5a;text-align:center;font-size:10px}.nav.active{color:#d4af37}
</style>
</head>
<body>
<div class="app">
<div class="content">
<div class="top"><div><div class="name">Harold</div><div class="lvl">👑 Lvl 1</div></div><div class="wallet">Connect</div></div>
<div class="center"><img class="coin" src="coin.png"><div class="balance" id="bal">0.0000 HRD</div><button class="claim" onclick="claim()">CLAIM</button></div>
</div>
<div class="bottom"><div class="nav active">⛏️<br>Mine</div><div class="nav">📦<br>Tasks</div><div class="nav">⚡<br>Miners</div><div class="nav">👥<br>Friends</div></div>
</div>
<script>
let b=0;
function claim(){b+=0.001;document.getElementById('bal').textContent=b.toFixed(4)+' HRD'}
</script>
</body>
</html>
