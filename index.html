<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Haroldcoin</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;display:flex;justify-content:center;overflow:hidden}
.app{width:100%;max-width:420px;height:100vh;background:#000 url('bg.jpg') center/cover no-repeat;position:relative;overflow:hidden;display:flex;flex-direction:column}
.content{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;padding:8px 14px 88px}

/* TOP - EXACT IMAGE */
.top{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,rgba(10,26,42,0.9),rgba(0,0,0,0.8));border:1.5px solid rgba(0,229,255,0.3);border-radius:18px;padding:10px 12px;box-shadow:0 0 15px rgba(0,229,255,0.15), inset 0 1px 0 rgba(255,255,255,0.05)}
.name{font-family:'Orbitron';font-size:28px;font-weight:900;color:#5ee8ff;text-shadow:0 0 12px #00e5ff;letter-spacing:1px;line-height:1}
.name span{font-size:15px;display:block;color:#5ee8ff;margin-top:2px}
.assets-pill-top{background:linear-gradient(180deg,#2a2110,#1a1508);border:2px solid #d4af37;border-radius:14px;padding:8px 16px;min-width:130px;text-align:center;box-shadow:0 0 15px rgba(212,175,55,0.5), inset 0 1px 0 rgba(255,255,255,0.1)}
.assets-label-small{font-size:10px;color:#d4af37;letter-spacing:1px;font-weight:800}
.assets-value-top{font-family:'Orbitron';font-size:16px;font-weight:900;color:#fff9c4;display:flex;align-items:center;gap:6px;justify-content:center}
.coin-mini{width:20px;height:20px;background:radial-gradient(#ffd700,#b8941f);border-radius:50%;display:inline-block}

/* MINING INDICATOR - EXACT */
.mining-plus-wrap{margin-top:12px;display:flex;justify-content:center}
.mining-plus{background:linear-gradient(90deg,#001a1f,#000);border:1.5px solid #00e5ff;border-radius:12px;padding:8px 18px;display:flex;align-items:center;gap:8px;box-shadow:0 0 12px rgba(0,229,255,0.35), inset 0 0 8px rgba(0,229,255,0.08);position:relative;clip-path:polygon(8% 0,92% 0,100% 30%,100% 70%,92% 100%,8% 100%,0% 70%,0% 30%)}
.mining-plus b{font-family:'Inter';font-size:22px;font-weight:900;color:#00ff88;text-shadow:0 0 8px #00ff88}
.mining-plus span{font-size:13px;color:#00e5ff}
.mining-plus i{font-style:normal;color:#00ff88;font-size:16px}

/* COIN CENTER - EXACT IMAGE */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-top:6px}
.coin-wrap{position:relative;width:180px;height:180px;display:flex;align-items:center;justify-content:center}
.coin-ring-outer{position:absolute;width:180px;height:180px;border-radius:50%;border:2px dashed rgba(255,215,0,0.2);box-shadow:0 0 20px rgba(255,215,0,0.15)}
.mining-circle{position:absolute;width:180px;height:180px;transform:rotate(-90deg);z-index:10}
.mining-circle circle{fill:none;stroke-linecap:round}
.track{stroke:rgba(255,215,0,0.12);stroke-width:6px;stroke-dasharray:4 8}
.progress{stroke:#FFD700;stroke-width:7px;stroke-dasharray:330;stroke-dashoffset:120;filter:drop-shadow(0 0 12px #FFD700);transition:stroke-dashoffset 0.5s ease}
.coin{width:125px;height:125px;z-index:5;border-radius:50%;background:radial-gradient(circle at 30% 30%, #fff9c4, #ffd700, #b8941f, #7a5a0a);display:flex;align-items:center;justify-content:center;font-family:'Cinzel';font-weight:900;font-size:42px;color:#7a5a0a;text-shadow:0 1px 0 #fff, 0 2px 4px rgba(0,0,0,0.5);box-shadow:0 0 25px rgba(212,175,55,0.6), inset 0 2px 5px rgba(255,255,255,0.8), inset 0 -3px 5px rgba(0,0,0,0.4);border:3px solid #d4af37}

/* POWER BAR - EXACT IMAGE */
.power-wrap{margin-top:18px;width:94%;position:relative}
.power-label{position:absolute;top:-16px;right:12px;font-size:11px;color:#ff8c00;font-family:'Orbitron';font-weight:700;background:rgba(0,0,0,0.6);padding:2px 8px;border-radius:10px;border:1px solid rgba(255,140,0,0.3)}
.power-bar{width:100%;height:30px;background:linear-gradient(90deg,#000,#111);border:1.8px solid #00e5ff;border-radius:12px;position:relative;display:flex;align-items:center;padding:4px 4px 4px 48px;box-shadow:0 0 15px rgba(0,229,255,0.3), inset 0 2px 3px rgba(255,255,255,0.05);clip-path:polygon(2% 0,98% 0,100% 50%,98% 100%,2% 100%,0% 50%)}
.power-fill{height:18px;background:repeating-linear-gradient(90deg,#00e5ff 0px,#00e5ff 8px,#00ffcc 8px,#00ffcc 16px,#ffaa00 16px,#ff8c00 24px);background-size:40px 100%;border-radius:6px;width:72%;box-shadow:0 0 10px #00e5ff;animation:flow 1.5s linear infinite;clip-path:polygon(0 0,95% 0,100% 50%,95% 100%,0 100%)}
@keyframes flow{0%{background-position:0 0}100%{background-position:40px 0}}
.power-icon{position:absolute;left:-6px;top:50%;transform:translateY(-50%);width:46px;height:46px;background:linear-gradient(135deg,#111,#000);border:2.5px solid #ff8c00;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;z-index:3;box-shadow:0 0 15px #ff8c00, inset 0 1px 2px rgba(255,255,255,0.2)}

/* CLAIM - EXACT 3D BONBON IMAGE */
.claim{margin-top:18px;width:96%;height:68px;border:none;border-radius:34px;background:linear-gradient(90deg,#00e5ff 0%,#3af0ff 22%,#ffd07a 55%,#ff9c2a 75%,#ff8c00 100%);color:#000;font-family:'Orbitron';font-weight:900;font-size:32px;letter-spacing:2px;box-shadow:0 7px 0 #b85c00, 0 10px 30px rgba(0,229,255,0.5), 0 0 35px rgba(255,140,0,0.5), inset 0 3px 0 rgba(255,255,255,0.8), inset 0 -3px 3px rgba(0,0,0,0.2);cursor:pointer;z-index:20;display:block;text-shadow:0 2px 0 rgba(255,255,255,0.6), 0 1px 1px rgba(0,0,0,0.2);transform:translateY(0);transition:all 0.1s;position:relative;overflow:hidden}
.claim:before{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,0.4),transparent);border-radius:34px}
.claim:active{transform:translateY(5px);box-shadow:0 2px 0 #b85c00, 0 4px 15px rgba(0,229,255,0.5)}
.claim-ready{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 7px 0 #b85c00, 0 10px 30px rgba(0,229,255,0.5)}50%{box-shadow:0 7px 0 #b85c00, 0 10px 40px rgba(0,229,255,0.8), 0 0 50px rgba(255,140,0,0.7)}}

.claim-sub{margin-top:10px;font-size:11px;color:#5ee8ff;font-family:'Inter';display:flex;align-items:center;gap:6px}
.claim-sub b{color:#ff8c00}

/* BOTTOM MENU 3D - EXACT IMAGE */
.bottom{position:absolute;bottom:0;left:0;right:0;height:88px;background:linear-gradient(180deg,#0e0e0e,#000);border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;z-index:999;padding:8px 10px 10px;border-radius:26px 26px 0 0;box-shadow:0 -6px 25px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.06)}
.nav{flex:1;max-width:86px;height:68px;background:linear-gradient(180deg,#1e1e1e,#121212);border:1.5px solid #2a2a2a;border-radius:18px;color:#666;text-align:center;font-size:12px;font-family:'Inter';font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;box-shadow:inset 0 1px 2px rgba(255,255,255,0.06), 0 3px 8px rgba(0,0,0,0.6), inset 0 -1px 1px rgba(0,0,0,0.5);transition:all 0.2s;margin:0 4px}
.nav i{font-style:normal;font-size:26px;filter:drop-shadow(0 2px 2px rgba(0,0,0,0.8))}
.nav.active{background:linear-gradient(180deg,#222,#111);border:2px solid #d4af37;color:#ffdb6b;box-shadow:inset 0 1px 3px rgba(255,255,255,0.1), 0 0 18px rgba(212,175,55,0.5), 0 4px 10px rgba(0,0,0,0.7);transform:translateY(-4px) scale(1.02)}
.nav.active i{filter:drop-shadow(0 0 8px #d4af37)}
.page{display:none;flex:1;overflow-y:auto}.page.active{display:flex;flex-direction:column}
#page-mine.active{justify-content:flex-start}
.miners-head{margin-bottom:10px}
.miners-title{font-family:'Cinzel';font-size:18px;color:#fff;font-weight:900;text-shadow:0 0 10px #d4af37}
.miners-sub{font-family:'Inter';font-size:11px;color:#aaa;margin-top:3px}
.miner-card{background:linear-gradient(135deg, rgba(22,22,22,0.98), rgba(0,0,0,0.99));border:1.2px solid rgba(212,175,55,0.28);border-radius:13px;padding:10px 11px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.miner-icon{width:42px;height:42px;border-radius:10px;background:#111;border:1px solid #333;display:flex;align-items:center;justify-content:center;font-size:20px}
.miner-info{flex:1;min-width:0}.miner-lvl{font-size:10px;font-weight:800;color:#888}.miner-price{font-size:16px;font-weight:900;color:#00ff88}.miner-hold{font-size:9px;color:#666}.miner-speed{font-size:10px;font-weight:700;color:#d4af37}
.miner-btn{padding:7px 10px;border-radius:8px;border:none;font-weight:900;font-size:10px;min-width:70px;cursor:pointer}
.btn-active{background:linear-gradient(#fff9c4,#d4af37);color:#000}.btn-need{background:linear-gradient(#ffeda0,#ffaa00);color:#000}.btn-locked{background:#222;color:#666;border:1px solid #333}.btn-max200{background:linear-gradient(#ffd700,#ff8c00);color:#000}
</style>
</head>
<body>
<div class="app">
<div class="content">
<div class="top"><div><div class="name">HAROLD<span>Lvl 1</span></div></div><div class="assets-pill-top"><div class="assets-label-small">ASSETS</div><div class="assets-value-top"><span class="coin-mini"></span><span id="assetsTop">0,0880 HRD</span></div></div></div>

<div class="page active" id="page-mine">
<div class="mining-plus-wrap"><div class="mining-plus">mining <b id="miningPlus">+0.0024</b> <span>HRD</span> <i>↗️</i></div></div>

<div class="center">
<div class="coin-wrap">
<div class="coin-ring-outer"></div>
<svg class="mining-circle" viewBox="0 0 180 180"><circle class="track" cx="90" cy="90" r="55"></circle><circle class="progress" id="progressCircle" cx="90" cy="90" r="55"></circle></svg>
<div class="coin" id="coinEl">HRD</div>
</div>

<div class="power-wrap">
<div class="power-label">MINING BOOST • <span id="boostTxt">72%</span></div>
<div class="power-bar"><div class="power-icon">⚡</div><div class="power-fill" id="powerFill"></div></div>
</div>

<button class="claim" id="claimBtn">CLAIM</button>
<div class="claim-sub">🕒 <span id="claimSub">Ready to claim in 12s • Auto-claim enabled</span> <b>•</b></div>
</div>
</div>

<div class="page" id="page-miners"><div class="miners-head"><div class="miners-title">MINERS • 200 MAX 👑</div><div class="miners-sub">LVL 1/200 • Scroll pour voir les 200 levels</div></div><div id="minersList"></div></div>
<div class="page" id="page-tasks"><div class="miners-title">TASKS 📦</div><div style="color:#666;font-size:13px;text-align:center;margin-top:50px">Bientôt disponible...</div></div>
<div class="page" id="page-friends"><div class="miners-title">FRIENDS 👥</div><div style="color:#666;font-size:13px;text-align:center;margin-top:50px">Bientôt disponible...</div></div>
</div>

<div class="bottom">
<div class="nav active" data-page="mine"><i>⛏️</i>Mine</div>
<div class="nav" data-page="tasks"><i>📦</i>Tasks</div>
<div class="nav" data-page="miners"><i>⚡</i>Miners</div>
<div class="nav" data-page="friends"><i>👥</i>Friends</div>
</div>
</div>

<script>
function showPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  document.querySelectorAll('.nav').forEach(n=>n.classList.remove('active'));
  document.querySelector(`.nav[data-page="${name}"]`).classList.add('active');
  if(window.Telegram?.WebApp?.HapticFeedback) Telegram.WebApp.HapticFeedback.impactOccurred('light');
}
document.querySelectorAll('.nav').forEach(nav=>{
  const h=(e)=>{e.preventDefault();e.stopPropagation();showPage(nav.dataset.page);};
  nav.addEventListener('click',h); nav.addEventListener('touchend',h,{passive:false});
});
let balance=0.0880;let mining=0.0024;let progress=0;
const circle=document.getElementById('progressCircle');
const assetsTop=document.getElementById('assetsTop');
const miningPlus=document.getElementById('miningPlus');
const powerFill=document.getElementById('powerFill');
const btn=document.getElementById('claimBtn');
const boostTxt=document.getElementById('boostTxt');
const claimSub=document.getElementById('claimSub');
const circ=2*Math.PI*55;circle.style.strokeDasharray=circ;circle.style.strokeDashoffset=circ;
function updateUI(){
  assetsTop.textContent=`${balance.toFixed(4).replace('.',',')} HRD`;
  miningPlus.textContent=`+${mining.toFixed(4)}`;
  powerFill.style.width=progress+'%';
  boostTxt.textContent=Math.floor(progress)+'%';
  circle.style.strokeDashoffset=circ-(circ*progress/100);
  if(progress>=100){btn.textContent='CLAIM READY';btn.classList.add('claim-ready');claimSub.textContent='Ready to claim now! Tap to collect';}
  else{claimSub.textContent=`Ready to claim in ${Math.max(0,12-Math.floor(progress/8))}s • Auto-claim enabled`;}
}
let iv=setInterval(()=>{if(progress<100){progress+=0.6;mining+=0.00002;updateUI();}else{clearInterval(iv);updateUI();}},100);
btn.addEventListener('click',()=>{
  if(progress>=100){
    balance+=mining;mining=0.0024;progress=0;btn.textContent='CLAIM';btn.classList.remove('claim-ready');
    updateUI();
    iv=setInterval(()=>{if(progress<100){progress+=0.6;mining+=0.00002;updateUI();}else{clearInterval(iv);updateUI();}},100);
    if(window.Telegram?.WebApp?.HapticFeedback) Telegram.WebApp.HapticFeedback.notificationOccurred('success');
  }
});
updateUI();
const list=document.getElementById('minersList');let html='';
for(let lvl=1;lvl<=200;lvl++){
  let price,hrd,hold,btnClass,btnText;
  if(lvl===1){price='0$';hrd=0;hold=0;btnClass='btn-active';btnText='ACTIVE';}
  else if(lvl===2){price='0.317$';hrd=317;hold=1000;btnClass='btn-need';btnText='NEED 1000';}
  else if(lvl===200){price='2.500$';hrd=25000;hold=100000;btnClass='btn-max200';btnText='MAX 200 👑';}
  else {price=(0.42+(lvl-8)*0.015).toFixed(3)+'$';hrd=4200+(lvl-8)*120;hold=8000+(lvl-8)*800;btnClass='btn-locked';btnText='🔒 LOCKED';}
  const speed=(0.20+(lvl-1)*0.015).toFixed(2);
  const icon=lvl===200?'👑':['🔧','💎','🏆','👑','🚀','🌟'][lvl%6];
  html+=`<div class="miner-card"><div class="miner-icon">${icon}</div><div class="miner-info"><div class="miner-lvl">LVL ${lvl}</div><div class="miner-price">${price}</div><div class="miner-hold">${hrd} HRD • HOLD ${hold.toLocaleString()} HRD</div><div class="miner-speed">⚡ ${speed} TH/s</div></div><button class="miner-btn ${btnClass}" data-lvl="${lvl}">${btnText}</button></div>`;
}
list.innerHTML=html;
</script>
</body>
</html>
