<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haroldcoins Game</title>
    <style>
        body {
            margin: 0;
            background-color: #1a103c;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        .header {
            margin-top: 30px;
            text-align: center;
            width: 100%;
        }
        .username {
            font-size: 16px;
            color: #a29bfe;
            font-weight: bold;
        }
        .score-container {
            font-size: 48px;
            font-weight: 900;
            color: #f1c40f;
            text-shadow: 0 0 15px rgba(241, 196, 15, 0.5);
            margin-top: 5px;
        }
        .level-badge {
            display: inline-block;
            background-color: #251752;
            color: #f1c40f;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-top: 5px;
            border: 1px solid rgba(241, 196, 15, 0.3);
        }
        .coin-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            width: 100%;
        }
        .coin {
            width: 240px;
            height: 240px;
            cursor: pointer;
            transition: transform 0.05s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
            border-radius: 50%;
            border: 4px solid #f1c40f;
            overflow: hidden;
            background-color: #0b061d;
            box-shadow: 0 10px 25px rgba(241, 196, 15, 0.3);
        }
        .coin img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
            transition: filter 0.5s ease;
        }
        .coin:active {
            transform: scale(0.92);
        }
        
        /* Styles des filtres magiques pour chaque niveau */
        .lvl-1 img { filter: drop-shadow(0px 10px 20px rgba(241, 196, 15, 0.3)); }
        .lvl-2 img { filter: drop-shadow(0px 0px 25px #f1c40f) saturate(1.4); }
        .lvl-3 img { filter: drop-shadow(0px 0px 25px #00cec9) hue-rotate(140deg); }
        .lvl-4 img { filter: drop-shadow(0px 0px 25px #2ecc71) hue-rotate(60deg) brightness(1.2); }
        .lvl-5 img { filter: drop-shadow(0px 0px 30px #e74c3c) hue-rotate(290deg) contrast(1.3); }

        .game-status {
            width: 85%;
            margin-bottom: 15px;
        }
        .energy-text {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .energy-bar-bg {
            width: 100%;
            height: 12px;
            background-color: #2d1f5d;
            border-radius: 10px;
            overflow: hidden;
        }
        .energy-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #f1c40f, #e67e22);
            border-radius: 10px;
            transition: width 0.1s ease;
        }
        .nav-menu {
            width: 100%;
            background-color: #251752;
            display: flex;
            justify-content: space-around;
            padding: 12px 0 25px 0;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.3);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #b2bec3;
            font-size: 12px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }
        .nav-item .icon {
            font-size: 22px;
            margin-bottom: 4px;
        }
        .nav-item.active {
            color: #f1c40f;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="username">⭐ Harold Trader</div>
        <div class="score-container" id="score">0</div>
        <div class="level-badge" id="levelName">Niveau 1 : Débutant 🪙</div>
    </div>

    <div class="coin-container">
        <div class="coin lvl-1" id="coinBtn">
            <img src="téléchargement (63) (1) (2) (1) (2) (1).jpeg" alt="Haroldcoins Logo">
        </div>
    </div>

    <div class="game-status">
        <div class="energy-text">
            🟡 <span id="energyText">1000/1000</span>
        </div>
        <div class="energy-bar-bg">
            <div class="energy-bar-fill" id="energyFill"></div>
        </div>
    </div>

    <div class="nav-menu">
        <div class="nav-item">
            <span class="icon">💰</span>
            <span>Gagner</span>
        </div>
        <div class="nav-item">
            <span class="icon">👥</span>
            <span>Amis</span>
        </div>
        <div class="nav-item">
            <span class="icon">🛠️</span>
            <span>Bâtir</span>
        </div>
        <div class="nav-item active">
            <span class="icon">🏠</span>
            <span>Mon</span>
        </div>
    </div>

    <script>
        let score = 0;
        let energy = 1000;
        const maxEnergy = 1000;

        const scoreDisplay = document.getElementById('score');
        const coinButton = document.getElementById('coinBtn');
        const energyText = document.getElementById('energyText');
        const energyFill = document.getElementById('energyFill');
        const levelName = document.getElementById('levelName');

        function checkLevel() {
            coinButton.className = "coin"; 
            
            if (score < 2000) {
                coinButton.classList.add("lvl-1");
                levelName.textContent = "Niveau 1 : Débutant 🪙";
                levelName.style.color = "#ffffff";
            } else if (score >= 2000 && score < 10000) {
                coinButton.classList.add("lvl-2");
                levelName.textContent = "Niveau 2 : Trader Pro ✨";
                levelName.style.color = "#f1c40f";
            } else if (score >= 10000 && score < 50000) {
                coinButton.classList.add("lvl-3");
                levelName.textContent = "Niveau 3 : Crypto Whale 💎";
                levelName.style.color = "#00cec9";
            } else if (score >= 50000 && score < 200000) {
                coinButton.classList.add("lvl-4");
                levelName.textContent = "Niveau 4 : Maître du Marché 🟢";
                levelName.style.color = "#2ecc71";
            } else {
                coinButton.classList.add("lvl-5");
                levelName.textContent = "Niveau 5 : Empereur d'Haroldcoin 🔥";
                levelName.style.color = "#e74c3c";
            }
        }

        coinButton.addEventListener('click', () => {
            if (energy > 0) {
                score += 14; 
                energy--;
                
                scoreDisplay.textContent = score.toLocaleString();
                energyText.textContent = `${energy}/${maxEnergy}`;
                energyFill.style.width = `${(energy / maxEnergy) * 100}%`;
                
                checkLevel(); 
                
                if (navigator.vibrate) {
                    navigator.vibrate(40);
                }
            }
        });

        setInterval(() => {
            if (energy < maxEnergy) {
                energy++;
                energyText.textContent = `${energy}/${maxEnergy}`;
                energyFill.style.width = `${(energy / maxEnergy) * 100}%`;
            }
        }, 1000);
    </script>
</body>
</html>
